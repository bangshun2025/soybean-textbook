ss=\"tick\">☐</span> 项目所在县当年的耕地地力保护补贴标准与发放对象认定规则</div><div class=\"todo\"><span class=\"tick\">☐</span> 广西是否有大豆或带状复合种植的省级/市县级专项补贴与当年项目任务区范围</div><div class=\"todo\"><span class=\"tick\">☐</span> 承保公司名单、投保窗口期、验标要求与所需材料清单</div><div class=\"todo\"><span class=\"tick\">☐</span> 保单条款中的起赔点、免赔率、除外责任具体表述（需要调取样单阅读）</div><div class=\"todo\"><span class=\"tick\">☐</span> 当年中央一号文件与农业农村部实施意见中涉大豆的具体表述</div><h2 id=\"sec-23\">参考来源</h2><ul><li>财政部金融司：<a href=\"http://jrs.mof.gov.cn/zhengcefabu/phjr/202409/t20240926_3944456.htm\" target=\"_blank\" rel=\"noopener\">关于做好农业保险高质量发展有关工作的通知（财金〔2024〕83号）——保障水平不高于产值80%、中央对中西部及东北补贴45%、省级不低于25%、综合费用率不高于20%</a></li></ul><ul><li>中央一号文件（2025）：<a href=\"https://m.12371.gov.cn/content/2025-02/23/content_484970.html\" target=\"_blank\" rel=\"noopener\">关于进一步深化农村改革扎实推进乡村全面振兴的意见</a></li></ul><h2 id=\"sec-24\">修订记录</h2><div class=\"tbl-wrap\"><table><tr><td>版本</td><td>日期</td><td>修订内容</td></tr><tr><td>v1.0</td><td>2026-10-04</td><td>建立第七讲：补贴体系（6张卡）+ 农业保险（12张卡）</td></tr><tr><td>v1.1</td><td>2026-10-04</td><td>校正用字：玉米、高枕无忧</td></tr></table></div>"}, {"no": "10", "id": "1cc50297-5422-4785-aeb8-f10b7c73f415", "head": "第八讲", "sub": "成本收益模型与风控", "tag": "第八讲", "num": "8", "secs": 26, "cards": 18, "mins": 4, "cardinfo": "· 18 张名词卡", "html": "<div class=\"callout\"><span class=\"co-icon\">🧮</span><div>教材第八讲｜对应大纲第十三部分（成本—收益模型与风控）<ul><li>卡片格式：<strong>名词 → 大白话 → 为什么重要 → 新手最常踩的坑</strong>（卡编号接第七讲，从143开始）</li></ul><ul><li>版本：v1.0｜写作日期：2026-10-04｜对话轮次：0010</li></ul><ul><li>上游大纲：<a href=\"https://app.notion.com/p/2154c1eab76a4e9aa8111f0bd9db7e6d\" target=\"_blank\" rel=\"noopener\">广西大豆种植投资基础常识 · 全流程大纲（0001）</a>｜上一讲：<a href=\"https://app.notion.com/p/e24165facd0348b3aa7012c1c866001b\" target=\"_blank\" rel=\"noopener\">大豆教材·第七讲｜政策补贴与农业保险（名词卡）</a></li></ul><ul><li>本讲定位：<strong>前七讲是变量，这一讲是方程</strong>。所有技术细节最终都要落到一张表上，变成一个数字：投，还是不投。</li></ul></div></div><h2 id=\"sec-1\">一、算账的基本单位</h2><h3 id=\"sec-2\">143｜单位经济（按每亩算账）</h3><ul><li><strong>大白话</strong>：不看总投资多少，先把一亩地的收支算清楚，再乘亩数。</li></ul><ul><li><strong>为什么重要</strong>：<strong>单亩算不赢，扩规模只会输得更快</strong>。农业的规模效应很弱，地租、农资、作业费几乎都是线性增长的。这一条和软件生意的逻辑完全相反。</li></ul><ul><li><strong>常见坑</strong>：用「总投入 300 万、预期产值 400 万」这种总量叙事做决策，掩盖了单亩细节里的漏洞。</li></ul><h3 id=\"sec-3\">144｜可机作业亩（有效种植面积）</h3><ul><li><strong>大白话</strong>：租了 100 亩，扣掉田埂、排水沟、车道、边角和机器进不去的地块，实际能收东西的可能只有八十几亩。</li></ul><ul><li><strong>为什么重要</strong>：<strong>租金按全部面积付，收入按有效面积来</strong>。广西地块碎、坡地多，这个折损比北方平原大得多（承第一讲卡12）。</li></ul><ul><li><strong>常见坑</strong>：用合同亩数做产量测算，开头就高估了十几个点。</li></ul><h3 id=\"sec-4\">145｜入仓商品亩产</h3><ul><li><strong>大白话</strong>：真正能卖钱的那部分产量，而不是田里长出来的产量。</li></ul><ul><li><strong>为什么重要</strong>：承第六讲卡109。<strong>模型里的亩产必须是「品种实收亩产 × 机收得率 × 扣水扣杂后折算率」</strong>，不是品种宣传数字。</li></ul><ul><li><strong>常见坑</strong>：直接拿品种宣传的最高实收亩产乘价格。正确做法：<strong>用广西区域平均亩产做基准，把品种宣传值当乐观情景</strong>。</li></ul><h3 id=\"sec-5\">146｜直接成本与间接成本</h3><ul><li><strong>大白话</strong>：直接成本 = 种子肥料农药作业费地租这些能挂到亩上的；间接成本 = 管理人工费、差旅、办公、融资利息、试错损失。</li></ul><ul><li><strong>为什么重要</strong>：<strong>新手的模型几乎都只算直接成本</strong>。但你是异地、零基础入局，这类间接成本会很高——请专家、跑现场、沟通成本都是真实支出。</li></ul><ul><li><strong>常见坑</strong>：把自己的时间和合伙人的时间记作零成本。</li></ul><h3 id=\"sec-6\">147｜固定成本与可变成本</h3><ul><li><strong>大白话</strong>：固定成本 = 不管收多少都要花的（地租、农机折旧、管理薪酬）；可变成本 = 跟面积和作业量走的。</li></ul><ul><li><strong>为什么重要</strong>：<strong>第一年的核心原则是把固定成本压到最低</strong>（承第一讲卡13：不买农机、用社会化服务）。固定成本高的结构在试错期是致命的，它让你失去「第二年缩规模」的退路。</li></ul><ul><li><strong>常见坑</strong>：为了省每亩作业费而买农机，把可变成本换成固定成本——在未验证的项目上这是反向操作。</li></ul><h2 id=\"sec-7\">二、两个最关键的数字</h2><h3 id=\"sec-8\">148｜保本亩产</h3><ul><li><strong>大白话</strong>：在当前价格下，每亩至少要收多少公斤才不亏本。</li></ul><ul><li><strong>公式</strong>：<strong>保本亩产（公斤）= 每亩总成本 ÷ 地头价（元/公斤）</strong></li></ul><ul><li><strong>为什么重要</strong>：<strong>把这个数字和广西平均亩产放在一起看，就是立项决策的第一道门槛</strong>。公开资料显示广西大豆平均亩产在 100 多公斤水平，示范方式可达 220 公斤。<strong>如果你算出的保本亩产接近或超过区域平均亩产，这个项目在账面上就已经不成立</strong>。</li></ul><ul><li><strong>常见坑</strong>：先定规模再算账。顺序应该反过来。</li></ul><h3 id=\"sec-9\">149｜保本价</h3><ul><li><strong>大白话</strong>：在预期亩产下，每公斤至少要卖多少钱才不亏本。</li></ul><ul><li><strong>公式</strong>：<strong>保本价（元/公斤）= 每亩总成本 ÷ 入仓商品亩产（公斤）</strong></li></ul><ul><li><strong>为什么重要</strong>：<strong>这就是第六讲卡124 说的「最低可接受价」</strong>。没有它，卖货时你没有任何谈判基准；有了它，订单合同的保底价该定多少一目了然。</li></ul><ul><li><strong>常见坑</strong>：算保本价时用「到厂价」或网上行情价做对标，实际该用地头价（承第六讲卡113）。</li></ul><h3 id=\"sec-10\">150｜每亩成本清单（空白测算表）</h3><ul><li><strong>大白话</strong>：把一亩地要花的钱逐项列出来，一项不漏。</li></ul><ul><li><strong>怎么用</strong>：下表是框架，<strong>金额栏必须由你在当地实地询价填入</strong>。本教材不提供猜测数值。</li></ul><div class=\"tbl-wrap\"><table><tr><td>成本项</td><td>类型</td><td>每亩金额（元）</td><td>数据来源</td></tr><tr><td>地租</td><td>固定</td><td>待填</td><td>流转合同</td></tr><tr><td>整地与排水沟整修</td><td>首年一次性</td><td>待填</td><td>当地机手报价</td></tr><tr><td>调酸（石灰/土壤调理剂）</td><td>可变</td><td>待填</td><td>土测报告+农资价</td></tr><tr><td>种子</td><td>可变</td><td>待填</td><td>种业公司</td></tr><tr><td>根瘤菌接种剂</td><td>可变</td><td>待填</td><td>农资店</td></tr><tr><td>底肥（磷钾为主）</td><td>可变</td><td>待填</td><td>农资店</td></tr><tr><td>微量元素与叶面肥</td><td>可变</td><td>待填</td><td>农资店</td></tr><tr><td>除草剂（封闭+苗后）</td><td>可变</td><td>待填</td><td>农资店</td></tr><tr><td>杀虫杀菌剂（含初荚期蝨象专防）</td><td>可变</td><td>待填</td><td>植保方案</td></tr><tr><td>机播作业费</td><td>可变</td><td>待填</td><td>农机合作社</td></tr><tr><td>飞防作业费（×次数）</td><td>可变</td><td>待填</td><td>服务队报价</td></tr><tr><td>机收作业费</td><td>可变</td><td>待填</td><td>农机合作社</td></tr><tr><td>人工（补苗/巡田/装卸）</td><td>可变</td><td>待填</td><td>当地日工价</td></tr><tr><td>烘干费</td><td>可变</td><td>待填</td><td>烘干点报价</td></tr><tr><td>运输与装卸</td><td>可变</td><td>待填</td><td>车队报价</td></tr><tr><td>保险自缴保费</td><td>可变</td><td>待填</td><td>承保公司</td></tr><tr><td>管理与差旅分摊</td><td>固定</td><td>待填</td><td>自估</td></tr><tr><td>资金利息/机会成本</td><td>固定</td><td>待填</td><td>自估</td></tr><tr><td><strong>每亩总成本 C</strong></td><td></td><td><strong>待汇总</strong></td><td></td></tr></table></div><h3 id=\"sec-11\">151｜投入产出比与利润率</h3><ul><li><strong>大白话</strong>：投 1 元收回多少元；每 100 元营收里剩多少利润。</li></ul><ul><li><strong>为什么重要</strong>：农业种植环节的利润率<strong>本身就薄</strong>，而且资金周转一年一次。拿它和你熟悉的业务比较资金效率是必要的一步。</li></ul><ul><li><strong>常见坑</strong>：只看绝对利润额，不看<strong>年化资金回报率</strong>和资金占用时长。</li></ul><h2 id=\"sec-12\">三、现金流与止损</h2><h3 id=\"sec-13\">152｜资金峰值</h3><ul><li><strong>大白话</strong>：整个周期里，某一时刻你累计掏出去而还没收回来的钱的最大值。</li></ul><ul><li><strong>为什么重要</strong>：<strong>对现金流紧张的人，资金峰值比总投资额更危险</strong>。它决定你会不会在收获前两个月资金断裂——而那正是投入最密集、离回款最近、最不能停的阶段。</li></ul><ul><li><strong>常见坑</strong>：只准备了「总预算」的钱，没做月度现金流表，不知道哪个月要掏最多。</li></ul><h3 id=\"sec-14\">153｜现金流时间轴（支出前置、回笼单点）</h3><ul><li><strong>大白话</strong>：租金、种子、肥料、整地都在开头付，钱全部在最后一次性回来（还可能带账期）。</li></ul><ul><li><strong>为什么重要</strong>：这是第一讲「单季现金流」矛盾的量化版本。<strong>配上第六讲卡118（上市期压价）和卡119（账期），意味着实际回款可能比收获还要晚一到三个月</strong>。</li></ul><ul><li><strong>常见坑</strong>：按「收获即回款」做资金安排。</li></ul><h3 id=\"sec-15\">154｜沉没成本与止损点</h3><ul><li><strong>大白话</strong>：已经花出去收不回来的钱叫沉没成本；止损点是事先定好的「到这个程度就不再追加」的线。</li></ul><ul><li><strong>为什么重要</strong>：农业有一个残酷特点：<strong>苗已经死了一半时，追加投入往往不如放弃</strong>，但人的本能是「已经投这么多了不能半途而废」。应该在播种前就用数字定好：保苗率低于多少、实测苗情差到什么程度，就不再投追肥和植保。</li></ul><ul><li><strong>常见坑</strong>：一路追加到收获，结果损失翻倍。</li></ul><h2 id=\"sec-16\">四、把不确定性算出来</h2><h3 id=\"sec-17\">155｜敏感性分析</h3><ul><li><strong>大白话</strong>：把最关键的几个变量各自上下波动，看利润变成什么样。</li></ul><ul><li><strong>怎么做</strong>：固定其他条件，让<strong>亩产</strong>和<strong>单价</strong>各自 ±20%，填满下表（单元格 = 每亩净利）：</li></ul><div class=\"tbl-wrap\"><table><tr><td>亩产 \\ 单价</td><td>单价 −20%</td><td>基准单价</td><td>单价 +20%</td></tr><tr><td>亩产 −20%</td><td>最坏场景</td><td></td><td></td></tr><tr><td>基准亩产</td><td></td><td>基准场景</td><td></td></tr><tr><td>亩产 +20%</td><td></td><td></td><td>最好场景</td></tr></table></div><ul><li><strong>为什么重要</strong>：<strong>左上角那个格子是你真正要决策的数字</strong>。亩产和价格对农业而言是乘法关系，双重下滑不是下滑 40% 而是下滑 36%——这是比大多数人直觉更痛的量级。</li></ul><ul><li><strong>常见坑</strong>：只做一套「合理假设」的模型，没有最坏场景。</li></ul><h3 id=\"sec-18\">156｜情景分析（乐观/基准/悲观）</h3><ul><li><strong>大白话</strong>：不是单个变量动，而是整套假设成组地换。比如悲观场景 = 遇湿涝 + 症青发生 + 上市期压价。</li></ul><ul><li><strong>为什么重要</strong>：农业的坏事<strong>倾向于同时发生</strong>（连雨→湿涝+病害+无法打药+机收困难+烘干排队）。单变量敏感性会低估这种联动。</li></ul><ul><li><strong>常见坑</strong>：把风险当成独立事件分别评估。</li></ul><h3 id=\"sec-19\">157｜风险矩阵（概率 × 影响）</h3><ul><li><strong>大白话</strong>：把所有风险按「多大可能发生」和「发生了损失多大」摆进四个格子。</li></ul><ul><li><strong>为什么重要</strong>：<strong>资源要全部扑在「高概率 + 高影响」那一格</strong>。以前七讲来看，落在这一格的是：品种不适应（第一/二讲）、湿涝（第四讲）、症青（第五讲）、卖不出价（第六讲）。<strong>其余全部是次要矛盾</strong>。</li></ul><ul><li><strong>常见坑</strong>：在低影响的细节上耗费大量精力（比如纠结肥料品牌），却没做症青防控预案。</li></ul><h3 id=\"sec-20\">158｜风险对冲工具组合</h3><ul><li><strong>大白话</strong>：不靠单一手段，而是几种叠加：小面积试种 + 多品种并行 + 分期播种 + 政策性保险 + 订单保底。</li></ul><ul><li><strong>为什么重要</strong>：<strong>分期播种是被严重低估的一招</strong>——把播期拉开两三个批次，可以避免开花结荚期整体撞上同一场极端天气，同时把收获和烘干的峰值压力错开。成本极低，效果极大。</li></ul><ul><li><strong>常见坑</strong>：只依赖保险一种工具（而它只赔成本，见第七讲）。</li></ul><h3 id=\"sec-21\">159｜试种规模决策</h3><ul><li><strong>大白话</strong>：第一年种多少亩，是一个理性计算题而不是野心问题。</li></ul><ul><li><strong>怎么算</strong>：规模下限 = 能让机收、飞防、烘干这些服务愿意接单的最小面积；规模上限 = <strong>全部亏光也不影响你主业资金链的金额</strong>。两者之间取低。</li></ul><ul><li><strong>为什么重要</strong>：<strong>第一年你买的不是产量，是数据</strong>——品种表现、实际亩产、真实成本、服务资源、收购渠道。这些数据的获取成本，就是第一年的合理亏损额。</li></ul><ul><li><strong>常见坑</strong>：用规模来摆脱单亩不赚钱的事实。</li></ul><h3 id=\"sec-22\">160｜关键假设清单与决策门槛</h3><ul><li><strong>大白话</strong>：把模型里「如果这条错了全盘就错」的假设单独列出来，逐条去验证。</li></ul><ul><li><strong>本项目的四条生死假设</strong>：<ol><li>有广西审定/备案且抗性可接受的品种（否则第一讲矛盾一直接否决）</li></ol><ol><li>地块能排水、能进机、pH 可调到可接受区间</li></ol><ol><li>周边有可调度的机收与烘干服务</li></ol><ol><li>有一个愿意签保底价的收购方，且保底价 &gt; 保本价</li></ol></li></ul><ul><li><strong>为什么重要</strong>：<strong>这四条里任何一条不成立，项目就不应该启动</strong>。验证它们的成本极低（几次实地走访），而跳过它们的代价是全部投入。</li></ul><ul><li><strong>常见坑</strong>：先付地租再验证假设。<strong>顺序必须是：验证四条 → 算保本价 → 定规模 → 签合同</strong>。</li></ul><h2 id=\"sec-23\">本讲结论（记这四句）</h2><ol><li><strong>先算保本亩产和保本价，再决定投不投。</strong>保本亩产若接近或超过广西区域平均亩产，账面上就不成立。</li></ol><ol><li><strong>资金峰值比总投资额更危险。</strong>必须做月度现金流表，并把账期延迟算进去。</li></ol><ol><li><strong>第一年买的是数据，不是产量。</strong>试种规模取「服务愿意接单的最小面积」与「全赔也不伤主业的金额」两者取低。</li></ol><ol><li><strong>四条生死假设必须先验证，且必须在付地租之前。</strong>品种合规、地块可用、服务可调、买家保底价 &gt; 保本价。</li></ol><h2 id=\"sec-24\">待核实（本讲相关）</h2><div class=\"todo\"><span class=\"tick\">☐</span> 每亩成本清单中全部「待填」项的广西当地实际报价</div><div class=\"todo\"><span class=\"tick\">☐</span> 广西项目所在县近三年大豆平均亩产（用作保本亩产的对标基准）</div><div class=\"todo\"><span class=\"tick\">☐</span> 当地大豆地头价近三年区间与季节波动幅度</div><div class=\"todo\"><span class=\"tick\">☐</span> 净作 vs 带状复合种植的每亩作业成本差异（含补贴后的净收益对比）</div><div class=\"todo\"><span class=\"tick\">☐</span> 本地服务队接单的最小面积门槛（决定试种规模下限）</div><div class=\"todo\"><span class=\"tick\">☐</span> 机收损失率、烘干失重率、扣水扣杂率的当地经验值（决定入仓折算系数）</div><h2 id=\"sec-25\">参考来源</h2><ul><li>广西农业科学院：<a href=\"http://www.gxaas.net/front/detail/150/3200/43266\" target=\"_blank\" rel=\"noopener\">广西大豆平均亩产与桂夏7号实收亩产220.5公斤</a></li></ul><ul><li>农业农村部农业机械化管理司：<a href=\"https://njhs.moa.gov.cn/tzggjzcjd/202109/t20210923_6377124.htm\" target=\"_blank\" rel=\"noopener\">大豆机械化收获最佳时期与含水率指标</a></li></ul><h2 id=\"sec-26\">修订记录</h2><div class=\"tbl-wrap\"><table><tr><td>版本</td><td>日期</td><td>修订内容</td></tr><tr><td>v1.0</td><td>2026-10-04</td><td>建立第八讲：成本收益模型与风控（18张卡），含每亩成本空白测算表与敏感性表框架</td></tr><tr><td>v1.1</td><td>2026-10-04</td><td>校正用字：间接成本</td></tr><tr><td>v1.2</td><td>2026-10-04</td><td>再校：漏洞、初荚期蝨象专防</td></tr></table></div>"}, {"no": "11", "id": "87bb4bac-68c0-4449-b09b-2d2a58a284d4", "head": "第九讲", "sub": "复盘与下一轮循环", "tag": "第九讲", "num": "9", "secs": 24, "cards": 16, "mins": 3, "cardinfo": "· 16 张名词卡", "html": "<div class=\"callout\"><span class=\"co-icon\">🔁</span><div>教材第九讲（收官）｜对应大纲第十四部分（复盘与下一轮循环）<ul><li>卡片格式：<strong>名词 → 大白话 → 为什么重要 → 新手最常踩的坑</strong>（卡编号接第八讲，从161开始）</li></ul><ul><li>版本：v1.3｜写作日期：2026-10-04｜对话轮次：0011</li></ul><ul><li>上游大纲：<a href=\"https://app.notion.com/p/2154c1eab76a4e9aa8111f0bd9db7e6d\" target=\"_blank\" rel=\"noopener\">广西大豆种植投资基础常识 · 全流程大纲（0001）</a>｜上一讲：<a href=\"https://app.notion.com/p/1cc5029754224785aeb8f10b7c73f415\" target=\"_blank\" rel=\"noopener\">大豆教材·第八讲｜成本收益模型与风控（名词卡）</a></li></ul><ul><li>本讲定位：前八讲讲的是怎么把一季做完。<strong>这一讲讲的是怎么让第二年比第一年强，以及什么情况下应该不再有第二年</strong>。</li></ul></div></div><h2 id=\"sec-1\">一、把这一季变成数据</h2><h3 id=\"sec-2\">161｜田间档案（农事记录）</h3><ul><li><strong>大白话</strong>：每块地、每一天干了什么：播期、用量、用药、天气、苗情、问题、费用，全部记下来。</li></ul><ul><li><strong>为什么重要</strong>：<strong>这是你第一年真正的产品</strong>。它同时是理赔证据（第七讲）、可追溯凭证（第六讲卡123）和模型校准的数据源（第八讲）。一份档案同时支撑三个用途。</li></ul><ul><li><strong>常见坑</strong>：靠记忆和微信聊天记录复盘。<strong>这恰恰是你相对本地种地能手最大的优势项</strong>，放弃它等于放弃自己唯一的长板。</li></ul><h3 id=\"sec-3\">162｜测产与对标</h3><ul><li><strong>大白话</strong>：收获前随机取样数株数荚数粒算理论亩产，收完再跟实际入仓量对。</li></ul><ul><li><strong>为什么重要</strong>：<strong>两个数字之间的差距，就是第六讲说的产后损耗</strong>。不做测产，你永远不知道是「没种好」还是「收坏了」，而这两者的改进方向完全相反。</li></ul><ul><li><strong>常见坑</strong>：只记总产量，不分地块、不分品种记录，导致无法归因。</li></ul><h3 id=\"sec-4\">163｜单产归因分析</h3><ul><li><strong>大白话</strong>：产量不达预期时，逐环节查是哪一步拖的后腿。</li></ul><ul><li><strong>怎么查</strong>：按产量构成拆——<strong>每亩株数（保苗率）× 单株结荚数 × 每荚粒数 × 粒重</strong>。哪一项明显低于品种应有水平，就回溯对应环节：株数不足→播种/出苗；结荚少→花荚期水肥与病虫；空荚→症青与初荚期虫害；粒重低→鼓粒期高温缺水。</li></ul><ul><li><strong>为什么重要</strong>：<strong>这是把第二至第六讲全部知识反向用一遍的工具</strong>。不归因，第二年只是把第一年重做一遍。</li></ul><ul><li><strong>常见坑</strong>：把所有问题笼统归结为「天气不好」。</li></ul><h3 id=\"sec-5\">164｜成本实际值回填与模型校准</h3><ul><li><strong>大白话</strong>：把第八讲那张「待填」表用真实发生额填满，重算一遍保本价。</li></ul><ul><li><strong>为什么重要</strong>：<strong>第一年的模型是拍脑袋，第二年的模型才是资产</strong>。你花钱买回来的就是这张表的真实版本。</li></ul><ul><li><strong>常见坑</strong>：年底只算总账赚了还是亏了，不拆回每亩每项。</li></ul><h3 id=\"sec-6\">165｜品种比较试验与迭代</h3><ul><li><strong>大白话</strong>：同一块地、同样管理，并行种几个品种分区对比。</li></ul><ul><li><strong>为什么重要</strong>：<strong>这是解决第一讲核心矛盾的唯一实验手段</strong>。你所谓的「优良种子」到底行不行，只有并行对比能回答，年年换品种单独种永远得不出结论。比对维度不只是产量，还要含<strong>底荚高度、抗炸荚、抗病、熟期一致性、商品外观</strong>。</li></ul><ul><li><strong>常见坑</strong>：对比区管理不一致（施肥打药不同步），结论完全无效。</li></ul><h2 id=\"sec-7\">二、把地养回来</h2><h3 id=\"sec-8\">166｜秸秆还田与地力培肥</h3><ul><li><strong>大白话</strong>：收完把豆秆豆叶粉碎后还回地里，让它烂成有机质。</li></ul><ul><li><strong>为什么重要</strong>：大豆根系固氮、秆叶还田，是它<strong>作为轮作前作的核心价值</strong>——后作作物能少施氮肥。这部分收益不体现在大豆的账上，但在两年总账上是真实的。</li></ul><ul><li><strong>常见坑</strong>：烧秆（违规且浪费）；或还田时不粉碎、不深翻，影响下季播种质量并给病菌留床。</li></ul><h3 id=\"sec-9\">167｜轮作顺序安排（下一轮）</h3><ul><li><strong>大白话</strong>：这块地下一季、下一年种什么，提前排好。</li></ul><ul><li><strong>为什么重要</strong>：<strong>连作大豆是大忌</strong>——根腐病、胞囊线虫、土传病菌逐年累积（承第五讲）。轮作不是可选项，是病害管理的底层手段。这意味着<strong>你租地时就要考虑到多年轮作的面积需求</strong>。</li></ul><ul><li><strong>常见坑</strong>：第一年种得好就年年在同一块地种大豆，第三年病害爆发。</li></ul><h3 id=\"sec-10\">168｜土壤复测与 pH 追踪</h3><ul><li><strong>大白话</strong>：收完再测一次土，和种前的数据对比。</li></ul><ul><li><strong>为什么重要</strong>：石灰调酸是一个<strong>持续衰减的过程</strong>，需要知道今年调上去多少、明年还要补多少（承第三讲）。同时看有机质、速效磷钾的变化，判断施肥方案是不是合理。</li></ul><ul><li><strong>常见坑</strong>：只在第一年测一次土，之后凭感觉施肥。</li></ul><h3 id=\"sec-11\">169｜除草剂残效与下季作物安全复核</h3><ul><li><strong>大白话</strong>：今年用过的除草剂，会不会伤到你明年要种的作物。</li></ul><ul><li><strong>为什么重要</strong>：承第五讲卡75。<strong>这是复盘环节必须回头核的一项</strong>——残效药害往往要到下一季才暴露，那时已无法补救。做轮作计划时必须拿着今年的用药清单对照。</li></ul><ul><li><strong>常见坑</strong>：轮作安排完全不考虑上季用药历史。</li></ul><h2 id=\"sec-12\">三、把关系与合同沉淀下来</h2><h3 id=\"sec-13\">170｜合同续签与租金调整</h3><ul><li><strong>大白话</strong>：第一年种得好，房东往往要涨租；种得差，你可能想退。</li></ul><ul><li><strong>为什么重要</strong>：<strong>这是一个经典的改良收益被捕获问题</strong>——你花钱改土、挖沟、培肥，地变好了，结果第二年租金涨了。承第一讲卡 8：<strong>首次签约就要写入较长年限与调价机制，这是回头看最值钱的一个条款</strong>。</li></ul><ul><li><strong>常见坑</strong>：第一年签短约试水，改土投入完全收不回。</li></ul><h3 id=\"sec-14\">171｜农机购置的判定时点</h3><ul><li><strong>大白话</strong>：什么时候该从「租服务」转为「买设备」。</li></ul><ul><li><strong>判定规则</strong>：同时满足三条才考虑买——①面积和轮作安排能让设备年作业量达到经济规模；②当地服务资源确实紧张或调度不可控（误农时过）；③至少跑通两季。</li></ul><ul><li><strong>为什么重要</strong>：<strong>农机是把可变成本变成固定成本的单向门</strong>（承第八讲卡147）。一旦买了，你就失去了缩规模和退出的灵活性。</li></ul><ul><li><strong>常见坑</strong>：第二年就买机，理由是「去年等机误了工」——正确做法是先跟服务队签预约合同。</li></ul><h3 id=\"sec-15\">172｜服务商与收购方的关系资产</h3><ul><li><strong>大白话</strong>：机手、飞防队、烘干点、粮贩、加工厂——这些人认不认你、优先不优先排你。</li></ul><ul><li><strong>为什么重要</strong>：<strong>在农忙峰值期，服务资源是按关系和口碑排队的，不是按价格</strong>。第一年准时付款、不压价、好配合，换来的是第二年的优先调度权。这是比价格更重要的资产。</li></ul><ul><li><strong>常见坑</strong>：第一年就拼命压价、拖欠费用，第二年没人愿意接单。</li></ul><h3 id=\"sec-16\">173｜本地管理人与委托关系</h3><ul><li><strong>大白话</strong>：你人不在现场，必须有一个本地人替你看着地。</li></ul><ul><li><strong>为什么重要</strong>：<strong>这是异地农业投资最大的隐性风险点</strong>。所有窗口期决策（封闭除草、初荚期用药、排水、收割时机）都要现场人执行。激励设计应该与<strong>入仓商品量和质量等级</strong>挂钩，而不是固定工资。</li></ul><ul><li><strong>常见坑</strong>：依赖专家远程指导 + 临时雇工，没有利益绑定的现场负责人。</li></ul><h2 id=\"sec-17\">四、决定要不要有第二年</h2><h3 id=\"sec-18\">174｜扩种 / 维持 / 退出的判定规则</h3><ul><li><strong>大白话</strong>：事先写好三条规则，第一季结束后照规则执行，不凭感觉。</li></ul><ul><li><strong>建议规则</strong>：<ul><li><strong>扩种</strong>：实际亩产 ≥ 区域平均水平，且单亩净利为正，且四条生死假设（第八讲卡160）全部得到实证，且盈利可解释、可重复。</li></ul><ul><li><strong>维持同规模</strong>：亩产接近平均但单亩微亏，且亏损原因已定位、下年可改善。</li></ul><ul><li><strong>退出</strong>：亩产明显低于区域平均且<strong>找不到可改善的具体原因</strong>；或四条生死假设中有一条被证伪；或保本价 &gt; 当地地头价常态水平。</li></ul></li></ul><ul><li><strong>为什么重要</strong>：<strong>「赚钱」不是扩种理由，「可解释且可重复的赚钱」才是</strong>。第一年风调雨顺赚了钱而归因为自己能力强，是农业扩张失败的最常见起点。</li></ul><ul><li><strong>常见坑</strong>：不设退出条件，一年一年地「再试一年」。</li></ul><h3 id=\"sec-19\">175｜复盘会与知识沉淀</h3><ul><li><strong>大白话</strong>：收完卖完之后，把所有参与人（专家、现场负责人、机手）叫到一起过一遍。</li></ul><ul><li><strong>为什么重要</strong>：<strong>现场细节只存在于执行人脑子里</strong>，不开复盘会就随人走掉。复盘输出应该是三样东西：校准过的成本表、更新的农事日历、下年的品种与植保方案。</li></ul><ul><li><strong>常见坑</strong>：复盘只讲赚亏，不输出可执行文档。</li></ul><h3 id=\"sec-20\">176｜下一轮播种前检查清单</h3><ul><li><strong>大白话</strong>：把下一季开始前必须确认的事列成一张表，逐项打钩。</li></ul><ul><li><strong>至少包含</strong>：品种与种子购置→土测与调酸→排水沟清理→轮作与残效复核→服务队预约→保险投保窗口→订单合同→资金月度表→植保日历→止损点设定。</li></ul><ul><li><strong>为什么重要</strong>：<strong>这张清单就是整套教材的执行版</strong>。前八讲的所有知识，最终都要压缩成这张能在播种前逐条执行的表。</li></ul><ul><li><strong>常见坑</strong>：知识停留在理解层面，没有转成清单和日历。</li></ul><h2 id=\"sec-21\">本讲结论（记这四句）</h2><ol><li><strong>第一年的真正产出是一套被验证过的参数，不是豆子。</strong>田间档案 + 校准后的成本表 + 归因结论，这三样东西比当年利润更值钱。</li></ol><ol><li><strong>扩种的条件是「可解释且可重复的单亩盈利」，不是「赚了钱」。</strong>风调雨顺赚的钱不构成扩张依据。</li></ol><ol><li><strong>轮作不是可选项。</strong>连作大豆三年内必出根腐和线虫问题，租地面积和合同年限要在第一天就按多年轮作来谈。</li></ol><ol><li><strong>该退就退。</strong>亩产明显偏低且找不到可改善原因、或保本价高于当地地头价常态水平，就不应该有第二年。</li></ol><h2 id=\"sec-22\">待核实（本讲相关）</h2><div class=\"todo\"><span class=\"tick\">☐</span> 广西当地适合与大豆轮作的前后作作物与常见轮作顺序</div><div class=\"todo\"><span class=\"tick\">☐</span> 本地大豆连作障碍的实际表现与安全轮作年限</div><div class=\"todo\"><span class=\"tick\">☐</span> 秸秆还田在广西高温多雨条件下的腐熟速度与病菌留床风险</div><div class=\"todo\"><span class=\"tick\">☐</span> 当地石灰调酸的有效维持年限与年度补施量</div><div class=\"todo\"><span class=\"tick\">☐</span> 本地现场管理人的市场薪酬水平与常见分成模式</div><div class=\"todo\"><span class=\"tick\">☐</span> 流转合同常见的调价机制条款写法（可找当地农经站要示范文本）</div><h2 id=\"sec-23\">参考来源</h2><ul><li>广西农业科学院：<a href=\"http://www.gxaas.net/front/detail/150/3200/43266\" target=\"_blank\" rel=\"noopener\">广西大豆平均亩产与桂夏7号实收亩产220.5公斤</a></li></ul><ul><li>《土壤学报》：<a href=\"http://pedologica.issas.ac.cn/html/trxb/2023/5/trxb202307250290.htm\" target=\"_blank\" rel=\"noopener\">南方红壤大豆临界 pH 与铝毒、缺磷障碍</a></li></ul><h2 id=\"sec-24\">修订记录</h2><div class=\"tbl-wrap\"><table><tr><td>版本</td><td>日期</td><td>修订内容</td></tr><tr><td>v1.0</td><td>2026-10-04</td><td>建立第九讲（收官）：复盘与下一轮循环（16张卡）</td></tr><tr><td>v1.1</td><td>2026-10-04</td><td>校正用字：腐熟、还回地里</td></tr><tr><td>v1.4</td><td>2026-10-04</td><td>再校：统一改用「前作/后作/下季/轮作顺序」表述，修正初荚期虫害</td></tr></table></div>"}, {"no": "12", "id": "f399bd7e-8b1a-48a9-add9-3d2f858c027e", "head": "尽调走访提纲", "sub": "八组对象·逐条问法", "tag": "附录", "num": "🔍", "secs": 13, "cards": 0, "mins": 3, "cardinfo": "· 实操清单", "html": "<div class=\"callout\"><span class=\"co-icon\">🧳</span><div><strong>广西大豆项目 · 实地尽调走访提纲</strong><ul><li>版本：v1.0｜写作日期：2026-10-04｜对话轮次：0012</li></ul><ul><li>配套使用：<a href=\"https://app.notion.com/p/7e1676439aff4c9a867248370a1d9525\" target=\"_blank\" rel=\"noopener\">大豆教材·待核实总表｜广西实地调研问题清单</a>｜<a href=\"https://app.notion.com/p/efbf7f5e09694993a2da1c9905f55292\" target=\"_blank\" rel=\"noopener\">大豆教材·总索引｜9讲 176 张名词卡导航</a></li></ul><ul><li><strong>这份提纲的目标不是「了解情况」，是把总表里 41 项变成有出处的答案</strong>。每组都标了要拿走的东西和该警惕的回答。</li></ul></div></div><h2 id=\"sec-1\">通用规则（每一组都适用）</h2><ul><li><strong>先表明身份和规模</strong>：「打算先试种几十到两百亩」。说小规模试种比说大项目更容易拿到真话，也不会被当成投机者抬价。</li></ul><ul><li><strong>问数字要问区间和最差值</strong>：不问「亩产多少」，问「最差的那年多少」。平均值会被美化，最差值不会。</li></ul><ul><li><strong>要纸质材料和联系方式</strong>：每访一家都要拿到至少一份文件或报价单，和一个能再打的电话。口头回答不进模型。</li></ul><ul><li><strong>同一个数字至少问两个独立来源</strong>：尤其是亩产、地头价、作业单价这三项。</li></ul><ul><li><strong>全程录音或当场记录</strong>，当天晚上回填到待核实总表。</li></ul><h2 id=\"sec-2\">第 1 组｜县农业农村局 · 乡镇农服中心</h2><p><strong>见谁</strong>：种植业科负责人、农技推广站站长、乡镇农服中心主任。先跑县级，再由县级介绍到乡镇。</p><p><strong>问什么</strong></p><ol><li>我们县近三年大豆种了多少亩？主要集中在哪几个乡镇？平均亩产大概多少？</li></ol><ol><li>本地大豆主要是春豆、夏豆还是秋豆？各自的适播期大概是哪一段？</li></ol><ol><li>有没有成规模种大豆的大户或合作社？能不能介绍我去看看？（<strong>这是本组最重要的一问</strong>）</li></ol><ol><li>耕地地力保护补贴今年每亩多少？发给承包户还是实际种地的人？</li></ol><ol><li>有没有大豆或大豆玉米带状复合种植的专项补贴？今年的任务区包不包括我看的这几个乡镇？</li></ol><ol><li>我这种外地来投资的，要注册成什么主体才能拿补贴、能投保？</li></ol><ol><li>高标准农田项目区在哪几块？还有没有可流转的？</li></ol><ol><li>需要申报的扶持项目有哪些？什么时间报？</li></ol><p><strong>拿走</strong>：当年大豆生产指导意见或技术方案、补贴文件、高标准农田分布情况、<strong>本地种植大户的联系方式</strong>。</p><p><strong>红旗信号</strong>：如果对方说不出一个成规模种大豆的人，说明本地没有大豆生产体系——服务、收购、经验都得从零搭，成本和风险要按最差场景算。</p><h2 id=\"sec-3\">第 2 组｜种子站 · 广西农科院</h2><p><strong>见谁</strong>：县种子管理站；有条件直接跑广西农科院经济作物研究所的大豆课题组。</p><p><strong>问什么</strong></p><ol><li>我这个县、这个季别，现在能用的审定品种有哪几个？</li></ol><ol><li>每个品种的生育期、蛋白含量、抗锈病和抗倒表现怎么样？</li></ol><ol><li><strong>底荚高度和抗炸荚性怎么样？能不能机收？</strong>（这两项宣传资料上往往不写）</li></ol><ol><li>我手上有北方的品种，在这里能不能试？要走什么引种备案手续？大概会是什么表现？</li></ol><ol><li>本地有没有适配这些品种的耐酸根瘤菌剂？哪里买？菌株编号是什么？</li></ol><ol><li>能不能推荐一个能跟我做品种对比试验的技术指导？</li></ol><p><strong>拿走</strong>：品种审定公告或品种介绍资料、菌剂来源、技术联系人。</p><p><strong>红旗信号</strong>：如果对方对「你的北方品种能不能用」回答模糊或说「试试看」，把它当成否定回答处理。这是第一讲第一张卡的核心矛盾。</p><h2 id=\"sec-4\">第 3 组｜植保站</h2><p><strong>见谁</strong>：县植保植检站测报人员。</p><p><strong>问什么</strong></p><ol><li>本地大豆最重的病虫是哪几个？一般什么时间发生？</li></ol><ol><li><strong>有没有出过症青（只长秆不结粒）的情况？多不多见？什么时候防？</strong></li></ol><ol><li>大豆锈病在我们这里常年发得重不重？什么时候开始预防？</li></ol><ol><li>测报信息通过什么渠道发？我怎么订阅？</li></ol><ol><li>在大豆上登记、本地常用的除草剂和杀虫剂是哪几个？封闭除草用什么？</li></ol><ol><li>有没有做统防统治的服务队？能不能介绍？</li></ol><ol><li>本地有没有鼠害、鸟害比较重的区域？</li></ol><p><strong>拿走</strong>：当年植保方案或病虫情情报、测报订阅渠道、服务队联系方式。</p><p><strong>红旗信号</strong>：如果植保站说本地根本没人种大豆、没有大豆的测报数据，那你的植保方案只能靠自己踏查，现场负责人的要求要提高。</p><h2 id=\"sec-5\">第 4 组｜土肥站 · 土壤检测机构</h2><p><strong>见谁</strong>：县土肥站，或有资质的第三方检测公司。</p><p><strong>问什么</strong></p><ol><li>我这几块地的土壤类型是什么？周边历史测土数据有没有？</li></ol><ol><li>测一次土多少钱？测哪几项？多久出报告？</li></ol><ol><li><strong>我要测 pH、交换性铝、有效磷、有机质，这几项你们做不做？</strong></li></ol><ol><li>本地调酸一般每亩用多少石灰？什么时候撒？能管几年？</li></ol><ol><li>大豆在这种土上每亩该施多少磷、多少钾？钼和硼要不要补？</li></ol><ol><li>秸秆还田在这里烂得快不快？会不会留病？</li></ol><p><strong>拿走</strong>：报价单、采样要求说明、本区域配施方案。</p><p><strong>当场就做</strong>：如果已经有候选地块，<strong>这一趟就把土样取了送检</strong>。测土费用在整个项目里几乎可以忽略，是性价比最高的一笔支出。</p><h2 id=\"sec-6\">第 5 组｜农机合作社 · 飞防队 · 机手</h2><p><strong>见谁</strong>：本地农机合作社负责人，最好再直接找一个干过活的机手聊。</p><p><strong>问什么</strong></p><ol><li><strong>你们有没有收过大豆？用什么机子？</strong>（广西以水稻、甘蔗机为主，豆机保有量是关键变量）</li></ol><ol><li>机播、机收每亩分别多少钱？起步面积多少亩才接？</li></ol><ol><li>我这个地块，机子进得去吗？车道要多宽？这种坡度能不能干？</li></ol><ol><li><strong>收大豆的损失大概多少？怎么减？</strong></li></ol><ol><li>收获那几天你们忙不忙？要不要排队？能不能提前签预约？</li></ol><ol><li>飞防每亩多少钱？一天能打多少亩？药是你们带还是我准备？</li></ol><ol><li>打大豆中下部的虫，飞防打得到吗？</li></ol><p><strong>拿走</strong>：书面报价单、预约合同模板（如有）、机手电话。</p><p><strong>红旗信号</strong>：本地没有收过大豆的机手，或者收获期排不上队。这直接否定第八讲的生死假设③。</p><h2 id=\"sec-7\">第 6 组｜烘干点 · 粮库</h2><p><strong>见谁</strong>：周边烘干中心、粮食合作社、国有粮库。</p><p><strong>问什么</strong></p><ol><li>你们的烘干机烘不烘大豆？（不是所有粮食烘干机都适合烘豆）</li></ol><ol><li>每吨收多少钱？按降几个水分点算？失重怎么计？</li></ol><ol><li>一天能烘多少吨？收获季要不要排队？能排多久？</li></ol><ol><li>接不接外单？最小批量多少？</li></ol><ol><li>能不能代储？仓储费怎么算？有没有测温通风条件？</li></ol><ol><li>大豆存在这里，水分降到多少才不会发热生霉？</li></ol><p><strong>拿走</strong>：收费标准、产能数据、是否接外单的明确答复。</p><p><strong>红旗信号</strong>：周边找不到能烘豆的点。广西收获期湿度大，没有烘干能力等于赌收获那几天不下雨。</p><h2 id=\"sec-8\">第 7 组｜豆制品厂 · 粮贩 · 收购方</h2><p><strong>见谁</strong>：本地豆腐、腐竹、豆浆厂的采购负责人；常跑本地的粮贩。<strong>这一组是整个行程最关键的一组</strong>。</p><p><strong>问什么</strong></p><ol><li>你们一年用多少吨豆？现在从哪里进？本地豆占多少？</li></ol><ol><li><strong>对蛋白含量有没有要求？多少以上才要？</strong></li></ol><ol><li>水分、杂质、破碎粒、霉变粒怎么扣？能不能给我一张扣算表？</li></ol><ol><li>去年本地豆的地头收购价大概多少？最低的时候多少？最高呢？</li></ol><ol><li><strong>如果我种出来质量达标，你们愿不愿意提前签一个保底收购合同？保底价能给到多少？</strong></li></ol><ol><li>货拉过来怎么验？谁取样？有异议找谁仲裁？</li></ol><ol><li>钱什么时候结？现款还是账期？账期多久？</li></ol><ol><li>你们最想要但本地买不到的是什么样的豆？</li></ol><p><strong>拿走</strong>：扣算规则表、收购标准、去年收购价区间、<strong>保底收购的口径</strong>。</p><p><strong>红旗信号</strong>：没有任何一家愿意谈保底价，或者报出的保底价低于你算出的保本价。这直接否定生死假设④。</p><h2 id=\"sec-9\">第 8 组｜保险公司 · 财政局</h2><p><strong>见谁</strong>：承保公司县支公司的农险业务员；必要时找县财政局金融科。</p><p><strong>问什么</strong></p><ol><li><strong>大豆在咱们这儿能投什么险？是物化成本险、完全成本险，还是收入险？</strong></li></ol><ol><li>每亩保额多少？费率多少？我自己出多少？</li></ol><ol><li>什么时候能投？投保窗口期多长？错过了还能补不？</li></ol><ol><li>投保要交哪些材料？流转合同要不要备案？地块怎么测亩？</li></ol><ol><li><strong>起赔点是多少？减产多少以上才赔？</strong></li></ol><ol><li>哪些情况不赔？泲水、病虫算不算管理不善？</li></ol><ol><li>出事多少天内必须报案？怎么定损？我要保留什么证据？</li></ol><ol><li>能不能给我一份样单看看？</li></ol><p><strong>拿走</strong>：<strong>一份完整样单条款</strong>、保额费率表、投保材料清单、业务员电话。</p><p><strong>红旗信号</strong>：本地大豆根本没开办政策性保险。这意味着你少了唯一的外部对冲，试种规模要进一步压缩。</p><h2 id=\"sec-10\">附｜本地种植大户与承包农户访谈</h2><p><strong>这一组不在八个单位里，但信息密度最高</strong>。上面八组给的是官方口径，这一组给的是真实发生的事。</p><p><strong>问种植大户</strong></p><ol><li>你种了几年？最好的一年多少亩？<strong>最差的一年多少亩？那年是怎么回事？</strong></li></ol><ol><li>每亩大概花多少钱？哪一项最贵？</li></ol><ol><li>你的豆卖给谁？怎么定价？有没有被压过价？</li></ol><ol><li><strong>你觉得最容易出问题的是哪一步？</strong></li></ol><ol><li>如果我这样的外地人过来种，你觉得最大的坑是什么？</li></ol><ol><li>你雇人怎么给钱？有没有分成？</li></ol><p><strong>问承包农户 / 村干部</strong></p><ol><li>这块地前两季种的什么？<strong>打过什么除草剂？什么时候打的？</strong></li></ol><ol><li>租金多少？最长能租多少年？中途涨不涨价？</li></ol><ol><li>我挖沟、改土、铺管，到期了怎么算？</li></ol><ol><li>补贴归谁？我申报的时候你配合提供资料吗？</li></ol><ol><li>这块地会不会积水？哪年淹过？淹到什么程度？</li></ol><h2 id=\"sec-11\">三天行程建议</h2><div class=\"tbl-wrap\"><table><tr><td>日程</td><td>上午</td><td>下午</td><td>当天要拿到</td></tr><tr><td>第一天</td><td>县农业农村局（第1组）</td><td>种子站 + 植保站（第2、3组）</td><td>品种清单、大户联系方式</td></tr><tr><td>第二天</td><td>现场踏勘 + 取土样送检（第4组）</td><td>农机合作社 + 烘干点（第5、6组）</td><td>作业报价单、烘干收费</td></tr><tr><td>第三天</td><td>豆制品厂 + 粮贩（第7组）</td><td>保险公司（第8组）+ 种植大户访谈</td><td>扣算规则、保底价口径、保险样单</td></tr></table></div><p><strong>顺序的逻辑</strong>：先拿政策和品种（决定能不能种），再拿成本报价（决定花多少），最后拿收购价和保底价（决定赚不赚）。<strong>把最关键的一组放在最后，是因为到那时你已经有成本数字，谈保底价才有底气</strong>。</p><h2 id=\"sec-12\">回来后的交付物</h2><p>走访结束后，应该能交出这四样东西：</p><ol><li><strong>填满的每亩成本表</strong>（第八讲卡150 的 18 项全部有数字）</li></ol><ol><li><strong>算出的保本亩产与保本价</strong>，并与项目县平均亩产、当地地头价做对比</li></ol><ol><li><strong>四条生死假设的逐条结论</strong>（成立 / 不成立 / 待定）</li></ol><ol><li><strong>一张联系人表</strong>：品种、菌剂、农资、机收、飞防、烘干、收购、保险、农技，每类至少两个人</li></ol><h2 id=\"sec-13\">修订记录</h2><div class=\"tbl-wrap\"><table><tr><td>版本</td><td>日期</td><td>修订内容</td></tr><tr><td>v1.0</td><td>2026-10-04</td><td>建立尽调走访提纲：八组走访对象逐条问法、大户与农户访谈、三天行程、四项交付物</td></tr><tr><td>v1.1</td><td>2026-10-04</td><td>校正用字：抬价、积水、淹水</td></tr><tr><td>v1.2</td><td>2026-10-04</td><td>校正用字：田间积水、自己出多少</td></tr></table></div>"}, {"no": "13", "id": "7e167643-9aff-4c9a-8672-48370a1d9525", "head": "待核实总表", "sub": "广西实地调研问题清单", "tag": "附录", "num": "📋", "secs": 6, "cards": 0, "mins": 3, "cardinfo": "· 实操清单", "html": "<div class=\"callout\"><span class=\"co-icon\">✅</span><div><strong>全套教材「待核实」合并总表</strong><ul><li>来源：9 讲页尾的待核实清单，合并去重后共 <strong>41 项</strong></li></ul><ul><li>版本：v1.0｜写作日期：2026-10-04｜对话轮次：0012</li></ul><ul><li>总索引：<a href=\"https://app.notion.com/p/efbf7f5e09694993a2da1c9905f55292\" target=\"_blank\" rel=\"noopener\">大豆教材·总索引｜9讲 176 张名词卡导航</a></li></ul><ul><li><strong>用法</strong>：P0 全部问清之前，不要付任何一笔地租。P0 里只要有一项答案是否定的，项目就不应该启动。</li></ul></div></div><h2 id=\"sec-1\">P0｜决定项目成不成立（11 项）</h2><p>这一组对应第八讲卡160 的四条生死假设，加上算保本价所需的全部输入。<strong>问完这 11 项，就能做出投不投的决定</strong>。</p><div class=\"tbl-wrap\"><table><tr><td>#</td><td>待核实事项</td><td>出处</td><td>去哪问</td><td>用来干什么</td></tr><tr><td>1</td><td>广西当年可用的审定/备案品种清单（含生育期、蛋白、抗病、底荚高度、抗炸荚）</td><td>第二讲</td><td>自治区种子站·品种审定公告原文、广西农科院</td><td>生死假设①：品种合规</td></tr><tr><td>2</td><td>地块土测结果（pH、交换性铝、有效磷、有机质）</td><td>第三讲</td><td>当地土壤检测机构或农技站</td><td>生死假设②：地块可用</td></tr><tr><td>3</td><td>地块排水条件与机械通行性（出口沟去向、车道宽度、连片度）</td><td>第一、三讲</td><td>现场踏勘 + 农机手</td><td>生死假设②</td></tr><tr><td>4</td><td>当地大豆联合收割机作业单价与可调度数量</td><td>第六、八讲</td><td>农机合作社、县农机化主管部门</td><td>生死假设③：服务可调</td></tr><tr><td>5</td><td>周边烘干点的位置、产能、收费、是否接外单</td><td>第六讲</td><td>粮库、合作社、烘干中心</td><td>生死假设③</td></tr><tr><td>6</td><td>当地豆制品厂的收购标准、蛋白要求、是否愿签保底价</td><td>第六讲</td><td>本地豆腐腐竹厂、粮贩、合作社</td><td>生死假设④：买家保底</td></tr><tr><td>7</td><td>当地地头价近三年区间与季节波动幅度</td><td>第六、八讲</td><td>粮贩、加工厂、县发改价格监测</td><td>算保本亩产</td></tr><tr><td>8</td><td>项目县近三年大豆平均亩产</td><td>第八讲</td><td>县农业农村局、统计局</td><td>保本亩产的对标基准</td></tr><tr><td>9</td><td>每亩成本清单（18 项）全部「待填」项的当地实际报价</td><td>第八讲卡150</td><td>分别向各类服务商询价</td><td>算保本价</td></tr><tr><td>10</td><td>机收损失率、烘干失重率、扣水扣杂率的当地经验值</td><td>第六、八讲</td><td>本地种植大户、机手、收购方</td><td>折算入仓商品亩产</td></tr><tr><td>11</td><td>本地服务队接单的最小面积门槛</td><td>第八讲</td><td>飞防队、农机合作社</td><td>决定试种规模下限</td></tr></table></div><h2 id=\"sec-2\">P1｜决定怎么种、成本多少（18 项）</h2><p>这一组在决定投之后、播种之前必须问完。</p><div class=\"tbl-wrap\"><table><tr><td>#</td><td>待核实事项</td><td>出处</td><td>去哪问</td></tr><tr><td>12</td><td>广西主产县春/夏/秋豆适播期区间</td><td>第二讲</td><td>县农技推广站</td></tr><tr><td>13</td><td>寒露风常年初日与近年异常年份</td><td>第二讲</td><td>自治区/市气象局</td></tr><tr><td>14</td><td>当地石灰调酸推荐用量区间</td><td>第三讲</td><td>农技站配施方案 + 土测报告</td></tr><tr><td>15</td><td>耕地前两季用药历史（除草剂残效排查）</td><td>第三、五讲</td><td>承包农户、上一承租方，写入合同</td></tr><tr><td>16</td><td>耐酸根瘤菌剂的商品来源与菌株编号</td><td>第四讲</td><td>广西农科院、菌剂生产单位</td></tr><tr><td>17</td><td>每亩推荐氮磷钾用量与钼硼用量</td><td>第四讲</td><td>测土配施方案（不套用外省）</td></tr><tr><td>18</td><td>各季推荐每亩株数与行株距</td><td>第四讲</td><td>当地技术指南、农技站</td></tr><tr><td>19</td><td>广西当年在大豆上登记的除草剂/杀虫剂/杀菌剂清单与剂量</td><td>第五讲</td><td>中国农药信息网登记数据库</td></tr><tr><td>20</td><td>症青元凶（初荚期刺吸害虫）在广西各季的发生高峰期</td><td>第五讲</td><td>当地植保测报数据</td></tr><tr><td>21</td><td>广西大豆锈病常年发生程度与预警发布渠道</td><td>第五讲</td><td>自治区植保部门年度预报</td></tr><tr><td>22</td><td>主栽品种的抗病性表现（锈病、SMV、根腐）</td><td>第二、五讲</td><td>品种审定公告 + 农科院</td></tr><tr><td>23</td><td>统防统治/飞防服务队的作业单价与服务范围</td><td>第五讲</td><td>当地服务队询价</td></tr><tr><td>24</td><td><strong>广西当年是否将大豆纳入完全成本保险或种植收入保险</strong></td><td>第七讲</td><td>县农业农村局、财政局、承保公司</td></tr><tr><td>25</td><td>大豆政策性保险的每亩保额、费率、各级财政分担与自缴比例</td><td>第七讲</td><td>同上</td></tr><tr><td>26</td><td>承保公司名单、投保窗口期、验标要求与材料清单</td><td>第七讲</td><td>承保公司县支公司</td></tr><tr><td>27</td><td>保单条款中的起赔点、免赔率、除外责任具体表述</td><td>第七讲</td><td>调取样单阅读</td></tr><tr><td>28</td><td>项目县耕地地力保护补贴标准与发放对象认定规则</td><td>第七讲</td><td>县农业农村局、乡镇农服中心</td></tr><tr><td>29</td><td>是否有大豆或带状复合种植的省/市/县级专项补贴与当年任务区</td><td>第七讲</td><td>同上</td></tr></table></div><h2 id=\"sec-3\">P2｜第二年再补（12 项）</h2><p>这一组不影响第一年决策，但影响第二年的扩种质量。</p><div class=\"tbl-wrap\"><table><tr><td>#</td><td>待核实事项</td><td>出处</td><td>去哪问</td></tr><tr><td>30</td><td>GB 1352（大豆）现行版各等级的完整粒率、损伤粒率、杂质、水分限值</td><td>第六讲</td><td>标准原文</td></tr><tr><td>31</td><td>GB 2763 中大豆相关农药的最大残留限量数值</td><td>第五讲</td><td>标准原文</td></tr><tr><td>32</td><td>南方高温高湿条件下的大豆安全储粮水分推荐值</td><td>第六讲</td><td>储粮行业标准、粮库</td></tr><tr><td>33</td><td>大豆耐涝（耐湿）极限时长的权威试验值</td><td>第二、四讲</td><td>文献或农科院</td></tr><tr><td>34</td><td>净作 vs 带状复合种植的每亩作业成本差（含补贴后净收益对比）</td><td>第三、八讲</td><td>本地示范点、农技站</td></tr><tr><td>35</td><td>带状复合种植在广西的当年项目支持与技术模式图</td><td>第三讲</td><td>自治区农业农村厅当年文件</td></tr><tr><td>36</td><td>适合与大豆轮作的本地前作/后作作物与常见轮作顺序</td><td>第九讲</td><td>农技站、本地种植大户</td></tr><tr><td>37</td><td>本地大豆连作障碍的实际表现与安全轮作年限</td><td>第九讲</td><td>同上</td></tr><tr><td>38</td><td>秸秆还田在广西高温多雨条件下的腐熟速度与病菌留床风险</td><td>第九讲</td><td>农技站、土肥站</td></tr><tr><td>39</td><td>石灰调酸的有效维持年限与年度补施量</td><td>第三、九讲</td><td>土肥站、连续土测</td></tr><tr><td>40</td><td>本地现场管理人的市场薪酬水平与常见分成模式</td><td>第九讲</td><td>本地种植大户、合作社</td></tr><tr><td>41</td><td>流转合同常见调价机制条款写法（示范文本）</td><td>第一、九讲</td><td>乡镇农经站</td></tr></table></div><h2 id=\"sec-4\">按对口单位归类（走访时按这个分组问）</h2><div class=\"tbl-wrap\"><table><tr><td>对口单位</td><td>对应条目</td><td>一次走访能解决</td></tr><tr><td>县农业农村局 / 乡镇农服中心</td><td>8、12、18、28、29、35</td><td>6 项</td></tr><tr><td>种子站 / 品种审定公告 / 农科院</td><td>1、16、22、33</td><td>4 项</td></tr><tr><td>植保站 / 农药登记数据库</td><td>19、20、21、23</td><td>4 项</td></tr><tr><td>土肥站 / 土壤检测机构</td><td>2、14、17、38、39</td><td>5 项</td></tr><tr><td>农机合作社 / 飞防队 / 机手</td><td>3、4、10、11</td><td>4 项</td></tr><tr><td>烘干点 / 粮库 / 储粮</td><td>5、32</td><td>2 项</td></tr><tr><td>豆制品厂 / 粮贩 / 收购方</td><td>6、7、30</td><td>3 项</td></tr><tr><td>财政局 / 保险公司</td><td>24、25、26、27</td><td>4 项</td></tr><tr><td>农经站 / 承包农户 / 本地大户</td><td>9、15、36、37、40、41</td><td>6 项</td></tr></table></div><h2 id=\"sec-5\">判定规则</h2><div class=\"callout\"><span class=\"co-icon\">🚦</span><div><strong>P0 全部清零前，不应付地租、不应订种子、不应签任何长期合同。</strong><ul><li>第 1 项找不到合规品种 → 项目不成立</li></ul><ul><li>第 4–5 项找不到可调度的机收与烘干 → 项目不成立</li></ul><ul><li>第 6 项找不到愿签保底价的买家 → 项目不成立</li></ul><ul><li>第 7–10 项算出的保本亩产 ≥ 项目县平均亩产 → 项目不成立</li></ul></div></div><h2 id=\"sec-6\">修订记录</h2><div class=\"tbl-wrap\"><table><tr><td>版本</td><td>日期</td><td>修订内容</td></tr><tr><td>v1.0</td><td>2026-10-04</td><td>合并 9 讲待核实条目为 41 项总表，分 P0/P1/P2 三组，附对口单位归类与判定规则</td></tr></table></div>"}];

      <div class="arrow">›</div></div>`;
  });
  h += `</div><div class="foot">内容源自 Notion「交互库 · 大豆标签」原文同步<br>未改动正式文字 · 仅供学习阅读</div>`;
  ov.innerHTML = h;
}

function renderRD(i){
  const d = DATA[i];
  $('#btitle').textContent = d.head;
  // 目录
  const tmp = document.createElement('div');
  tmp.innerHTML = d.html;
  const hs = tmp.querySelectorAll('h2,h3');
  let toc = '';
  hs.forEach((el,k)=>{
    const lv = el.tagName==='H3'?'lv3':'';
    const txt = el.textContent.trim();
    if(txt) toc += `<li><a class="${lv}" href="#sec-${k+1}" onclick="jump(event)">${txt}</a></li>`;
  });
  let h = `<div class="crumb">${d.tag}</div><h1 class="rt">${d.head}</h1>
    <div class="rmeta">${d.sub||''}&nbsp;&nbsp;·&nbsp;&nbsp;约 ${d.mins} 分钟${hs.length?`&nbsp;&nbsp;·&nbsp;&nbsp;<a href="#toc" onclick="openTOC(event)">查看本篇目录</a>`:''}</div>`;
  if(toc) h += `<div id="toc" class="open"><div class="t" onclick="this.parentNode.classList.toggle('open')"><span>📋 本篇目录（${hs.length} 节）</span><span class="chev">›</span></div><ol>${toc}</ol></div>`;
  h += `<div class="art">${d.html}</div>`;
  h += `<div class="pn">`;
  h += i>0 ? `<a href="#/p/${i-1}" onclick="nav(event,${i-1})"><span class="dir">← 上一篇</span><span class="pt">${DATA[i-1].head}</span></a>`
           : `<a class="ghost" href="#/" onclick="navHome(event)"><span class="pt">这是第一篇 · 回总览</span></a>`;
  h += i<DATA.length-1 ? `<a class="nx" href="#/p/${i+1}" onclick="nav(event,${i+1})"><span class="dir">下一篇 →</span><span class="pt">${DATA[i+1].head}</span></a>`
           : `<a class="ghost nx" href="#/" onclick="navHome(event)"><span class="pt">已读完 · 回总览 ✓</span></a>`;
  h += `</div><div class="foot">大豆教材 · ${i+1} / ${DATA.length}<br><a href="#/c/${i}" onclick="event.preventDefault();goCards(${i})">📇 翻卡学习这篇（知识点卡片模式）</a></div>`;
  rd.innerHTML = h;
  // 目录锚点 id 注入到真实 DOM
  rd.querySelectorAll('.art h2,.art h3').forEach((el,k)=> el.id = 'sec-'+(k+1));
}
/* ===== 学习状态（打开=自动 / 已读=手动勾选） ===== */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function loadMap(k){ try{ return JSON.parse(localStorage.getItem(k)||'{}'); }catch(e){ return {}; } }
function saveMap(k,m){ localStorage.setItem(k, JSON.stringify(m)); }
const openMap = loadMap('soy_open'), readMap = loadMap('soy_read');
const okey = (d,k)=>d+'-'+k;
function markOpen(d,k){ if(!openMap[okey(d,k)]){ openMap[okey(d,k)]=1; saveMap('soy_open',openMap); } }
function toggleRead(d,k,el){
  if(el.checked) readMap[okey(d,k)]=1; else delete readMap[okey(d,k)];
  saveMap('soy_read',readMap);
  el.parentNode.classList.toggle('on', el.checked);
  const meta = $('#cvMeta');
  if(meta && !cv.classList.contains('hide')) meta.textContent = `第 ${cvK+1} / ${cvN} 张 · 本篇已读 ${readCount(cvD)} 张`;
}
const readTotal = ()=>Object.keys(readMap).length;
function cardCount(di){ return cardsOf(di).length; }
function readCount(di){ let n=0; for(const k in readMap) if(k.startsWith(di+'-')) n++; return n; }

/* ===== 知识点切片：每个 h2/h3 一张卡，其余内容归当前卡 ===== */
const KCACHE = {};
function cardsOf(di){
  if(KCACHE[di]) return KCACHE[di];
  const tmp = document.createElement('div'); tmp.innerHTML = DATA[di].html;
  const out = []; let cur = null;
  [...tmp.children].forEach(el=>{
    if(/^H[23]$/.test(el.tagName)){
      if(cur) out.push(cur);
      cur = {lv: el.tagName==='H2'?'h2':'h3', title: el.textContent.trim()||'（未命名小节）', body: ''};
    } else {
      if(!cur) cur = {lv:'h3', title:'开篇', body:''};
      cur.body += el.outerHTML;
    }
  });
  if(cur) out.push(cur);
  return KCACHE[di] = out;
}

/* ===== 卡片流 ===== */
let cvD=0, cvK=0, cvN=0;
function goCards(i){ location.hash = '#/c/'+i; }
function renderCV(di){
  cvD=di; cvK=0;
  const cs = cardsOf(di); cvN = cs.length;
  let h = `<div class="cv-top"><div class="cv-info"><div class="cv-doc">${DATA[di].head}</div>
    <div class="cv-meta" id="cvMeta"></div></div>
    <a class="cv-full" href="#/p/${di}" onclick="nav(event,${di})">整篇阅读</a></div>
  <div class="cv-vp" id="cvVp"><div class="cv-track" id="cvTrack">`;
  cs.forEach((c,k)=>{
    h += `<div class="kcard" data-lv="${c.lv}"><div class="kc-in">
      <div class="kc-tag"><span class="kc-lv ${c.lv}">${c.lv==='h2'?'章节':'知识点'}</span><span>${k+1} / ${cvN}</span></div>
      <div class="kc-title">${esc(c.title)}</div>
      <div class="kc-body">${c.body||''}</div>
      <div class="kc-state">
        <span class="kc-open" id="ko-${k}">◌ 未打开</span>
        <label class="kc-read${readMap[okey(di,k)]?' on':''}"><input type="checkbox" ${readMap[okey(di,k)]?'checked':''} onchange="toggleRead(${di},${k},this)"> 我已阅读</label>
      </div></div></div>`;
  });
  h += `</div></div>
  <div class="cv-nav">
    <button class="cv-btn" id="cvPrev" onclick="cvGo(cvK-1)">← 上一张</button>
    <button class="cv-btn pri" id="cvNext" onclick="cvGo(cvK+1)">下一张 →</button>
  </div>
  <div class="foot">左右滑动屏幕翻卡 · 也可以点下方按钮<br>点顶部 ← 回总览</div>`;
  cv.innerHTML = h;
  bindSwipe();
  showCard(0);
}
function showCard(k){
  if(k<0||k>=cvN) return;
  cvK = k;
  const tr = $('#cvTrack');
  tr.classList.remove('drag');
  tr.style.transform = `translateX(${-k*100}%)`;
  markOpen(cvD,k);
  const o = $('#ko-'+k); if(o){ o.textContent='👁 已打开'; o.classList.add('yes'); }
  $('#cvMeta').textContent = `第 ${k+1} / ${cvN} 张 · 本篇已读 ${readCount(cvD)} 张`;
  $('#btitle').textContent = DATA[cvD].head + ' · ' + (k+1) + '/' + cvN;
  $('#prog').style.width = ((k+1)/cvN*100)+'%';
  const prev=$('#cvPrev'), next=$('#cvNext');
  prev.disabled = (k===0 && cvD===0);
  prev.textContent = k===0 ? (cvD>0?'← 上一篇':'← 上一张') : '← 上一张';
  next.textContent = k<cvN-1 ? '下一张 →' : (cvD<DATA.length-1 ? '下一篇 →' : '回总览 ✓');
}
function cvGo(k){
  if(k<0){ if(cvD>0) goCards(cvD-1); return; }
  if(k>=cvN){ if(cvD<DATA.length-1) goCards(cvD+1); else location.hash='#/'; return; }
  showCard(k);
}
function bindSwipe(){
  const vp = $('#cvVp'), tr = $('#cvTrack');
  let x0=0, y0=0, dx=0, lock=null, on=false;
  vp.addEventListener('touchstart',e=>{
    on=true; lock=null; dx=0;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY;
    tr.classList.add('drag');
  },{passive:true});
  vp.addEventListener('touchmove',e=>{
    if(!on) return;
    const mx=e.touches[0].clientX-x0, my=e.touches[0].clientY-y0;
    if(lock===null && (Math.abs(mx)>8||Math.abs(my)>8)) lock = Math.abs(mx)>Math.abs(my)?'h':'v';
    if(lock==='h'){
      dx=mx; e.preventDefault();
      let off = dx;
      if((cvK===0&&dx>0)||(cvK===cvN-1&&dx<0)) off = dx*0.3;
      tr.style.transform = `translateX(calc(${-cvK*100}% + ${off}px))`;
    }
  },{passive:false});
  const end = ()=>{
    if(!on) return; on=false; tr.classList.remove('drag');
    if(lock==='h'){
      if(dx<-55) cvGo(cvK+1);
      else if(dx>55) cvGo(cvK-1);
      else showCard(cvK);
    }
    dx=0;
  };
  vp.addEventListener('touchend',end);
  vp.addEventListener('touchcancel',end);
}
addEventListener('keydown', e=>{
  if(cv.classList.contains('hide')) return;
  if(e.key==='ArrowRight') cvGo(cvK+1);
  if(e.key==='ArrowLeft') cvGo(cvK-1);
});

function openTOC(e){ e.preventDefault(); const t=$('#toc'); if(t){t.classList.add('open'); t.scrollIntoView({behavior:'smooth',block:'start'});} }
function jump(e){ e.preventDefault(); const id=e.target.getAttribute('href'); const el=rd.querySelector(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }
function nav(e,i){ e.preventDefault(); location.hash = '#/p/'+i; }
function navHome(e){ e.preventDefault(); location.hash = '#/'; }
function go(i){ location.hash = '#/p/'+i; }
$('#back').onclick = () => { if(location.hash.startsWith('#/p/')||location.hash.startsWith('#/c/')) location.hash='#/'; else history.length>1?history.back():location.hash='#/'; };
$('#top').onclick = () => window.scrollTo({top:0,behavior:'smooth'});

function route(){
  const mp = location.hash.match(/^#\/p\/(\d+)$/);
  const mc = location.hash.match(/^#\/c\/(\d+)$/);
  window.scrollTo(0,0);
  const ok = i => i>=0&&i<DATA.length;
  if(mc && ok(+mc[1])){
    rd.classList.add('hide'); ov.classList.add('hide'); cv.classList.remove('hide');
    renderCV(+mc[1]); return;
  }
  if(mp && ok(+mp[1])){
    cv.classList.add('hide'); ov.classList.add('hide'); rd.classList.remove('hide');
    renderRD(+mp[1]); return;
  }
  cv.classList.add('hide'); rd.classList.add('hide'); ov.classList.remove('hide'); renderOV();
}
addEventListener('hashchange', route);
addEventListener('scroll', () => {
  if(!cv.classList.contains('hide')) return; // 卡片流进度由 showCard 管理
  const st = document.documentElement;
  const p = st.scrollTop/(st.scrollHeight-st.clientHeight||1)*100;
  $('#prog').style.width = p+'%';
  $('#top').style.display = st.scrollTop>600?'block':'none';
}, {passive:true});
route();
</script>
</body>
