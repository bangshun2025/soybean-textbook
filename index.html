<!DOCTYPE html>

<title>大豆教材 · 13 篇 | 手机阅读版</title>
<style>
:root{
  --bg:#F7F4EE; --card:#FFFFFF; --ink:#2B2B28; --ink2:#6E6A61; --ink3:#A09B90;
  --green:#43584A; --green-soft:#EAF0EA; --gold:#B98A2F; --gold-soft:#F5EDDC;
  --line:#EAE6DD; --r:20px;
  --fs:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;font-size:var(--fs);line-height:1.85;letter-spacing:.01em}
a{color:var(--green);text-decoration:none}
/* ===== 顶栏 ===== */
#bar{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(247,244,238,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#prog{height:3px;background:linear-gradient(90deg,var(--green),var(--gold));width:0%;transition:width .1s linear}
.bar-in{display:flex;align-items:center;gap:10px;padding:12px 16px}
.bar-btn{min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:none;background:var(--card);border-radius:14px;font-size:17px;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.05);cursor:pointer;font-family:inherit}
.bar-title{flex:1;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.bar-sp{min-width:44px}
/* ===== 页面容器 ===== */
.page{max-width:640px;margin:0 auto;padding:76px 18px 60px}
.hide{display:none!important}
/* ===== 封面 ===== */
.hero{background:linear-gradient(150deg,#43584A 0%,#2F4237 100%);border-radius:26px;color:#fff;padding:34px 26px 30px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(185,138,47,.28)}
.hero::before{content:"";position:absolute;right:24px;bottom:-52px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .k{font-size:14px;letter-spacing:.35em;opacity:.75;margin-bottom:10px}
.hero h1{font-size:34px;line-height:1.3;font-weight:700;letter-spacing:.02em}
.hero .s{margin-top:12px;font-size:16px;opacity:.88;line-height:1.7}
.pills{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:13.5px;padding:5px 13px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22)}
/* ===== 列表卡 ===== */
.sec-label{margin:26px 4px 12px;font-size:14px;color:var(--ink3);letter-spacing:.2em}
.list{display:flex;flex-direction:column;gap:12px}
.it{background:var(--card);border-radius:var(--r);padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 5px rgba(60,50,30,.05);cursor:pointer;transition:transform .12s}
.it:active{transform:scale(.98)}
.it .no{flex:none;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.no.g{background:var(--green-soft);color:var(--green)}
.no.au{background:var(--gold-soft);color:var(--gold)}
.it .tt{flex:1;min-width:0}
.it .h{font-size:17.5px;font-weight:600;line-height:1.4}
.it .s{font-size:14px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .m{font-size:12.5px;color:var(--ink3);margin-top:4px}
.it .arrow{flex:none;color:var(--ink3);font-size:20px}
/* ===== 阅读页 ===== */
.crumb{font-size:13px;color:var(--ink3);letter-spacing:.25em;margin-bottom:8px}
h1.rt{font-size:27px;line-height:1.4;font-weight:700;margin:2px 0 6px}
.rmeta{font-size:13.5px;color:var(--ink3);margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
/* 目录 */
#toc{background:var(--card);border-radius:var(--r);padding:16px 18px;margin-bottom:24px;box-shadow:0 1px 5px rgba(60,50,30,.05)}
#toc .t{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:16px;cursor:pointer}
#toc .t .chev{color:var(--ink3);transition:transform .2s}
#toc.open .t .chev{transform:rotate(90deg)}
#toc ol{margin:12px 0 2px 2px;list-style:none;display:none}
#toc.open ol{display:block}
#toc li{margin:3px 0}
#toc a{display:block;font-size:15px;color:var(--ink2);padding:7px 10px;border-radius:10px;line-height:1.5}
#toc a.lv3{padding-left:24px;font-size:14.5px}
#toc a:active{background:var(--green-soft);color:var(--green)}
/* 正文 */
.art p{margin:14px 0}
.art h2{font-size:22px;font-weight:700;margin:34px 0 10px;padding-left:12px;border-left:5px solid var(--gold);line-height:1.45}
.art h3{font-size:19.5px;font-weight:700;margin:28px 0 8px;color:var(--green);line-height:1.5}
.art ul,.art ol{padding-left:6px;list-style:none;margin:10px 0}
.art li{position:relative;padding-left:22px;margin:7px 0}
.art ul>li::before{content:"";position:absolute;left:6px;top:.72em;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.art ol{counter-reset:oli}
.art ol>li{counter-increment:oli}
.art ol>li::before{content:counter(oli)".";position:absolute;left:0;font-weight:600;color:var(--gold);font-size:.92em}
.art blockquote{margin:18px 0;padding:14px 18px;background:var(--gold-soft);border-radius:14px;color:#6b5420;font-size:.96em}
.art .callout{display:flex;gap:10px;background:var(--green-soft);border-radius:16px;padding:14px 16px;margin:18px 0;font-size:.97em}
.art .co-icon{flex:none;font-size:20px}
.art .tbl-wrap{overflow-x:auto;margin:16px 0;border-radius:14px;border:1px solid var(--line)}
.art table{border-collapse:collapse;width:100%;font-size:.88em;background:var(--card)}
.art th{background:var(--green);color:#fff;font-weight:600;text-align:left;white-space:nowrap}
.art th,.art td{padding:10px 12px;border-bottom:1px solid var(--line);line-height:1.6;vertical-align:top}
.art tr:last-child td{border-bottom:none}
.art code.ic{background:#EFEAE0;border-radius:6px;padding:1px 7px;font-size:.88em;color:#8a5a00}
.art pre.code{background:#2E2C28;color:#E8E4DA;border-radius:14px;padding:14px 16px;overflow-x:auto;font-size:.85em;margin:14px 0;line-height:1.6}
.art hr{border:none;height:1px;background:var(--line);margin:26px 0}
.art .todo{margin:8px 0}
.art .tick{color:var(--gold);font-weight:700;margin-right:4px}
.art a{border-bottom:1px solid rgba(67,88,74,.35)}
.art strong{font-weight:700}
/* 底部翻页 */
.pn{display:flex;gap:12px;margin-top:40px}
.pn a{flex:1;background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 5px rgba(60,50,30,.05);display:flex;flex-direction:column;gap:2px}
.pn .dir{font-size:12.5px;color:var(--ink3);letter-spacing:.15em}
.pn .pt{font-size:16px;font-weight:600;color:var(--ink);line-height:1.45}
.pn a.nx{text-align:right;align-items:flex-end}
.pn .ghost{background:transparent;box-shadow:none;border:1.5px dashed var(--line);align-items:center;justify-content:center;color:var(--ink2)}
/* 回顶 */
#top{position:fixed;right:18px;bottom:26px;width:46px;height:46px;border-radius:50%;background:var(--green);color:#fff;border:none;font-size:18px;box-shadow:0 4px 14px rgba(47,66,55,.35);display:none;z-index:40;cursor:pointer}
.foot{text-align:center;color:var(--ink3);font-size:12.5px;margin-top:36px;line-height:1.8}
/* ===== 知识点卡片流 ===== */
.cv-top{display:flex;align-items:center;gap:10px;margin:0 2px 14px}
.cv-info{flex:1;min-width:0}
.cv-doc{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-meta{font-size:13px;color:var(--ink3);margin-top:2px}
.cv-full{font-size:13.5px;color:var(--green);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;white-space:nowrap;flex:none}
.cv-vp{overflow:hidden;margin:0 -4px}
.cv-track{display:flex;transition:transform .32s cubic-bezier(.22,.8,.3,1)}
.cv-track.drag{transition:none}
.kcard{flex:0 0 100%;min-width:100%;padding:4px;display:flex;flex-direction:column}
.kc-in{background:var(--card);border-radius:24px;box-shadow:0 2px 14px rgba(67,88,74,.08);padding:22px 22px 18px;display:flex;flex-direction:column;min-height:64vh;flex:1}
.kc-tag{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--ink3);letter-spacing:.06em}
.kc-lv{background:var(--green-soft);color:var(--green);border-radius:999px;padding:3px 11px;font-weight:600}
.kc-lv.h2{background:var(--gold-soft);color:var(--gold)}
.kc-title{font-size:1.28em;font-weight:700;line-height:1.45;margin:12px 0 4px}
.kcard[data-lv=h2] .kc-title{font-size:1.5em;text-align:center;margin-top:26px}
.kc-body{flex:1;margin-top:10px}
.kc-body ul,.kc-body ol{padding-left:1.4em}
.kc-state{border-top:1px dashed var(--line);margin-top:18px;padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.kc-open{font-size:13px;color:var(--ink3);display:flex;align-items:center;gap:5px;white-space:nowrap}
.kc-open.yes{color:var(--green);font-weight:600}
.kc-read{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:600;color:var(--ink2);cursor:pointer;user-select:none;-webkit-user-select:none}
.kc-read input{width:22px;height:22px;accent-color:var(--green);cursor:pointer}
.kc-read.on{color:var(--green)}
.cv-nav{display:flex;gap:12px;margin-top:16px}
.cv-btn{flex:1;height:54px;border:none;border-radius:18px;background:var(--card);font-family:inherit;font-size:16.5px;font-weight:600;color:var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.06);cursor:pointer}
.cv-btn.pri{background:var(--green);color:#fff}
.cv-btn:disabled{opacity:.35}
/* 大字号档 */
body.fs1{--fs:17px} body.fs3{--fs:20.5px}
@media (min-width:700px){ .page{padding-top:90px} }
</style>

<script>
const DATA = [{"no": "01", "id": "2154c1ea-b76a-4e9a-a811-1f0bd9db7e6d", "head": "广西大豆种植投资基础常识 · 全流程大纲（0001）", "sub": "", "tag": "大纲", "num": "🌱", "secs": 18, "cards": 0, "mins": 4, "cardinfo": "· 实操清单", "html": "<div class=\"callout\"><span class=\"co-icon\">📌</span><div>本页用途：投资前的基础常识框架（学习用大纲，非实施方案）。<ul><li>版本：v1.0｜写作日期：2026-10-04｜对话轮次：0001</li></ul><ul><li>适用范围：广西（赤红壤/红壤区）大豆种植项目，从0到销售完成再到下一轮种植的完整循环</li></ul><ul><li>数据口径：已标注来源的为权威出处；未核到原始文件的数值一律不写，统一列入文末「待核实数据清单」</li></ul></div></div><h2 id=\"sec-1\">零、三个本质矛盾（看不懂这三条，后面全是细节）</h2><ol><li><strong>光周期矛盾</strong>：大豆是<strong>短日照作物</strong>（日照变短才开花）。北方「优良种子」引到广西（纬度低、日长短），会提早开花、植株矮小、产量断崖。因此「我有优良种子」在南方<strong>不构成优势，反而是第一风险点</strong>——品种必须是本生态区审定或已引种备案的品种。广西纪录为本地选育的「桂夏7号」实收亩产 220.5 公斤，而广西平均亩产仅 100 多公斤（广西农科院 / 广西日报，2020）。</li></ol><ol><li><strong>水的矛盾</strong>：广西不缺水，缺「排水」。南方大豆主要减产原因是<strong>涝害 + 高温高湿导致落花落荚、病害重</strong>，而非干旱（秋旱除外）。</li></ol><ol><li><strong>现金流矛盾</strong>：一季投入前置、收入一次性回笼，任何一次天气或虫害事件直接吃掉全年利润。风险管理工具 = <strong>小面积试种 + 政策性农业保险 + 订单锁价</strong>，不是「更努力地种」。</li></ol><h2 id=\"sec-2\">一、立项与经营主体</h2><ul><li><strong>核心名词</strong>：新型农业经营主体（家庭农场 / 农民合作社 / 农业企业）、土地流转（承包权与经营权分离，「三权分置」）、流转合同（期限、租金、退出条款、补贴归属）、耕地用途管制（永久基本农田不得种树挖塘、防止「非粮化」）、高标准农田。</li></ul><ul><li><strong>目的与作用</strong>：拿到合法、连片、能上机械的地；明确谁有资格领补贴、谁能投保。</li></ul><ul><li><strong>底层逻辑</strong>：农业第一笔风险不在田里，在合同里。地块零碎、租期短于3年、补贴归属没写清，项目先天残疾。</li></ul><h2 id=\"sec-3\">二、种子与品种</h2><ul><li><strong>核心名词</strong>：主要农作物品种审定（大豆属主要农作物，须审定）、引种备案（同一适宜生态区可引种并备案）、国审/省审品种、生育期组、短日照、百粒重、蛋白含量、含油量、抗倒性、抗病性。</li></ul><ul><li><strong>目的与作用</strong>：让品种匹配广西的纬度、季别（春豆/夏豆/秋豆）与销路——做豆腐腐竹靠<strong>蛋白</strong>，榨油靠<strong>含油量</strong>。广西大豆以夏豆+秋豆为主（约72%）、春豆约28%。</li></ul><ul><li><strong>底层逻辑</strong>：品种 = 一套「当地气候的时间程序」。程序与当地日长、雨季对不上，再好的基因也白费。</li></ul><h2 id=\"sec-4\">三、气候与农时</h2><ul><li><strong>核心名词</strong>：积温、有效光照、生育期分期（V营养期 / R生殖期：R1开花—R3结荚—R5鼓粒—R8完熟）、春季低温阴雨（烂种）、梅汛暴雨涝害、台风、寒露风（秋季冷空气打断秋豆鼓粒）、秋旱。</li></ul><ul><li><strong>目的与作用</strong>：把播种期卡在「开花结荚期避开最糟天气」的窗口里。</li></ul><ul><li><strong>底层逻辑</strong>：农业里唯一免费的保险叫「农时」。播期错10天，等于把花荚期送进暴雨或寒露风。</li></ul><h2 id=\"sec-5\">四、土壤与耕地</h2><ul><li><strong>核心名词</strong>：pH值、土壤酸化、铝毒（Al³⁺）、缺磷、赤红壤/红壤、有机质、耕层深度、犁底层、排水（明沟/暗管）、石灰或石灰石粉调酸、土壤检测报告。</li></ul><ul><li><strong>权威参数</strong>：大豆适宜 pH 约 6.5–7.5；南方红壤上大豆的临界 pH 约 4.38–4.95（低于此产量大幅下降）；酸性红壤的核心障碍是<strong>缺磷 + 铝毒</strong>（《土壤学报》：中国酸性土壤利用的科学问题与策略）。</li></ul><ul><li><strong>目的与作用</strong>：先测土再谈投资；改酸、补磷、修排水属一次性基建投入，必须进财务模型。</li></ul><ul><li><strong>底层逻辑</strong>：酸性土里铝被「激活」烧根，根坏了水肥与固氮全部失效。土壤是上限，不是变量。</li></ul><h2 id=\"sec-6\">五、种植模式与茬口</h2><ul><li><strong>核心名词</strong>：净作、间作/套作、大豆玉米带状复合种植（2行玉米配2–4行大豆，技术口诀「扩间增光、缩株保密」）、粮豆轮作、连作障碍、前茬残留。</li></ul><ul><li><strong>目的与作用</strong>：提高土地产出并争取政策支持；中央一号文件明确推广，西南地区以<strong>套作模式</strong>为主。</li></ul><ul><li><strong>底层逻辑</strong>：南方地少，政策鼓励「玉米不减、多收一季豆」。但复合种植的除草与机械作业难度比净作高一个量级，新手首年不宜上。</li></ul><h2 id=\"sec-7\">六、播种与养分</h2><ul><li><strong>核心名词</strong>：根瘤菌接种（Bradyrhizobium，共生固氮）、氮肥「启动量」、磷钾肥、钼/硼微量元素、种子包衣、播种密度（株行距）、保苗率、出苗率。</li></ul><ul><li><strong>目的与作用</strong>：用微生物免费造氮，用磷钾与微肥把花荚「保住」。酸性土需选用本地适配的<strong>耐酸根瘤菌株</strong>，外地菌剂常失效（《中国油料作物学报》：酸性土壤中大豆优势根瘤菌的分离与鉴定）。</li></ul><ul><li><strong>底层逻辑</strong>：大豆不是「多施氮就高产」，氮多只长叶、贪青倒伏；产量开关在<strong>结荚数</strong>。</li></ul><h2 id=\"sec-8\">七、水分管理</h2><ul><li><strong>核心名词</strong>：排水优先、渍害、需水关键期（开花—鼓粒 R1–R5）、灌溉保障率。</li></ul><ul><li><strong>目的与作用</strong>：同时具备「排得出」与「关键期浇得上」两种能力。</li></ul><ul><li><strong>底层逻辑</strong>：大豆怕涝甚于怕旱，但花荚鼓粒期缺水会直接减产。</li></ul><h2 id=\"sec-9\">八、草害</h2><ul><li><strong>核心名词</strong>：土壤封闭除草（播后苗前）、苗后茎叶处理、抗性杂草、除草剂药害与土壤残留（如玉米田常用烟嘧磺隆类对大豆敏感）、农药登记证、安全间隔期。</li></ul><ul><li><strong>目的与作用</strong>：在杂草竞争期之前压住草，避免后期不可逆的补救成本。</li></ul><ul><li><strong>底层逻辑</strong>：南方草长得比豆快。草害是<strong>时间窗问题</strong>；复合种植必须分带施药，否则一喷毁一带。</li></ul><h2 id=\"sec-10\">九、病虫鼠鸟</h2><ul><li><strong>核心名词</strong>：「症青」（植株晚熟不落叶、有荚无粒）、点蜂缘蝽（主凶，刺吸花荚）、根腐病、大豆锈病（南方高湿高发）、花叶病毒病（SMV）、斜纹夜蛾、豆荚螟、统防统治。</li></ul><ul><li><strong>权威参数</strong>：初荚期成虫密度达百株3–5头（或诱捕器单日诱集5头）即需用药，可选噻虫·高氯氟、高效氯氟氰菊酯、溴氰菊酯（北京市农业农村局测防专刊）；<strong>始荚期是点蜂缘蝽危害大豆的关键时期</strong>（宁波大学陈剑平院士团队，PNAS）。</li></ul><ul><li><strong>底层逻辑</strong>：最怕的不是叶子被吃，是<strong>花荚期被刺吸</strong>——该阶段损失不可逆。</li></ul><h2 id=\"sec-11\">十、收获与产后处理</h2><ul><li><strong>核心名词</strong>：黄熟期/完熟期、籽粒含水率、机收损失率、炸荚、破碎粒、烘干、安全储粮水分、杂质、仓储虫霉。</li></ul><ul><li><strong>权威参数</strong>：机收最佳期在<strong>黄熟期后至完熟期之间</strong>，籽粒含水率 15%–25%、茎秆含水率 45%–55%，豆叶全部脱落、豆粒归圆、摇动植株有清脆响声（农业农村部农业机械化管理司《大豆机械化收获减损技术指导意见》）。</li></ul><ul><li><strong>目的与作用</strong>：把地里的产量真正变成仓里的商品量。</li></ul><ul><li><strong>底层逻辑</strong>：产量不是长出来的，是<strong>收回来的</strong>。晚收炸荚、早收霉变，两头都亏；南方秋雨季必须预置烘干能力。</li></ul><h2 id=\"sec-12\">十一、销售与定价</h2><ul><li><strong>核心名词</strong>：食用豆 vs 油用豆、地头价、订单农业/保底收购、购销合同、GB 1352《大豆》质量分级（水分、杂质、完整粒率等）、食品安全限量（农残 GB 2763、真菌毒素 GB 2761）、豆一期货（大商所）作价格参照、非转基因属性与标识。</li></ul><ul><li><strong>权威参数</strong>：国产大豆约<strong>72%用于豆制品</strong>、约13%加工大豆蛋白、约10%加工油脂与豆粕（新华社，2024）。广西大豆以食用为主，用于豆腐、腐竹、腐乳（广西农科院）。</li></ul><ul><li><strong>目的与作用</strong>：确定买家、质量口径与回款方式，反向决定品种与采收标准。</li></ul><ul><li><strong>底层逻辑</strong>：本地加工端拼的是<strong>蛋白含量与外观（大粒、无霉无虫）</strong>，不是单产。<strong>先谈好买家再种，不要种完再找买家。</strong></li></ul><h2 id=\"sec-13\">十二、政策、补贴与保险</h2><ul><li><strong>核心名词</strong>：中央一号文件、大豆和油料产能提升工程、玉米大豆生产者补贴（主要面向东北，广西不适用）、耕地地力保护补贴、大豆完全成本保险 / 种植收入保险、保费补贴比例、《全国农产品成本收益资料汇编》（国家发改委，成本与地头价的官方口径）。</li></ul><ul><li><strong>权威参数</strong>：财政部、农业农村部、金融监管总局《关于扩大大豆完全成本保险和种植收入保险政策实施范围的通知》（财金〔2024〕83号）：2025年政策覆盖各省区市；保障水平原则上<strong>不高于相应产值的80%</strong>；保费补贴为省级不低于25%基础上，中央财政对中西部及东北地区补贴<strong>45%</strong>。2026年中央一号文件配套实施意见要求将粮食、大豆和油料生产目标任务下达各省份。</li></ul><ul><li><strong>底层逻辑</strong>：农业赚的是「政策 + 规模 + 运营」的综合收益。<strong>不买完全成本保险的规模种植等于裸奔。</strong></li></ul><h2 id=\"sec-14\">十三、成本—收益模型与风控</h2><ul><li><strong>核心名词</strong>：单位经济（每亩）、物化成本/土地成本/人工成本、盈亏平衡亩产、保本价、投入产出比、敏感性分析（单产±20%、价格±20%）、资金峰值与回笼周期。</li></ul><ul><li><strong>目的与作用</strong>：在投钱之前用纸面判断项目是否成立。</li></ul><ul><li><strong>底层逻辑</strong>：先算<strong>保本亩产</strong>。若保本亩产高于当地平均水平（广西100多公斤），只有达到纪录级产量（220公斤）才赚钱，则项目在纸面上就不成立。</li></ul><h2 id=\"sec-15\">十四、复盘与下一轮循环</h2><ul><li><strong>核心名词</strong>：田间档案（投入品、天气、物候、病虫记录）、测产与对标、轮作安排、地力恢复（秸秆还田、绿肥）、品种迭代、合同续签与租金重谈、农机折旧与维护。</li></ul><ul><li><strong>目的与作用</strong>：把一季的经验固化为可复用的参数表，降低下一轮的不确定性。</li></ul><ul><li><strong>底层逻辑</strong>：农业的复利来自<strong>同一块地的数据积累</strong>。第一年真正的产出不是豆子，是一套可靠的田间数据与一张被验证的成本表。</li></ul><h2 id=\"sec-16\">待核实数据清单（未核到原始文件，暂不给数值）</h2><div class=\"todo\"><span class=\"tick\">☐</span> GB 1352《大豆》最新版各等级的水分 / 杂质 / 完整粒率具体限值</div><div class=\"todo\"><span class=\"tick\">☐</span> 广西 2024—2025 年大豆播种面积、单产、总产官方统计数（自治区统计局 / 统计年鉴）</div><div class=\"todo\"><span class=\"tick\">☐</span> 广西本级大豆保险保额、费率、保费分担比例（自治区财政厅 / 农业农村厅文件）</div><div class=\"todo\"><span class=\"tick\">☐</span> 广西当地土地流转租金、农机作业与人工单价（无全国权威口径，需实地询价）</div><div class=\"todo\"><span class=\"tick\">☐</span> 广西主产县的春 / 夏 / 秋豆适播期区间与寒露风常年初日</div><h2 id=\"sec-17\">参考来源</h2><ul><li>广西农科院 / 广西日报：<a href=\"http://www.gxaas.net/front/detail/150/3200/43266\" target=\"_blank\" rel=\"noopener\">南方大豆也高产（桂夏7号亩产220.5公斤）</a></li></ul><ul><li><a href=\"https://www.cabidigitallibrary.org/doi/pdf/10.5555/20210377281\" target=\"_blank\" rel=\"noopener\">广西大豆产业现状分析及其发展建议</a></li></ul><ul><li>《土壤学报》：<a href=\"http://pedologica.issas.ac.cn/html/trxb/2023/5/trxb202307250290.htm\" target=\"_blank\" rel=\"noopener\">中国酸性土壤利用的科学问题与策略</a></li></ul><ul><li>《中国油料作物学报》：<a href=\"http://www.jouroilcrops.cn/EN/article/downloadArticleFile.do?attachType=PDF&amp;id=505\" target=\"_blank\" rel=\"noopener\">酸性土壤中大豆优势根瘤菌的分离、鉴定及其生物学特性</a></li></ul><ul><li>北京市农业农村局：<a href=\"https://nyncj.beijing.gov.cn/nyj/zwgk/ztgk/zwbhxx/436217233/index.html\" target=\"_blank\" rel=\"noopener\">点蜂缘蝽的识别与监测防控</a></li></ul><ul><li>宁波大学：<a href=\"https://ipv.nbu.edu.cn/info/1020/5078.htm\" target=\"_blank\" rel=\"noopener\">点蜂缘蝽危害引发大豆「症青」的新机制（PNAS）</a></li></ul><ul><li>农业农村部农业机械化管理司：<a href=\"https://njhs.moa.gov.cn/tzggjzcjd/202109/t20210923_6377124.htm\" target=\"_blank\" rel=\"noopener\">大豆机械化收获减损技术指导意见</a></li></ul><ul><li>财政部：<a href=\"http://jrs.mof.gov.cn/zhengcefabu/phjr/202409/t20240926_3944456.htm\" target=\"_blank\" rel=\"noopener\">关于扩大大豆完全成本保险和种植收入保险政策实施范围的通知（财金〔2024〕83号）</a></li></ul><ul><li>新华社：<a href=\"http://www.xinhuanet.com/food/20241220/c1de7c103c114f1f984d46b53ea78a3c/c.html\" target=\"_blank\" rel=\"noopener\">今年大豆播种面积1.55亿亩，产业链不断延伸</a></li></ul><ul><li>农业农村部：<a href=\"https://www.jingyuan.gov.cn/zfxxgk/bmhxzxxgk/xzxxgk/stz/fdzdgknr/snzc/qnhnxx/art/2026/art_9cd120a26cf143f49df56a478b83f35b.html\" target=\"_blank\" rel=\"noopener\">关于落实中央一号文件的实施意见（2026年1月19日）</a></li></ul><h2 id=\"sec-18\">修订记录</h2><div class=\"tbl-wrap\"><table><tr><td>版本</td><td>日期</td><td>修订内容</td></tr><tr><td>v1.0</td><td>2026-10-04</td><td>建立全流程大纲（三个本质矛盾 + 14部分），附权威来源与待核实清单</td></tr></table></div>"}, {"no": "02", "id": "efbf7f5e-0969-4993-a2da-1c9905f55292", "head": "总索引", "sub": "9讲 176 张名词卡导航", "tag": "总索引", "num": "🧭", "secs": 11, "cards": 3, "mins": 2, "cardinfo": "· 3 张名词卡", "html": "<div class=\"callout\"><span class=\"co-icon\">📚</span><div><strong>广西大豆种植投资教材 · 总索引</strong><ul><li>全套共 <strong>9 讲 / 176 张名词卡</strong>，每张卡格式统一为：名词 → 大白话 → 为什么重要 → 新手最常踩的坑</li></ul><ul><li>版本：v1.0｜写作日期：2026-10-04｜对话轮次：0012</li></ul><ul><li>上游大纲：<a href=\"https://app.notion.com/p/2154c1eab76a4e9aa8111f0bd9db7e6d\" target=\"_blank\" rel=\"noopener\">广西大豆种植投资基础常识 · 全流程大纲（0001）</a></li></ul></div></div><h2 id=\"sec-1\">一、讲次导航</h2><div class=\"tbl-wrap\"><table><tr><td>讲次</td><td>页面</td><td>卡号</td><td>对应大纲</td><td>这一讲回答的核心问题</td></tr><tr><td>第一讲</td><td><a href=\"https://app.notion.com/p/79cd312bcfd54e2d9c0b7eb9d548f19c\" target=\"_blank\" rel=\"noopener\">Untitled</a></td><td>1–13</td><td>零、一</td><td>这件事的底层矛盾是什么？用什么身份、租什么地？</td></tr><tr><td>第二讲</td><td><a href=\"https://app.notion.com/p/77ce997846e54e59802743de3e8c98a2\" target=\"_blank\" rel=\"noopener\">Untitled</a></td><td>14–33</td><td>二、三</td><td>种什么品种？什么时候播？</td></tr><tr><td>第三讲</td><td><a href=\"https://app.notion.com/p/8a598a91aeb84083b7f2b88ec273bff7\" target=\"_blank\" rel=\"noopener\">Untitled</a></td><td>34–51</td><td>四、五</td><td>地能不能种？怎么改？净作还是套种？</td></tr><tr><td>第四讲</td><td><a href=\"https://app.notion.com/p/1711214af143443793bcdc1264bb5f34\" target=\"_blank\" rel=\"noopener\">Untitled</a></td><td>52–69</td><td>六、七</td><td>怎么种下去？怎么施肥排水？</td></tr><tr><td>第五讲</td><td><a href=\"https://app.notion.com/p/8b51c47daccc40cbb1a2d86de3c7d94a\" target=\"_blank\" rel=\"noopener\">Untitled</a></td><td>70–96</td><td>八、九</td><td>什么会把它弄死？什么时候动手？</td></tr><tr><td>第六讲</td><td><a href=\"https://app.notion.com/p/2afd5aa704b64422903a214f879e61bf\" target=\"_blank\" rel=\"noopener\">Untitled</a></td><td>97–124</td><td>十、十一</td><td>什么时候收？卖给谁？怎么定价？</td></tr><tr><td>第七讲</td><td><a href=\"https://app.notion.com/p/e24165facd0348b3aa7012c1c866001b\" target=\"_blank\" rel=\"noopener\">Untitled</a></td><td>125–142</td><td>十二</td><td>外部能给我多少对冲？</td></tr><tr><td>第八讲</td><td><a href=\"https://app.notion.com/p/1cc5029754224785aeb8f10b7c73f415\" target=\"_blank\" rel=\"noopener\">Untitled</a></td><td>143–160</td><td>十三</td><td>到底投还是不投？投多少？</td></tr><tr><td>第九讲</td><td><a href=\"https://app.notion.com/p/87bb4bac68c04449b09b2d2a58a284d4\" target=\"_blank\" rel=\"noopener\">Untitled</a></td><td>161–176</td><td>十四</td><td>要不要有第二年？怎么让它更好？</td></tr></table></div><h2 id=\"sec-2\">二、全套教材的四条主线结论</h2><div class=\"callout\"><span class=\"co-icon\">⚠️</span><div>如果只记四句话，记这四句。<ol><li><strong>「我有优良种子」在广西默认无效。</strong>大豆是短日照作物，品种跟纬度走。必须用广西审定或本生态区引种备案的品种，北方高产品种在这里是负债。</li></ol><ol><li><strong>南方大豆的主要死因是水和虫，不是旱。</strong>排水优先于灌溉；症青（初荚期虫害）是最致命的单点风险。</li></ol><ol><li><strong>利润不在田里，在收后两周和播种前一天。</strong>卖给谁必须在播种前定；机收、烘干、分级决定最终到手价。</li></ol><ol><li><strong>先算保本价，再决定投不投。</strong>保本亩产若接近或超过区域平均亩产，账面上就不成立。</li></ol></div></div><h2 id=\"sec-3\">三、三条阅读路线（按用途选）</h2><h3 id=\"sec-4\">路线 A：快速决策线（先判断这个项目该不该做）</h3><p>第一讲（本质矛盾）→ 第八讲（保本价与四条生死假设）→ 第九讲卡174（扩种/维持/退出规则）</p><p><strong>用时最短，结论最硬。</strong>如果这条线走完发现账算不过来，其余六讲都不必读。</p><h3 id=\"sec-5\">路线 B：技术落地线（决定做了，跟专家和现场负责人对话）</h3><p>第二讲（品种与农时）→ 第三讲（土壤与模式）→ 第四讲（播种与水肥）→ 第五讲（植保）→ 第六讲（收获产后）</p><p><strong>按生产时间顺序排列。</strong>这五讲里的每一张卡都对应一个现场动作或一个可问的问题。</p><h3 id=\"sec-6\">路线 C：谈判签约线（跟农户、服务队、收购方打交道前看）</h3><p>第一讲卡8（流转合同六要素）→ 第六讲卡114、121、124（订单、合同要素、保底线）→ 第七讲卡128（补贴归属）→ 第九讲卡170、172（续签与关系资产）</p><p><strong>这条线上的每一张卡都对应一个合同条款。</strong>签字前对照一遍。</p><h2 id=\"sec-7\">四、高概率 + 高影响风险的四个入口</h2><p>按第八讲卡157的风险矩阵，落在最危险格子的只有这四项。<strong>资源应该全部扑在这里，其余都是次要矛盾</strong>。</p><div class=\"tbl-wrap\"><table><tr><td>风险</td><td>本质</td><td>查哪里</td></tr><tr><td>品种不适应</td><td>短日照 + 生育期组错配</td><td>第一讲卡1–2、第二讲</td></tr><tr><td>湿涝与渍害</td><td>根系缺氧</td><td>第一讲卡3、第四讲</td></tr><tr><td>症青</td><td>初荚期虫害造成只长秆不结粒</td><td>第五讲</td></tr><tr><td>卖不出价</td><td>没提前定买家 + 上市期扣压</td><td>第六讲、第八讲卡149</td></tr></table></div><h2 id=\"sec-8\">五、常用公式速查</h2><div class=\"tbl-wrap\"><table><tr><td>要算的东西</td><td>公式</td><td>出处</td></tr><tr><td>保本亩产</td><td>每亩总成本 ÷ 地头价</td><td>第八讲卡148</td></tr><tr><td>保本价</td><td>每亩总成本 ÷ 入仓商品亩产</td><td>第八讲卡149</td></tr><tr><td>入仓商品亩产</td><td>实收亩产 × 机收得率 × 扣水扣杂折算率</td><td>第八讲卡145</td></tr><tr><td>产量归因拆解</td><td>每亩株数 × 单株结荚数 × 每荚粒数 × 粒重</td><td>第九讲卡163</td></tr></table></div><h2 id=\"sec-9\">六、配套工具页</h2><div class=\"tbl-wrap\"><table><tr><td>页面</td><td>用途</td></tr><tr><td><a href=\"https://app.notion.com/p/7e1676439aff4c9a867248370a1d9525\" target=\"_blank\" rel=\"noopener\">Untitled</a></td><td>9 讲的待核实条目合并去重为 41 项，按 P0 / P1 / P2 排序</td></tr><tr><td><a href=\"https://app.notion.com/p/f399bd7e8b1a48a9add93d2f858c027e\" target=\"_blank\" rel=\"noopener\">Untitled</a></td><td>把 41 项拆到八组走访对象，给出逐条问法与红旗信号</td></tr></table></div><p><strong>使用顺序</strong>：走完阅读路线 A → 打开待核实总表看 P0 十一项 → 带着尽调走访提纲下去跑三天 → 回填数据、升版本号。</p><h2 id=\"sec-10\">七、维护说明</h2><ul><li>每讲页尾都有独立的<strong>「待核实」清单</strong>和<strong>「修订记录」</strong>表。实地调研拿到数据后，回填到对应讲次并升版本号。</li></ul><ul><li>教材中所有未标来源的本地具体数值一律留白，<strong>没有猜测值</strong>。凡是需要具体数字的地方，都在待核实清单里。</li></ul><ul><li>卡编号全套连续（1–176），跨讲引用一律用「第 X 讲卡 N」格式。</li></ul><h2 id=\"sec-11\">修订记录</h2><div class=\"tbl-wrap\"><table><tr><td>版本</td><td>日期</td><td>修订内容</td></tr><tr><td>v1.0</td><td>2026-10-04</td><td>建立总索引：9 讲导航表、四条主线结论、三条阅读路线、四大风险入口、公式速查</td></tr><tr><td>v1.1</td><td>2026-10-04</td><td>修正第二讲页面链接</td></tr><tr><td>v1.2</td><td>2026-10-04</td><td>新增配套工具页节：待核实总表与尽调走访提纲</td></tr></table></div>"}, {"no": "03", "id": "79cd312b-cfd5-4e2d-9c0b-7eb9d548f19c", "head": "第一讲", "sub": "三个本质矛盾与立项主体", "tag": "第一讲", "num": "1", "secs": 17, "cards": 13, "mins": 2, "cardinfo": "· 13 张名词卡", "html": "<div class=\"callout\"><span class=\"co-icon\">📘</span><div>教材第一讲｜对应大纲第零部分（三个本质矛盾）与第一部分（立项与经营主体）<ul><li>卡片格式：<strong>名词 → 大白话 → 为什么重要 → 新手最常踩的坑</strong></li></ul><ul><li>版本：v1.0｜写作日期：2026-10-04｜对话轮次：0003</li></ul><ul><li>上游大纲：<a href=\"https://app.notion.com/p/2154c1eab76a4e9aa8111f0bd9db7e6d\" target=\"_blank\" rel=\"noopener\">广西大豆种植投资基础常识 · 全流程大纲（0001）</a></li></ul></div></div><h2 id=\"sec-1\">第零部分：三个本质矛盾（必须先装进脑子）</h2><h3 id=\"sec-2\">1｜短日照作物</h3><ul><li><strong>大白话</strong>：大豆靠「白天变短」来判断该开花了。白天越短，它越着急开花结籽。</li></ul><ul><li><strong>为什么重要</strong>：广西纬度低、夏天白昼比东北短，北方品种一到广西就「误以为秋天到了」，还没长大就开花，个子矮、荚少、产量腰斩。</li></ul><ul><li><strong>常见坑</strong>：把「东北高产品种」当资产。在南方它是负债。唯一正确做法：只用通过<strong>广西审定</strong>或在本生态区<strong>引种备案</strong>的品种。</li></ul><h3 id=\"sec-3\">2｜生育期组</h3><ul><li><strong>大白话</strong>：品种的「时长标签」，表示它从播到收需要多长、适合哪个纬度带。</li></ul><ul><li><strong>为什么重要</strong>：选错生育期组 = 选错纬度 = 第1条矛盾的具体表现。</li></ul><ul><li><strong>常见坑</strong>：只看宣传亩产，不看适宜生态区。</li></ul><h3 id=\"sec-4\">3｜涝害（渍害）</h3><ul><li><strong>大白话</strong>：根被水泡着，没氧气，闷死。</li></ul><ul><li><strong>为什么重要</strong>：广西年雨量大且集中，南方大豆主要死因是泡水和高湿病害，不是旱。</li></ul><ul><li><strong>常见坑</strong>：按北方思路先想灌溉，不先修排水沟。</li></ul><h3 id=\"sec-5\">4｜落花落荚</h3><ul><li><strong>大白话</strong>：花开了、小荚结了，但高温高湿或缺水缺肥时，植株自己「把孩子扔掉」保命。</li></ul><ul><li><strong>为什么重要</strong>：大豆天生花多荚少，落荚率本来就高；产量就是「保住了多少荚」。</li></ul><ul><li><strong>常见坑</strong>：看到开花满田就乐观估产。开花不等于收成。</li></ul><h3 id=\"sec-6\">5｜单季现金流</h3><ul><li><strong>大白话</strong>：一年只结一次账，钱全押在一次收获上。</li></ul><ul><li><strong>为什么重要</strong>：决定了风控方式只能是前置的（试种、保险、订单），不能是事后补救的。</li></ul><ul><li><strong>常见坑</strong>：第一年就上千亩规模，用规模去赌一个自己还没验证过的技术路线。</li></ul><h2 id=\"sec-7\">第一部分：立项与经营主体</h2><h3 id=\"sec-8\">6｜新型农业经营主体</h3><ul><li><strong>大白话</strong>：国家认的「正规种地的人」——家庭农场、农民合作社、农业企业三种身份。</li></ul><ul><li><strong>为什么重要</strong>：<strong>身份决定你能不能拿补贴、能不能投政策性保险、能不能签正规购销合同</strong>。个人散户身份在这三件事上都吃亏。</li></ul><ul><li><strong>常见坑</strong>：先租地再想注册主体，结果合同签在个人名下，补贴和保险都挂不上。</li></ul><h3 id=\"sec-9\">7｜三权分置（所有权／承包权／经营权）</h3><ul><li><strong>大白话</strong>：地是村集体的（所有权），村民有长期承包权，你租到的是<strong>经营权</strong>。</li></ul><ul><li><strong>为什么重要</strong>：你能投入多少、投多久，取决于经营权的年限和稳定性。改土、修沟、建烘干房都是长期投入。</li></ul><ul><li><strong>常见坑</strong>：以为「交了租金地就是我的」。实际上承包户可能因征地、转让、家庭纠纷随时找回来谈判。</li></ul><h3 id=\"sec-10\">8｜土地流转合同</h3><ul><li><strong>大白话</strong>：你和农户（或村集体）签的租地合同。</li></ul><ul><li><strong>为什么重要</strong>：项目第一笔真实风险在这张纸上。必须写清六件事：<strong>面积与地块图、年限、租金与调价机制、补贴归谁、地力改良与附着物归属、提前退出的赔偿规则</strong>。</li></ul><ul><li><strong>常见坑</strong>：①租期只签1–3年（改土投入收不回）；②没写补贴归属；③没写「你修的沟渠、铺的管道到期怎么算」；④口头约定、无四至边界图。</li></ul><h3 id=\"sec-11\">9｜耕地用途管制与「非粮化」</h3><ul><li><strong>大白话</strong>：国家规定哪些地只能种粮，不许种树、挖塘、盖房。</li></ul><ul><li><strong>为什么重要</strong>：种大豆属于粮油作物，是<strong>政策鼓励方向</strong>，这点对你有利；但必须核清地块的地类（耕地？永久基本农田？林地？园地？）。</li></ul><ul><li><strong>常见坑</strong>：租到名义上是耕地、实际已擂荒成林地的地块，后续补贴和保险都报不上。</li></ul><h3 id=\"sec-12\">10｜永久基本农田</h3><ul><li><strong>大白话</strong>：国家划红线锁死的最优质耕地，保护等级最高。</li></ul><ul><li><strong>为什么重要</strong>：在上面种大豆完全合规，但<strong>不许建任何永久设施</strong>（烘干房、仓库、晒场）。</li></ul><ul><li><strong>常见坑</strong>：把烘干仓库建在基本农田上，属违法占耕，面临拆除。</li></ul><h3 id=\"sec-13\">11｜高标准农田</h3><ul><li><strong>大白话</strong>：政府已经出钱修好了路、沟、渠、电的成片农田。</li></ul><ul><li><strong>为什么重要</strong>：<strong>直接省掉你最贵的一笔基建</strong>（排水和机械通行），且地块连片，机械效率高。</li></ul><ul><li><strong>常见坑</strong>：不去打听当地高标准农田项目区的位置，而在坡耕地上硬干。</li></ul><h3 id=\"sec-14\">12｜地块连片度与机械通行性</h3><ul><li><strong>大白话</strong>：地是不是挨在一起、路够不够宽让收割机开进去。</li></ul><ul><li><strong>为什么重要</strong>：广西旱地碎、坡地多，<strong>机械进不去，人工成本就会直接把利润吃光</strong>。机收还是人工收，是南方大豆项目最大的成本分水岭之一。</li></ul><ul><li><strong>常见坑</strong>：按「总亩数」算成本，不按「可机作业亩数」算。</li></ul><h3 id=\"sec-15\">13｜社会化服务（代耕代种、统防统治）</h3><ul><li><strong>大白话</strong>：不自己买农机和打药队，花钱请专业服务队干。</li></ul><ul><li><strong>为什么重要</strong>：第一年<strong>不要买农机</strong>。用服务外包把固定成本变成可变成本，先验证技术路线再谈资产投入。</li></ul><ul><li><strong>常见坑</strong>：开局就买拖拉机、播种机、收割机，一年用几天，折旧吃掉全部利润。</li></ul><h2 id=\"sec-16\">本讲结论（记这三句）</h2><ol><li>「我有优良种子」在广西默认无效，必须按本生态区审定／备案重新选种。</li></ol><ol><li>第一笔风险在流转合同，不在田里；先定主体身份，再签地。</li></ol><ol><li>首年只买服务、不买资产；成本按「可机作业亩」算。</li></ol><h2 id=\"sec-17\">修订记录</h2><div class=\"tbl-wrap\"><table><tr><td>版本</td><td>日期</td><td>修订内容</td></tr><tr><td>v1.0</td><td>2026-10-04</td><td>建立第一讲：三个本质矛盾（5张卡）+ 立项与经营主体（8张卡）</td></tr><tr><td>v1.1</td><td>2026-10-04</td><td>校正用字：擂荒、硬干</td></tr></table></div>"}, {"no": "04", "id": "77ce9978-46e5-4e59-8027-43de3e8c98a2", "head": "第二讲", "sub": "种子品种与气候农时", "tag": "第二讲", "num": "2", "secs": 26, "cards": 20, "mins": 3, "cardinfo": "· 20 张名词卡", "html": "<div class=\"callout\"><span class=\"co-icon\">🌦️</span><div>教材第二讲｜对应大纲第二部分（种子与品种）与第三部分（气候与农时）<ul><li>卡片格式：<strong>名词 → 大白话 → 为什么重要 → 新手最常踩的坑</strong>（卡编号接第一讲，从14开始）</li></ul><ul><li>版本：v1.0｜写作日期：2026-10-04｜对话轮次：0004</li></ul><ul><li>上游大纲：<a href=\"https://app.notion.com/p/2154c1eab76a4e9aa8111f0bd9db7e6d\" target=\"_blank\" rel=\"noopener\">广西大豆种植投资基础常识 · 全流程大纲（0001）</a>｜上一讲：<a href=\"https://app.notion.com/p/79cd312bcfd54e2d9c0b7eb9d548f19c\" target=\"_blank\" rel=\"noopener\">大豆教材·第一讲｜三个本质矛盾与立项主体（名词卡）</a></li></ul></div></div><h2 id=\"sec-1\">第二部分：种子与品种</h2><h3 id=\"sec-2\">14｜主要农作物品种审定</h3><ul><li><strong>大白话</strong>：国家规定几种重要作物（包括大豆）的新品种，必须先经过多年多点区试并通过审定，才能合法卖、合法种。</li></ul><ul><li><strong>为什么重要</strong>：大豆是「主要农作物」，没审定号的种子属于未授权品种，<strong>出事没有索赔依据，也影响补贴与保险认定</strong>。</li></ul><ul><li><strong>常见坑</strong>：朋友或专家「自己选育的好种」没有审定号就大面积上，一旦减产，损失全自负。</li></ul><h3 id=\"sec-3\">15｜适宜生态区与引种备案</h3><ul><li><strong>大白话</strong>：每个审定品种都附带一句「适合在哪些地方种」。在同一个气候相似的生态区内，可以把别省审定的品种引过来用，但要向农业部门<strong>备案</strong>。</li></ul><ul><li><strong>为什么重要</strong>：这是「北方种子能不能用」的法律答案：<strong>不同生态区不得随意引种</strong>，因为日长与热量条件不同，品种会失效。</li></ul><ul><li><strong>常见坑</strong>：以为「国审品种全国都能种」。国审也有适宜区范围，超区种植风险自担。</li></ul><h3 id=\"sec-4\">16｜季别（春豆／夏豆／秋豆）</h3><ul><li><strong>大白话</strong>：广西一年能种多季，按播种季节分成春豆、夏豆、秋豆，每一季要用不同品种。</li></ul><ul><li><strong>为什么重要</strong>：广西大豆以<strong>夏豆+秋豆为主（约72%）、春豆约28%</strong>；季别决定你的花荚期撞上哪种灾害（夏豆撞暴雨高温，秋豆撞寒露风）。</li></ul><ul><li><strong>常见坑</strong>：用夏豆品种种秋豆，或把两季一起上，结果两季都半成品。</li></ul><h3 id=\"sec-5\">17｜百粒重</h3><ul><li><strong>大白话</strong>：100粒干豆有多少克，就是豆粒的「个头」指标。</li></ul><ul><li><strong>为什么重要</strong>：食用市场（豆腐、豆浆、豆粒直销）<strong>偏爱大粒</strong>，大粒能卖出价差；它也直接影响播种用种量（粒越大，每亩用种斤数越多）。</li></ul><ul><li><strong>常见坑</strong>：按「每亩多少斤种子」拍脑袋买种，不按百粒重和目标密度反算。</li></ul><h3 id=\"sec-6\">18｜蛋白含量与含油量</h3><ul><li><strong>大白话</strong>：豆子里蛋白和油各占多少比例。两者大致此消彼长。</li></ul><ul><li><strong>为什么重要</strong>：做豆腐腐竹的工厂按<strong>蛋白</strong>出价（蛋白高→出豆腐多），榨油厂按<strong>含油量</strong>出价。国产大豆约<strong>72%用于豆制品</strong>，广西更是以豆腐、腐竹、腐乳等食用为主。</li></ul><ul><li><strong>常见坑</strong>：先种再找买家，结果品种是油用型，本地豆腐厂不收或压价。</li></ul><h3 id=\"sec-7\">19｜抗倒性（倒伏）</h3><ul><li><strong>大白话</strong>：植株会不会被风雨打趴、或长得太旺自己倒下去。</li></ul><ul><li><strong>为什么重要</strong>：倒伏后下部的荚贴地发霉、机器<strong>收不起来</strong>，损失翻倍；广西多雨多风（含台风），抗倒性比宣传产量更关键。</li></ul><ul><li><strong>常见坑</strong>：选高杆大叶、多施氮追求「长得旺」，最后满田倒伏。</li></ul><h3 id=\"sec-8\">20｜抗病性</h3><ul><li><strong>大白话</strong>：品种对特定病害天生有多大抵抗力（广西重点看锈病、病毒病、根腐病）。</li></ul><ul><li><strong>为什么重要</strong>：南方高温高湿，大豆锈病高发；抗性是<strong>零成本的防治手段</strong>，比后期打药便宜得多。</li></ul><ul><li><strong>常见坑</strong>：只问产量，不问抗病抗倒，把所有风险留给药剂去扑。</li></ul><h3 id=\"sec-9\">21｜种子质量指标（发芽率、净度、水分）</h3><ul><li><strong>大白话</strong>：买种子要看三个数：多少比例能发芽、杂物多不多、潮不潮。</li></ul><ul><li><strong>为什么重要</strong>：大豆种子比玉米「娇气」得多，<strong>豆粒容易碰伤、怕潮怕热，存放不当发芽率就崩</strong>；发芽率直接决定你的保苗数和补播成本。</li></ul><ul><li><strong>常见坑</strong>：种子散装、无标签、放在潮没空调的仓里过夏，播下去出苗不足一半。</li></ul><h3 id=\"sec-10\">22｜种子标签与来源合法性</h3><ul><li><strong>大白话</strong>：正规种子袋上必须有品种名、审定编号、生产经营许可证编号、质量指标、生产日期。</li></ul><ul><li><strong>为什么重要</strong>：这张标签和发票是你<strong>唯一的索赔凭证</strong>；没有它，出问题只能自己承担。</li></ul><ul><li><strong>常见坑</strong>：买「亲戚朋友家的好豆」当种子，没票没标签。</li></ul><h3 id=\"sec-11\">23｜自留种与品种退化</h3><ul><li><strong>大白话</strong>：用自己收的豆做下一季种子。大豆是自交作物，短期可行，但多年下来会混杂、质量下滑。</li></ul><ul><li><strong>为什么重要</strong>：短期能省种子钱，但一致性（成熟期、粒径）变差会抬高机收损失和商品降级风险。</li></ul><ul><li><strong>常见坑</strong>：第二年全用自留种扩大规模，把第一年的技术数据全部作废。</li></ul><h2 id=\"sec-12\">第三部分：气候与农时</h2><h3 id=\"sec-13\">24｜积温</h3><ul><li><strong>大白话</strong>：把作物一生经历的每天有效温度加起来。作物不是按日历长大，是按<strong>收够多少热量</strong>长大。</li></ul><ul><li><strong>为什么重要</strong>：解释为什么同一品种早播晚播生长期会变；也解释为什么广西热量够一年多季。</li></ul><ul><li><strong>常见坑</strong>：套用北方经验的「生长多少天」安排农事，忽略温度差异。</li></ul><h3 id=\"sec-14\">25｜日长（光周期响应）</h3><ul><li><strong>大白话</strong>：每天白天多长。越南、越晚季，白天越短。</li></ul><ul><li><strong>为什么重要</strong>：它是大豆的<strong>开花开关</strong>（见第一讲第1张卡）。同一品种春播与秋播，株高、生长期、产量可以完全不同。</li></ul><ul><li><strong>常见坑</strong>：把秋季开花早归因于「肥没施够」，继续加肥，越加越错。</li></ul><h3 id=\"sec-15\">26｜生育期分期（V期／R期）</h3><ul><li><strong>大白话</strong>：国际通用的大豆「时间刻度」。V = 长身体的营养期（按叶片数计），R = 生孩子的生殖期：<strong>R1开花 → R3结荚 → R5鼓粒 → R8完熟</strong>。</li></ul><ul><li><strong>为什么重要</strong>：所有关键操作（打虫、补肥、灌水、收割）都按这套刻度定时，<strong>不按日历定时</strong>。比如点蜂缘蝽要在始荚期打，不是「八月初打」。</li></ul><ul><li><strong>常见坑</strong>：干活按日子排班，而不是下田看生育阶段，最佳用药窗口全部错过。</li></ul><h3 id=\"sec-16\">27｜播期窗口（农时）</h3><ul><li><strong>大白话</strong>：一年里只有一段时间播下去最合算，前后差几天没事，差半个月就是两个结果。</li></ul><ul><li><strong>为什么重要</strong>：播期的唯一目标是让<strong>开花结荚鼓粒期（R1–R5）避开当地最糟的天气</strong>。它是农业里唯一免费的保险。</li></ul><ul><li><strong>常见坑</strong>：等农机、等工人、等种子到货而推迟播期。资源调度必须在播期前就安排完。</li></ul><h3 id=\"sec-17\">28｜春季低温阴雨与烂种</h3><ul><li><strong>大白话</strong>：播后连续阴雨低温，种子在土里发不了芽，直接烂掉。</li></ul><ul><li><strong>为什么重要</strong>：广西春季回暖天、持续阴雨是常态，<strong>春豆最大的风险就是出苗</strong>；一旦烂种，要么补播（成本翻倍），要么缺株减产。</li></ul><ul><li><strong>常见坑</strong>：抢早播。应看天气预报，等一个「播后有几个晴天」的窗口。</li></ul><h3 id=\"sec-18\">29｜梅汛暴雨与涝害</h3><ul><li><strong>大白话</strong>：广西汛期（一般集中在汛期暴雨季）一场大雨几十到上百毫米，地里积水。</li></ul><ul><li><strong>为什么重要</strong>：<strong>大豆泡水超过24–48小时根就伤</strong>，花荚期泡水直接落荚。所以排水沟是基建里的第一优先项，不是灌溉。</li></ul><ul><li><strong>常见坑</strong>：平作不起垄、不开围沟，下一场大雨全田积水。</li></ul><h3 id=\"sec-19\">30｜台风</h3><ul><li><strong>大白话</strong>：夏秋从北部湾或广东绕过来的大风大雨。</li></ul><ul><li><strong>为什么重要</strong>：台风同时带来<strong>倒伏 + 积水 + 落荚 + 热表面潮湿诱发病害</strong>，且难以预防，只能靠避期、抗倒品种和保险对冲。</li></ul><ul><li><strong>常见坑</strong>：没把台风季节算进播期与收期安排，成熟期撞上台风。</li></ul><h3 id=\"sec-20\">31｜寒露风</h3><ul><li><strong>大白话</strong>：秋季（寒露前后）北方冷空气南下，温度突降、风大干凉。</li></ul><ul><li><strong>为什么重要</strong>：<strong>寒露风会直接打断秋豆的鼓粒过程</strong>，豆粒停在半成品状态，粒小、百粒重低、商品降级。它是广西秋豆的头号气候约束。</li></ul><ul><li><strong>常见坑</strong>：秋豆播太晚，把R5鼓粒期排到寒露风之后。常年寒露风初日是秋豆播期的<strong>倒排起点</strong>。</li></ul><h3 id=\"sec-21\">32｜秋旱</h3><ul><li><strong>大白话</strong>：广西秋季雨水锐减，连续不下雨。</li></ul><ul><li><strong>为什么重要</strong>：正好撞在秋豆的<strong>开花鼓粒需水关键期</strong>，这是广西唯一真正需要灌溉能力的阶段。</li></ul><ul><li><strong>常见坑</strong>：只修排水、不留水源，秋旱一来只能看着减产。</li></ul><h3 id=\"sec-22\">33｜物候记录</h3><ul><li><strong>大白话</strong>：把每年「哪天播、哪天出苗、哪天开花、哪天收」连同当天天气一起记下来。</li></ul><ul><li><strong>为什么重要</strong>：这是你第一年真正的产出。<strong>没有物候数据，第二年仍然是新手</strong>；有了它，播期和用药窗口就能逐年校准。</li></ul><ul><li><strong>常见坑</strong>：只记账不记田，年底复盘时说不清减产到底因为哪一步。</li></ul><h2 id=\"sec-23\">本讲结论（记这四句）</h2><ol><li>先查审定号与适宜生态区，再谈产量宣传；超区引种须备案。</li></ol><ol><li>品种指标的优先级：适宜区 &gt; 抗倒抗病 &gt; 蛋白（食用销路）&gt; 宣传亩产。</li></ol><ol><li>所有田间操作按 V/R 生育阶段定时，不按日历。</li></ol><ol><li>播期倒排法：先定「花荚鼓粒期要避开的灾害」（夏豆避暴雨台风，秋豆避寒露风），再倒推播种日。</li></ol><h2 id=\"sec-24\">待核实（本讲相关）</h2><div class=\"todo\"><span class=\"tick\">☐</span> 广西主产县春／夏／秋豆适播期区间与寒露风常年初日（需自治区气象局与当地农技部门口径）</div><div class=\"todo\"><span class=\"tick\">☐</span> 大豆耐涝极限时长的权威试验值（本讲所述24–48小时为产区经验口径，待文献核定）</div><div class=\"todo\"><span class=\"tick\">☐</span> 广西当年可选的审定品种清单与各自生育期、蛋白含量（需查品种审定公告原文）</div><h2 id=\"sec-25\">参考来源</h2><ul><li><a href=\"https://www.cabidigitallibrary.org/doi/pdf/10.5555/20210377281\" target=\"_blank\" rel=\"noopener\">广西大豆产业现状分析及其发展建议（季别构成）</a></li></ul><ul><li>广西农科院 / 广西日报：<a href=\"http://www.gxaas.net/front/detail/150/3200/43266\" target=\"_blank\" rel=\"noopener\">南方大豆也高产（桂夏7号亩产220.5公斤）</a></li></ul><ul><li>新华社：<a href=\"http://www.xinhuanet.com/food/20241220/c1de7c103c114f1f984d46b53ea78a3c/c.html\" target=\"_blank\" rel=\"noopener\">国产大豆用途结构（约72%用于豆制品）</a></li></ul><ul><li>农业农村部农业机械化管理司：<a href=\"https://njhs.moa.gov.cn/tzggjzcjd/202109/t20210923_6377124.htm\" target=\"_blank\" rel=\"noopener\">大豆机械化收获减损技术指导意见（成熟期判定）</a></li></ul><h2 id=\"sec-26\">修订记录</h2><div class=\"tbl-wrap\"><table><tr><td>版本</td><td>日期</td><td>修订内容</td></tr><tr><td>v1.0</td><td>2026-10-04</td><td>建立第二讲：种子与品种（10张卡）+ 气候与农时（10张卡）</td></tr></table></div>"}, {"no": "05", "id": "8a598a91-aeb8-4083-b7f2-b88ec273bff7", "head": "第三讲", "sub": "土壤耕地与种植模式", "tag": "第三讲", "num": "3", "secs": 24, "cards": 18, "mins": 3, "cardinfo": "· 18 张名词卡", "html": "<div class=\"callout\"><span class=\"co-icon\">🪨</span><div>教材第三讲｜对应大纲第四部分（土壤与耕地）与第五部分（种植模式与茬口）<ul><li>卡片格式：<strong>名词 → 大白话 → 为什么重要 → 新手最常踩的坑</strong>（卡编号接第二讲，从34开始）</li></ul><ul><li>版本：v1.0｜写作日期：2026-10-04｜对话轮次：0005</li></ul><ul><li>上游大纲：<a href=\"https://app.notion.com/p/2154c1eab76a4e9aa8111f0bd9db7e6d\" target=\"_blank\" rel=\"noopener\">广西大豆种植投资基础常识 · 全流程大纲（0001）</a>｜上一讲：<a href=\"https://app.notion.com/p/77ce997846e54e59802743de3e8c98a2\" target=\"_blank\" rel=\"noopener\">大豆教材·第二讲｜种子品种与气候农时（名词卡）</a></li></ul><ul><li>本讲定位：<strong>这两部分决定你的产量上限与基建投资额</strong>，是谈判租地前必须先懂的部分。</li></ul></div></div><h2 id=\"sec-1\">第四部分：土壤与耕地</h2><h3 id=\"sec-2\">34｜pH 值</h3><ul><li><strong>大白话</strong>：土的酸碱度。数值越小越酸，7 是中性。</li></ul><ul><li><strong>为什么重要</strong>：大豆适宜 pH 约 <strong>6.5–7.5</strong>。pH 不对，肥再多也吸不进去，根瘤菌也不干活。它是一切土壤问题的总开关。</li></ul><ul><li><strong>常见坑</strong>：租地、买种、买肥都安排完了，才想到测 pH。顺序应该是先测土、再签合同。</li></ul><h3 id=\"sec-3\">35｜土壤酸化</h3><ul><li><strong>大白话</strong>：土越种越酸。南方雨水多，把土里的钙、镁洗走；再加上长期大量用铵态氮肥（尿素、碳铵），酸化加速。</li></ul><ul><li><strong>为什么重要</strong>：酸化是一个<strong>持续过程</strong>，不是一次性状态。今年洒石灰调好了，几年后又会回酸，属于<strong>长期运营成本</strong>。</li></ul><ul><li><strong>常见坑</strong>：把改酸当一次性投入，模型里只算了第一年。</li></ul><h3 id=\"sec-4\">36｜铝毒（Al³⁺）</h3><ul><li><strong>大白话</strong>：土里本来就有大量铝，中性时它是惰性的石头；一旦变酸，铝被「溶出来」变成活性离子，直接烧根。</li></ul><ul><li><strong>为什么重要</strong>：这是南方酸性红壤的<strong>根本障碍之一</strong>（另一个是缺磷）。根被毒伤→根短、根毛少→水肥吸收与固氮全部失效。文献显示，南方红壤上大豆的临界 pH 约 <strong>4.38–4.95</strong>，低于此产量大幅下降。</li></ul><ul><li><strong>常见坑</strong>：见到苗黄、长不大，当成缺肥抢施氮肥，实际是根已被铝毒伤。</li></ul><h3 id=\"sec-5\">37｜缺磷与磷固定</h3><ul><li><strong>大白话</strong>：酸性红壤里的铁、铝会把磷「抱死」，变成作物拿不到的形式。所以不是你没施磷，是施下去的磷被锁死了。</li></ul><ul><li><strong>为什么重要</strong>：大豆结荚、根瘤固氮都是<strong>高耗磷过程</strong>。酸性红壤的核心障碍就是<strong>缺磷 + 铝毒</strong>（《土壤学报》）。解法是调酸 + 集中施磷（穴施、种肥同层错开），而不是满田撒施。</li></ul><ul><li><strong>常见坑</strong>：按北方中性土的磷肥用量套用到红壤，不调酸、不集中施，钱花了没效果。</li></ul><h3 id=\"sec-6\">38｜赤红壤／红壤</h3><ul><li><strong>大白话</strong>：广西最常见的土，红黄色、质地黏重、偏酸、有机质低。</li></ul><ul><li><strong>为什么重要</strong>：它同时具备三个缺点：<strong>酸（铝毒）、缺磷、雨后易板结且排水差</strong>。你的改良投入基本就是在对抗这三条。</li></ul><ul><li><strong>常见坑</strong>：把「土层厚」等同于「地力好」。红壤往往土深而贫。</li></ul><h3 id=\"sec-7\">39｜有机质</h3><ul><li><strong>大白话</strong>：土里的「腐殖质含量」，决定土的松软程度、保水保肥能力和微生物活泼度。</li></ul><ul><li><strong>为什么重要</strong>：有机质高，缓冲能力强，旱涝都更扣得住；它是<strong>免疫力指标</strong>，不是肥料指标。提升靠秸秆还田、绿肥、有机肥，要几年。</li></ul><ul><li><strong>常见坑</strong>：指望一季就把地养好。它是多年工程，属于第二、第三轮的回报项。</li></ul><h3 id=\"sec-8\">40｜耕层深度与犁底层</h3><ul><li><strong>大白话</strong>：耕层是根能自由长的那层松土；犁底层是长年用同一深度耕作、被机器压出来的一层硬底板。</li></ul><ul><li><strong>为什么重要</strong>：硬底板<strong>同时堵根和堵水</strong>——根下不去抗旱差，水下不去就积水。打破它靠深松（不翻转土层的松土作业）。</li></ul><ul><li><strong>常见坑</strong>：只旋耕（打碎表土十几厘米）就播种，年年旋耕把底板越压越实。</li></ul><h3 id=\"sec-9\">41｜起垄与排水系统（明沟、围沟、暗管）</h3><ul><li><strong>大白话</strong>：把地做成一条条高垄种在垄上，沟里走水；外围开围沟把水引出地块；地下埋管排水叫暗管。</li></ul><ul><li><strong>为什么重要</strong>：这是广西种大豆<strong>最划算的一笔投入</strong>。垄作把根托出积水面，一场暴雨的损失差别可以是整季。</li></ul><ul><li><strong>常见坑</strong>：只开田内小沟、不开出口沟，水在地头积着出不去。沟必须有「去处」。</li></ul><h3 id=\"sec-10\">42｜石灰调酸（石灰石粉、白云石粉）</h3><ul><li><strong>大白话</strong>：往酸土里撒石灰类物质，把 pH 抬上来，把活性铝「钝化成无害形态」。</li></ul><ul><li><strong>为什么重要</strong>：这是对抗铝毒最直接、最便宜的手段，也能补钙。但<strong>用量必须按土壤检测结果算</strong>，过量会诱发缺铁、缺锌等微量元素障碍。</li></ul><ul><li><strong>常见坑</strong>：听人说「洒点石灰就行」就满田撒，不测土、不算量、不提前撒（应在耕前撒入并翻匀）。</li></ul><h3 id=\"sec-11\">43｜土壤检测与测土配施</h3><ul><li><strong>大白话</strong>：取土样送检，拿到 pH、有机质、氮磷钾、交换性铝等数据，再按数据开肥方。</li></ul><ul><li><strong>为什么重要</strong>：它把「该不该投这块地」从感觉问题变成数据问题。测土费用在整个项目里几乎可以忽略，是<strong>最高性价比的风控步骤</strong>。</li></ul><ul><li><strong>常见坑</strong>：只取一个点的土代表整片地。应按地形分区、多点混样。</li></ul><h3 id=\"sec-12\">44｜坡度与水土流失</h3><ul><li><strong>大白话</strong>：地有多陡。坡地一下大雨，表土、肥料、种子跟着水跑。</li></ul><ul><li><strong>为什么重要</strong>：广西旱地坡地多，坡度同时影响<strong>肥流失、机械作业安全与效率</strong>，还影响能不能上高标准农田项目。</li></ul><ul><li><strong>常见坑</strong>：只看租金便宜就租坡地，细细算下来每亩作业成本比平地高得多。</li></ul><h2 id=\"sec-13\">第五部分：种植模式与茬口</h2><h3 id=\"sec-14\">45｜净作（单作）</h3><ul><li><strong>大白话</strong>：一块地只种大豆，不搭别的作物。</li></ul><ul><li><strong>为什么重要</strong>：最简单、最容易机械作业、除草与打药难度最低。<strong>第一年试种应该选净作</strong>，目的是拿到干净的技术数据。</li></ul><ul><li><strong>常见坑</strong>：第一年就上复合种植追求「两季收入」，结果变量太多，减产了也找不到原因。</li></ul><h3 id=\"sec-15\">46｜间作与套作</h3><ul><li><strong>大白话</strong>：间作 = 两种作物同时种在一块地的不同行里；套作 = 前一种还没收，就在它行间把后一种先播下去。</li></ul><ul><li><strong>为什么重要</strong>：南方地少季节紧，套作能<strong>把两季的生长期叠在一起</strong>，解决时间不够的问题。西南地区的大豆玉米主要就是<strong>套作模式</strong>。</li></ul><ul><li><strong>常见坑</strong>：不考虑机械轮距和喷药分带，设计出一个人工才能干的行距，人工成本吃掉多收的那一季。</li></ul><h3 id=\"sec-16\">47｜大豆玉米带状复合种植</h3><ul><li><strong>大白话</strong>：国家重点推广的模式：按带布置，典型为<strong>2行玉米配 2–4 行大豆</strong>，技术口诀是「<strong>扩间增光、缩株保密</strong>」——把两作物间距拉开让大豆见光，同时把株距缩小保住株数。</li></ul><ul><li><strong>为什么重要</strong>：目标是<strong>玉米不减产、多收一季豆</strong>，是政策重点支持方向（连续列入中央一号文件），往往配套技术指导与项目支持。</li></ul><ul><li><strong>常见坑</strong>：除草是死穴——玉米用的除草剂和大豆用的互相杀伤，<strong>必须分带定向喷药、加隔离罩</strong>。新手首年不宜上。</li></ul><h3 id=\"sec-17\">48｜粮豆轮作</h3><ul><li><strong>大白话</strong>：这季种豆、下季种粮（水稻、玉米），转着种。</li></ul><ul><li><strong>为什么重要</strong>：大豆靠根瘤菌自己固氮，收完还能给后茬留下氮和有机质；轮作还能<strong>打断病虫和杂草的生命周期</strong>。这是大豆在种植系统里的真正价值。</li></ul><ul><li><strong>常见坑</strong>：只算大豆单季利润，把它对后茬的增产效应当成免费送给出租方（租地谈判时应作为筹码）。</li></ul><h3 id=\"sec-18\">49｜连作障碍</h3><ul><li><strong>大白话</strong>：同一块地连年只种大豆，产量逐年下降、病害越来越重。</li></ul><ul><li><strong>为什么重要</strong>：原因主要是<strong>土传病菌（根腐类）累积、线虫增多、养分偏耗、根系分泌物自毒</strong>。它意味着<strong>你不能年年满田种大豆</strong>，地块规划必须给轮作留余地。</li></ul><ul><li><strong>常见坑</strong>：第一年赚钱就固定在一块地连种三年，第三年根腐病爆发。</li></ul><h3 id=\"sec-19\">50｜前茬残留（除草剂残留药害）</h3><ul><li><strong>大白话</strong>：上一季别人（或你自己）打的除草剂还没在土里降解完，大豆种下去被毒。</li></ul><ul><li><strong>为什么重要</strong>：玉米田常用的烟嘧磺隆等药对大豆<strong>极其敏感</strong>，残留期长。这是「接手别人租过的地」最常见的隐形雷。</li></ul><ul><li><strong>常见坑</strong>：租地时不问「这地前两季打过什么药」，合同里也不写。应当作为尽调项目写入合同。</li></ul><h3 id=\"sec-20\">51｜茬口衔接</h3><ul><li><strong>大白话</strong>：上一季什么时候腾地，下一季什么时候能播，中间留给整地的时间够不够。</li></ul><ul><li><strong>为什么重要</strong>：广西多季种植最稀缺的资源是<strong>时间</strong>。前茬收晚10天，大豆的花荚期就被挤进灾害期（参见第二讲卡 27、31）。</li></ul><ul><li><strong>常见坑</strong>：安排年度计划时只算每季生长期，没算整地、晒籽、烘干和天气缓冲时间。</li></ul><h2 id=\"sec-21\">本讲结论（记这四句）</h2><ol><li><strong>先测土，再签地。</strong>pH、交换性铝、有效磷三个数值决定这块地该不该租。</li></ol><ol><li>酸性红壤的两大障碍是铝毒与缺磷；对策是调酸（按检测算量）+ 集中施磷，不是加氮。</li></ol><ol><li>广西第一笔基建钱应该花在<strong>起垄 + 围沟 + 出口沟</strong>，不是灌溉设备。</li></ol><ol><li>首年选<strong>净作</strong>，带状复合种植等技术成熟后再上；租地前必问前茬用药史。</li></ol><h2 id=\"sec-22\">待核实（本讲相关）</h2><div class=\"todo\"><span class=\"tick\">☐</span> 广西当地石灰调酸的推荐用量区间（需按土壤检测与当地农技部门配施方案确定）</div><div class=\"todo\"><span class=\"tick\">☐</span> 广西大豆现行种植模式的每亩作业成本差（净作 vs 带状复合）</div><div class=\"todo\"><span class=\"tick\">☐</span> 带状复合种植在广西的当年项目支持与技术模式图（需查自治区农业农村厅当年文件）</div><h2 id=\"sec-23\">参考来源</h2><ul><li>《土壤学报》：<a href=\"http://pedologica.issas.ac.cn/html/trxb/2023/5/trxb202307250290.htm\" target=\"_blank\" rel=\"noopener\">中国酸性土壤利用的科学问题与策略（铝毒与缺磷、大豆临界pH）</a></li></ul><ul><li><a href=\"http://www.d1ae.com/cn/article/pdf/preview/10.19998/j.cnki.2095-1795.2024.07.002.pdf\" target=\"_blank\" rel=\"noopener\">大豆玉米带状复合种植技术与装备研究进展（2行玉米配2–4行大豆、扩间增光缩株保密）</a></li></ul><ul><li>《中国油料作物学报》：<a href=\"http://www.jouroilcrops.cn/EN/article/downloadArticleFile.do?attachType=PDF&amp;id=505\" target=\"_blank\" rel=\"noopener\">酸性土壤中大豆优势根瘤菌的分离、鉴定及其生物学特性</a></li></ul><h2 id=\"sec-24\">修订记录</h2><div class=\"tbl-wrap\"><table><tr><td>版本</td><td>日期</td><td>修订内容</td></tr><tr><td>v1.0</td><td>2026-10-04</td><td>建立第三讲：土壤与耕地（11张卡）+ 种植模式与茬口（7张卡）</td></tr><tr><td>v1.1</td><td>2026-10-04</td><td>校正用字与术语（碳铵、磷锁死、撒施、缺锌等）</td></tr><tr><td>v1.2</td><td>2026-10-04</td><td>再校：陡坡、撒石灰、钝化、药害、出租方</td></tr><tr><td>v1.3</td><td>2026-10-04</td><td>校正「秸秆还田」用字</td></tr></table></div>"}, {"no": "06", "id": "1711214a-f143-4437-93bc-dc1264bb5f34", "head": "第四讲", "sub": "播种养分与水分管理", "tag": "第四讲", "num": "4", "secs": 24, "cards": 18, "mins": 3, "cardinfo": "· 18 张名词卡", "html": "<div class=\"callout\"><span class=\"co-icon\">💧</span><div>教材第四讲｜对应大纲第六部分（播种与养分）与第七部分（水分管理）<ul><li>卡片格式：<strong>名词 → 大白话 → 为什么重要 → 新手最常踩的坑</strong>（卡编号接第三讲，从52开始）</li></ul><ul><li>版本：v1.0｜写作日期：2026-10-04｜对话轮次：0006</li></ul><ul><li>上游大纲：<a href=\"https://app.notion.com/p/2154c1eab76a4e9aa8111f0bd9db7e6d\" target=\"_blank\" rel=\"noopener\">广西大豆种植投资基础常识 · 全流程大纲（0001）</a>｜上一讲：<a href=\"https://app.notion.com/p/8a598a91aeb84083b7f2b88ec273bff7\" target=\"_blank\" rel=\"noopener\">大豆教材·第三讲｜土壤耕地与种植模式（名词卡）</a></li></ul><ul><li>本讲定位：这两部分是<strong>每亩可变成本的主体</strong>，也是最容易「花了钱但花错地方」的环节。</li></ul></div></div><h2 id=\"sec-1\">第六部分：播种与养分</h2><h3 id=\"sec-2\">52｜根瘤菌共生固氮</h3><ul><li><strong>大白话</strong>：一种土壤细菌钻进大豆根里，长成一颗颗小瘤子，把空气里的氮气转成作物能用的氮，大豆回赠给它糖。</li></ul><ul><li><strong>为什么重要</strong>：这是大豆与玉米、水稻最根本的区别——<strong>它的氮主要靠菌，不靠肥</strong>。所有施肥思路都建在这一条上。</li></ul><ul><li><strong>常见坑</strong>：按玉米的思路大量施氮，结果根瘤干脆不长（作物“有现成氮就不养菌”），花钱买了倒伏。</li></ul><h3 id=\"sec-3\">53｜根瘤菌接种剂（拌种剂、耐酸菌株）</h3><ul><li><strong>大白话</strong>：把活的根瘤菌拌在种子上再播，相当于给大豆自带「工人」。</li></ul><ul><li><strong>为什么重要</strong>：没种过大豆的地往往土里根本没对应菌。更关键的是，酸性土壤要用<strong>耐酸的本地菌株（慢生根瘤菌 Bradyrhizobium）</strong>，北方菌剂在广西红壤上可能活不下来。</li></ul><ul><li><strong>常见坑</strong>：菌剂和杀菌剂同时拌种——杀菌剂把根瘤菌也杀了；或拌完暴晒、隔夜才播。</li></ul><h3 id=\"sec-4\">54｜氮启动量（起身肥）</h3><ul><li><strong>大白话</strong>：苗小时根瘤还没开始干活，先给一点点氮肥托一把。注意是「一点点」。</li></ul><ul><li><strong>为什么重要</strong>：<strong>氮多会抑制固氮</strong>（氮抑制效应）。启动量是补上「苗期到结瘤前」的空档期，不是全季供氮。</li></ul><ul><li><strong>常见坑</strong>：把起身肥当主肥用；或苗黄就追尿素（往往真正原因是积水、铝毒、缺钼）。</li></ul><h3 id=\"sec-5\">55｜磷肥与钾肥</h3><ul><li><strong>大白话</strong>：磷管生根、结瘤、结荚；钾管植株强健、抗倒抗病、粒重。</li></ul><ul><li><strong>为什么重要</strong>：大豆是<strong>「少氮、重磷、补钾」</strong>的作物；在酸性红壤上，磷还要加量并集中施（因为被锁死一部分，见第三讲卡37）。</li></ul><ul><li><strong>常见坑</strong>：用现成「大豆专用复合肥」不看配比，氮偏高、磷偏低。</li></ul><h3 id=\"sec-6\">56｜钼、硼等微量元素</h3><ul><li><strong>大白话</strong>：用量极小但不可缺的元素。钼是固氮酶的必需零件；硼影响开花授粉与保荚。</li></ul><ul><li><strong>为什么重要</strong>：<strong>酸性土壤天然缺钼</strong>（钼在酸条件下有效性低），这是广西种大豆的高频隐性问题；钼缺了，根瘤就算长了也固不好氮。</li></ul><ul><li><strong>常见坑</strong>：满脑子氮磷钾，完全没算钼硼；或过量用硼（硼的安全范围窄，易中毒）。</li></ul><h3 id=\"sec-7\">57｜种子包衣与种子处理</h3><ul><li><strong>大白话</strong>：播前给种子裹上药膜（杀菌剂 + 杀虫剂 + 营养），防苗期病虫。</li></ul><ul><li><strong>为什么重要</strong>：大豆苗期最怕根腐、地下害虫、烂种；包衣是最便宜的预防。但<strong>必须检查与根瘤菌剂的兼容性</strong>（卡 53）。</li></ul><ul><li><strong>常见坑</strong>：买来就拌，不看标签里的兼容说明和安全间隔。</li></ul><h3 id=\"sec-8\">58｜播深与土壤水分</h3><ul><li><strong>大白话</strong>：种子播多深；土壤水分指土里的水分状态（潮了、适中、干了）。</li></ul><ul><li><strong>为什么重要</strong>：大豆的芽是<strong>顶土出苗</strong>（子叶要从土里顶出来），所以太深或土板结就出不来；太浅又缺水。这是大豆比玉米更娇气的关键点之一。</li></ul><ul><li><strong>常见坑</strong>：按玉米深度播豆；或大雨前后播，土表结壳把苗顶死在里面。</li></ul><h3 id=\"sec-9\">59｜播种密度（行距、株距、每亩株数）</h3><ul><li><strong>大白话</strong>：每亩种多少株，行与行、株与株隔多远。</li></ul><ul><li><strong>为什么重要</strong>：大豆产量是<strong>株数 × 单株荚数 × 百粒重</strong>。密度是你能完全控制的变量；南方多雨容易旺长，密度过高就倒伏、病多。</li></ul><ul><li><strong>常见坑</strong>：「多种点保保险」加大用种量，最后既倒伏又烂荚。应按百粒重和目标株数反算用种量。</li></ul><h3 id=\"sec-10\">60｜保苗率（出苗率）</h3><ul><li><strong>大白话</strong>：播下去的种子，最后活下来多少比例。</li></ul><ul><li><strong>为什么重要</strong>：它把「发芽率 × 播种质量 × 天气 × 土壤」四个因素合成一个数。<strong>出苗后七天就要数株定株</strong>，这是全季第一个可测量的经营指标。</li></ul><ul><li><strong>常见坑</strong>：不数株，到收割才发现缺株严重，错过补播窗口。</li></ul><h3 id=\"sec-11\">61｜种肥隔离（烧种）</h3><ul><li><strong>大白话</strong>：肥料和种子必须错开位置，不能挤在一起。</li></ul><ul><li><strong>为什么重要</strong>：肥料浓度高会把种子灼死（烧种），大豆种子对这个特别敏感。机播要做到<strong>种肥分层、侧位下肥</strong>。</li></ul><ul><li><strong>常见坑</strong>：图方便一次撒完，种肥同穴，缺株一大片还以为是种子问题。</li></ul><h3 id=\"sec-12\">62｜花荚期叶面补肥</h3><ul><li><strong>大白话</strong>：在开花结荚鼓粒期，把肥兑成水喷在叶子上。</li></ul><ul><li><strong>为什么重要</strong>：这个阶段根瘤开始衰老、根系吸收下降，而豆粒正在抢养分。叶面补（磷钾、硼、微量）是<strong>低成本保荚增重手段</strong>，可与打虫同步。</li></ul><ul><li><strong>常见坑</strong>：中午高温时喷（烧叶、蒸发快），或浓度随手配。应清晨或傍晚喷。</li></ul><h2 id=\"sec-13\">第七部分：水分管理</h2><h3 id=\"sec-14\">63｜田间持水量与土壤水分判断</h3><ul><li><strong>大白话</strong>：土壤能扣住的水的上限。超过它，多出的水就往下流或积在地表。</li></ul><ul><li><strong>为什么重要</strong>：它解释为什么黏重的红壤一下大雨就湿透、久不发干——<strong>不是雨多，是水出不去</strong>。实操上只需学会用手抓土判断水分：成团不粘手为适。</li></ul><ul><li><strong>常见坑</strong>：按日历安排灌水，不看土。</li></ul><h3 id=\"sec-15\">64｜湿涝害与耐湿窗口</h3><ul><li><strong>大白话</strong>：土里水多、气少，根缺氧——不一定要泡在水里，<strong>持续潮透就已经是涝害</strong>。</li></ul><ul><li><strong>为什么重要</strong>：根瘤菌是好氧的，缺氧首先停的就是固氮；花荚期遇涝直接落花落荚。广西大豆的<strong>第一位风险</strong>就是这一条。</li></ul><ul><li><strong>常见坑</strong>：只防「看得见的积水」，不防「看不见的长期潮透」。雨停后要继续排。</li></ul><h3 id=\"sec-16\">65｜需水关键期（R1–R5）</h3><ul><li><strong>大白话</strong>：从开花到鼓粒这段时间，大豆一生中最缺不得水的阶段。</li></ul><ul><li><strong>为什么重要</strong>：这一段缺水，落花落荚、粒小，损失不可逆；而广西秋豆正好撞秋旱（第二讲卡32）。<strong>灌溉能力只需为这一段准备</strong>。</li></ul><ul><li><strong>常见坑</strong>：苗期浇得勤（易徒长、浅根），鼓粒期没水可浇。</li></ul><h3 id=\"sec-17\">66｜灌溉保障率与水源</h3><ul><li><strong>大白话</strong>：需要浇水的时候，有多大概率真能浇到：水从哪里来、泵和管够不够、用水要不要排队。</li></ul><ul><li><strong>为什么重要</strong>：尽调时必须问清水源类型（水库、河道、机井）、距离、是否有用水配额与水费。<strong>没水源的秋豆等于赌天</strong>。</li></ul><ul><li><strong>常见坑</strong>：听出租方说「旁边有河」就算有水，不查扬程高差、取水权和枯季流量。</li></ul><h3 id=\"sec-18\">67｜灌溉方式（沟灌、喷灌、滴灌）</h3><ul><li><strong>大白话</strong>：沟灌 = 放水进垄沟渗；喷灌 = 打水枪；滴灌 = 铺带滴到根部。</li></ul><ul><li><strong>为什么重要</strong>：大豆每亩产值有限，<strong>灌溉投入必须轻资产</strong>。广西典型选择是垄作 + 沟灌（与排水沟共用一套工程），滴灌一般算不过账。</li></ul><ul><li><strong>常见坑</strong>：第一年就上滴灌水肥一体化，固定成本把利润吃光。</li></ul><h3 id=\"sec-19\">68｜水肥一体化</h3><ul><li><strong>大白话</strong>：把肥溶在水里，随灌溉系统一起送到根区。</li></ul><ul><li><strong>为什么重要</strong>：理论上省工省肥、精准调控；对大豆而言意义不如经济作物大（氮靠菌），属于<strong>规模稳定、水价与产值支撑后再考虑的升级项</strong>。</li></ul><ul><li><strong>常见坑</strong>：把它当成标配，写进第一年的投资清单。</li></ul><h3 id=\"sec-20\">69｜高温逼熟与干热风</h3><ul><li><strong>大白话</strong>：鼓粒期遇持续高温干热，豆粒被「赶」着提前停长。</li></ul><ul><li><strong>为什么重要</strong>：广西夏豆的典型损失形式：粒重降、空荚多。它和秋豆的寒露风是「两头夹击」，回到播期倒排这个总解法。</li></ul><ul><li><strong>常见坑</strong>：只关心雨，不关心温；夏豆播期把鼓粒期排进最热的那半个月。</li></ul><h2 id=\"sec-21\">本讲结论（记这四句）</h2><ol><li><strong>大豆的氮靠菌、不靠肥。</strong>肥的钱应该花在磷、钾、钼硼和耐酸根瘤菌剂上，氮只给启动量。</li></ol><ol><li>苗黄长不大，先查积水、pH与铝毒、缺钼，最后才考虑追氮。</li></ol><ol><li>出苗后七天必须数株算保苗率，这是全季第一个经营仪表。</li></ol><ol><li>广西的水分逻辑是<strong>先排涝、再留底水</strong>：垄作与沟系优先，水源只为 R1–R5 准备，滴灌暂不考虑。</li></ol><h2 id=\"sec-22\">待核实（本讲相关）</h2><div class=\"todo\"><span class=\"tick\">☐</span> 广西酸性红壤适用的根瘤菌剂商品源与菌株编号（需咨询广西农科院或菌剂生产单位）</div><div class=\"todo\"><span class=\"tick\">☐</span> 广西大豆每亩推荐氮磷钾用量与钼硼用量（需按测土配施方案，不宜套用外省数值）</div><div class=\"todo\"><span class=\"tick\">☐</span> 广西各季大豆推荐每亩株数与行株距（品种与季别不同，需查当地技术指南）</div><div class=\"todo\"><span class=\"tick\">☐</span> 大豆耐湿极限时长的权威试验值（承接第二讲待核实项）</div><h2 id=\"sec-23\">参考来源</h2><ul><li>《中国油料作物学报》：<a href=\"http://www.jouroilcrops.cn/EN/article/downloadArticleFile.do?attachType=PDF&amp;id=505\" target=\"_blank\" rel=\"noopener\">酸性土壤中大豆优势根瘤菌的分离、鉴定及其生物学特性（耐酸本地菌株）</a></li></ul><ul><li>《土壤学报》：<a href=\"http://pedologica.issas.ac.cn/html/trxb/2023/5/trxb202307250290.htm\" target=\"_blank\" rel=\"noopener\">中国酸性土壤利用的科学问题与策略（缺磷与铝毒）</a></li></ul><h2 id=\"sec-24\">修订记录</h2><div class=\"tbl-wrap\"><table><tr><td>版本</td><td>日期</td><td>修订内容</td></tr><tr><td>v1.0</td><td>2026-10-04</td><td>建立第四讲：播种与养分（11张卡）+ 水分管理（7张卡）</td></tr><tr><td>v1.1</td><td>2026-10-04</td><td>校正用字：灼死、撒施、扬程、枯季流量</td></tr><tr><td>v1.2</td><td>2026-10-04</td><td>再校：土壤水分、湿涝害、植株强健等用字</td></tr></table></div>"}, {"no": "07", "id": "8b51c47d-accc-40cb-b1a2-d86de3c7d94a", "head": "第五讲", "sub": "草害与病虫鼠鸟", "tag": "第五讲", "num": "5", "secs": 33, "cards": 27, "mins": 5, "cardinfo": "· 27 张名词卡", "html": "<div class=\"callout\"><span class=\"co-icon\">🐛</span><div>教材第五讲｜对应大纲第八部分（草害）与第九部分（病虫鼠鸟）<ul><li>卡片格式：<strong>名词 → 大白话 → 为什么重要 → 新手最常踩的坑</strong>（卡编号接第四讲，从70开始）</li></ul><ul><li>版本：v1.0｜写作日期：2026-10-04｜对话轮次：0007</li></ul><ul><li>上游大纲：<a href=\"https://app.notion.com/p/2154c1eab76a4e9aa8111f0bd9db7e6d\" target=\"_blank\" rel=\"noopener\">广西大豆种植投资基础常识 · 全流程大纲（0001）</a>｜上一讲：<a href=\"https://app.notion.com/p/1711214af143443793bcdc1264bb5f34\" target=\"_blank\" rel=\"noopener\">大豆教材·第四讲｜播种养分与水分管理（名词卡）</a></li></ul><ul><li>本讲定位：这是<strong>全季唯一一个「一次失手就可能颗粒无收」的环节</strong>。第四讲的钱花错了是少赚，这一讲的时机错过了是归零。</li></ul></div></div><h2 id=\"sec-1\">第八部分：草害</h2><h3 id=\"sec-2\">70｜杂草竞争临界期</h3><ul><li><strong>大白话</strong>：从出苗到封行前的那几周，杂草和大豆抢光、抢水、抢肥最凶的一段时间。</li></ul><ul><li><strong>为什么重要</strong>：这段时间控住了，后面长出的草基本不影响产量；这段时间失守，后面怎么补都回不来。<strong>除草是抢时间，不是抢干净</strong>。</li></ul><ul><li><strong>常见坑</strong>：等草长高了、看得明显了才打药——那时产量已经被抢走了。</li></ul><h3 id=\"sec-3\">71｜土壤封闭除草（播后苗前）</h3><ul><li><strong>大白话</strong>：播完种、草还没出土之前，在地表喷一层药，形成药膜，草一冒头就被挡住。</li></ul><ul><li><strong>为什么重要</strong>：这是<strong>成本最低、风险最小、效果最稳</strong>的一步，也是整个除草方案的主力。广西雨多草长得快，封闭做得好不好基本决定全季除草难度。</li></ul><ul><li><strong>常见坑</strong>：地整得坑洼不平，药膜不连续；或喷完一场大雨冲掉却不知道要补。</li></ul><h3 id=\"sec-4\">72｜苗后茎叶处理</h3><ul><li><strong>大白话</strong>：苗出来以后，直接把药喷在草的叶子上。</li></ul><ul><li><strong>为什么重要</strong>：它是封闭的<strong>补救手段</strong>，不是替代方案。苗后药对大豆本身也有压力（蹲苗、叶片发黄），用多了伤作物。</li></ul><ul><li><strong>常见坑</strong>：把苗后当主力，省掉封闭；或草龄过大（超过三五叶）才打，药量加倍也杀不死。</li></ul><h3 id=\"sec-5\">73｜禾本科杂草与阔叶杂草</h3><ul><li><strong>大白话</strong>：草分两大类——像稻叶一样细长的（禾本科，如马唐、牛筋草），和叶子宽的（阔叶，如苋、藜、鳢肠）。</li></ul><ul><li><strong>为什么重要</strong>：<strong>两类草用的药完全不同</strong>。大豆本身是阔叶作物，所以杀阔叶草的药对大豆的安全窗口很窄，这是大豆除草比玉米难的根本原因。</li></ul><ul><li><strong>常见坑</strong>：不先认草就买药；或拿玉米田的除草剂用到大豆田（见卡75）。</li></ul><h3 id=\"sec-6\">74｜抗性杂草</h3><ul><li><strong>大白话</strong>：同一种药年年用，草被「练」出了抗性，再打也不死。</li></ul><ul><li><strong>为什么重要</strong>：抗性一旦形成不可逆，会直接抬高你和后续承租人的成本。广西连作区的牛筋草、马唐抗性已较普遍。</li></ul><ul><li><strong>常见坑</strong>：药没效就加量——加量只会加速抗性，正确做法是换作用机理（卡95）。</li></ul><h3 id=\"sec-7\">75｜除草剂残效期与下茬安全</h3><ul><li><strong>大白话</strong>：有些除草剂打完会在土里留很久，下一季种别的作物会被残留的药伤到。</li></ul><ul><li><strong>为什么重要</strong>：前茬如果用过某些玉米田或甘蔗田除草剂（如部分磺酰脲类），你的大豆种下去会僵苗、黄化甚至死苗。<strong>这是租地尽调必问项</strong>（承第三讲卡50）。</li></ul><ul><li><strong>常见坑</strong>：只问「这地种过什么」，不问「打过什么药、什么时候打的」。</li></ul><h3 id=\"sec-8\">76｜药害识别与补救</h3><ul><li><strong>大白话</strong>：作物被药伤了会有特征性表现——叶片畸形、发黄、心叶皱缩、生长点停滞。</li></ul><ul><li><strong>为什么重要</strong>：药害和缺素、病害、涝害的症状很像，<strong>判断错了补救方向就全错</strong>。药害的典型特征是沿喷幅呈条带状、边界清楚。</li></ul><ul><li><strong>常见坑</strong>：把药害当缺肥，猛追肥料加重伤害。药害补救方向是促根、解毒、灌水稀释。</li></ul><h3 id=\"sec-9\">77｜农药登记证与「在大豆上登记」</h3><ul><li><strong>大白话</strong>：每瓶农药都有登记证号，上面写明允许用在哪种作物、防哪种对象。</li></ul><ul><li><strong>为什么重要</strong>：<strong>只有在大豆上登记的药才能合法使用</strong>。超范围用药一旦出农残问题，保险不赔、收购方退货、还可能被处罚。这是能否卖进好渠道的底线。</li></ul><ul><li><strong>常见坑</strong>：听农资店口头推荐就买，不看标签上的登记作物。</li></ul><h3 id=\"sec-10\">78｜安全间隔期与最大残留限量</h3><ul><li><strong>大白话</strong>：安全间隔期 = 最后一次打药到收获之间必须等的天数；最大残留限量 = 国家规定豆粒里某种药最多允许剩多少。</li></ul><ul><li><strong>为什么重要</strong>：食用大豆（做豆腐、豆浆）的农残要求比饲料豆严得多，<strong>这直接决定你的豆子能进哪个价格带</strong>。标准依据是食品安全国家标准农药最大残留限量（GB 2763）。</li></ul><ul><li><strong>常见坑</strong>：鼓粒后期发现虫害又打一遍药，结果踩了间隔期，整批豆子只能低价处理。</li></ul><h3 id=\"sec-11\">79｜带状复合种植的除草难题</h3><ul><li><strong>大白话</strong>：玉米和大豆挨着种，两种作物能用的除草剂互相有毒，药不能乱飘。</li></ul><ul><li><strong>为什么重要</strong>：这是带状复合种植<strong>最大的落地障碍</strong>（承第三讲卡46）。解决办法是定向喷头 + 物理隔帘分带施药，人工成本和技术要求都明显上升。</li></ul><ul><li><strong>常见坑</strong>：算账时只算了「一地两收」的收益，没算这套分带施药的额外用工和飘移风险。</li></ul><h3 id=\"sec-12\">80｜中耕与人工除草</h3><ul><li><strong>大白话</strong>：用机械或人工把行间的草铲掉、顺便松土。</li></ul><ul><li><strong>为什么重要</strong>：是化学除草失败后的兜底，也能打破板结、促进排水。但在广西<strong>人工单价决定它能不能用</strong>——面积一大就不现实。</li></ul><ul><li><strong>常见坑</strong>：预算里不给除草留人工应急费，一旦封闭失败只能眼看着草长。</li></ul><h3 id=\"sec-13\">81｜封闭失败的常见原因</h3><ul><li><strong>大白话</strong>：封闭药打了却没效果，通常是四个原因之一。</li></ul><ul><li><strong>为什么重要</strong>：土太干（药膜成不了）、整地有坷垃（药膜不连续）、有机质高吸附药（需调整用量）、喷后暴雨冲刷。<strong>认清原因才知道要不要补打</strong>。</li></ul><ul><li><strong>常见坑</strong>：失败后直接换个牌子再打一遍，原因没解决，钱打了两次水漂。</li></ul><h2 id=\"sec-14\">第九部分：病虫鼠鸟</h2><h3 id=\"sec-15\">82｜症青（青秆不熟、只开花不结粒）</h3><ul><li><strong>大白话</strong>：该成熟的时候，植株还是绿油油的，荚瘪、粒少甚至没粒，但秆和叶长得很好看。</li></ul><ul><li><strong>为什么重要</strong>：<strong>这是近年黄淮海与南方大豆最严重、最容易血本无归的单点风险</strong>。主流认定的主因是<strong>点蜂缘蝽等刺吸式害虫在结荚期吸食</strong>，导致荚不鼓粒而植株不衰老。它的可怕之处在于：发生时田里看着很好，等你发现时已经无法挽回。</li></ul><ul><li><strong>常见坑</strong>：看田绿油油就放心，不做初荚期虫情调查；或等到发现瘪荚才打药——那时打已经没用。</li></ul><h3 id=\"sec-16\">83｜点蜂缘蝽</h3><ul><li><strong>大白话</strong>：一种细长、像蚂蚁又像蜂的虫子，用针状口器扎进豆荚吸汁。</li></ul><ul><li><strong>为什么重要</strong>：它是症青的<strong>首要元凶</strong>。防治关键期是<strong>初荚期（结荚刚开始）</strong>，不是鼓粒后。农业部门给出的参考防治指标是：初荚期百株虫量 3–5 头，或诱捕器单日诱到 5 头即应用药；常用药剂如噻虫嗪·高效氯氟氰菊酯等复配剂。</li></ul><ul><li><strong>常见坑</strong>：按「看到虫才打」的思路管理。它成虫活跃、善飞，白天高温躲藏，<strong>早晚查虫才查得到</strong>。</li></ul><h3 id=\"sec-17\">84｜斜纹夜蛾</h3><ul><li><strong>大白话</strong>：一种夜里活动的蛾子幼虫，成群啃叶，严重时把叶子吃成网状、光杆。</li></ul><ul><li><strong>为什么重要</strong>：广西高温高湿条件下世代多、繁殖快，暴发性强。<strong>低龄幼虫期（三龄前）打才有效</strong>，大龄虫抗药性强、钻进心叶打不着。</li></ul><ul><li><strong>常见坑</strong>：白天打药（虫躲在土缝叶背），应傍晚施药；或等到叶片明显被吃光才动手。</li></ul><h3 id=\"sec-18\">85｜豆荚螟</h3><ul><li><strong>大白话</strong>：幼虫钻进豆荚里吃豆粒，从外面看荚是好的，掰开全是虫屎和残粒。</li></ul><ul><li><strong>为什么重要</strong>：它直接吃掉<strong>商品粒</strong>，不只是减产，还降等级（虫蚀粒超标会被扣价）。防治窗口在<strong>卵孵化盛期到幼虫蛀荚前</strong>，一旦钻进荚里，打药基本无效。</li></ul><ul><li><strong>常见坑</strong>：按「有虫才打」管理，错过蛀荚前的唯一窗口。</li></ul><h3 id=\"sec-19\">86｜蚜虫与蓟马（传毒介体）</h3><ul><li><strong>大白话</strong>：很小的吸汁虫子，本身危害不算最大，但它们会把病毒从病株带到健株。</li></ul><ul><li><strong>为什么重要</strong>：<strong>控蚜就是控病毒</strong>（见卡87）。苗期蚜虫密度高时，病毒病发生率会明显上升。</li></ul><ul><li><strong>常见坑</strong>：觉得「蚜虫不致命」而不管，结果病毒病全田扩散，无药可治。</li></ul><h3 id=\"sec-20\">87｜大豆花叶病毒（SMV）与褐斑粒</h3><ul><li><strong>大白话</strong>：一种病毒病，叶片出现花叶、皱缩、植株矮化；更关键的是<strong>豆粒上出现褐色斑纹</strong>。</li></ul><ul><li><strong>为什么重要</strong>：褐斑粒<strong>直接判定商品等级下降</strong>，食用豆渠道会拒收或大幅压价。病毒病无特效药，只能靠<strong>抗病品种 + 无病种子 + 控蚜</strong>三道防线。</li></ul><ul><li><strong>常见坑</strong>：留种时用了带病毒的豆子（种子可带毒传播），第二年一开始就全田发病。</li></ul><h3 id=\"sec-21\">88｜根腐病</h3><ul><li><strong>大白话</strong>：根和近地面的茎变褐腐烂，地上部黄弱、矮小，严重时整株死。</li></ul><ul><li><strong>为什么重要</strong>：这是<strong>积水、酸性、连作三者叠加的直接后果</strong>（承第三讲卡38、卡49），广西条件下属高风险病害。它的解法主要在耕作，不在喷药——<strong>起垄排水 + 轮作 + 种子包衣</strong>。</li></ul><ul><li><strong>常见坑</strong>：发病后猛灌药水，而地里的积水一直没排掉。</li></ul><h3 id=\"sec-22\">89｜大豆锈病</h3><ul><li><strong>大白话</strong>：叶背长出锈色小疱，破裂后散出锈粉，叶子早衰脱落。</li></ul><ul><li><strong>为什么重要</strong>：<strong>高温高湿的南方是锈病的适生区</strong>，广西属于我国大豆锈病发生的重点区域之一。它流行快、减产重，而且<strong>必须在发病初期预防性施药</strong>，等满田锈粉就晚了。</li></ul><ul><li><strong>常见坑</strong>：按北方大豆的经验布置植保方案，完全没把锈病列入常规防控。</li></ul><h3 id=\"sec-23\">90｜荚粒病害（紫斑病、炭疽病、霜霉病）</h3><ul><li><strong>大白话</strong>：一类在结荚后期侵染荚和粒的病，表现为粒上有紫斑、黑斑、霉层。</li></ul><ul><li><strong>为什么重要</strong>：它们<strong>不太减产但严重降等级</strong>——而大豆是按商品等级定价的（见第二讲卡22）。成熟期遇连阴雨时最易暴发。</li></ul><ul><li><strong>常见坑</strong>：只盯着产量不盯外观，收上来才发现卖不出好价。</li></ul><h3 id=\"sec-24\">91｜大豆胞囊线虫与根结线虫</h3><ul><li><strong>大白话</strong>：土里的微小蠕虫，钻进根里取食，根上形成小颗粒或瘤状物，植株黄矮。</li></ul><ul><li><strong>为什么重要</strong>：它是<strong>连作障碍的主要生物成因之一</strong>（承第三讲卡49），一旦建立种群很难清除，只能靠轮作和抗线品种长期压制。</li></ul><ul><li><strong>常见坑</strong>：把线虫造成的黄矮当成缺肥，年年追肥年年不好。诊断方法是拔根看根部。</li></ul><h3 id=\"sec-25\">92｜鼠害与鸟害</h3><ul><li><strong>大白话</strong>：老鼠咬荚、刨种；鸟（鸠鸽雀类）在播后啄食种子、成熟期啄食豆粒。</li></ul><ul><li><strong>为什么重要</strong>：这两项在<strong>小面积、靠山林、靠村庄的地块</strong>损失可能相当可观，而且常被完全忽略在预算之外。播后出苗前和成熟待收期是两个高发窗口。</li></ul><ul><li><strong>常见坑</strong>：第一年试种选了靠林地的小块地，鸟鼠损失比病虫还大。</li></ul><h3 id=\"sec-26\">93｜经济阈值（防治指标）与田间踏查</h3><ul><li><strong>大白话</strong>：虫子多到什么程度才值得打药——打药的钱必须小于不打药的损失。踏查 = 定期按五点取样法下田数虫、看病。</li></ul><ul><li><strong>为什么重要</strong>：<strong>这是把植保从「凭感觉」变成「凭数据」的关键机制</strong>。没有阈值就只有两种错误：该打不打（症青），和不该打乱打（成本和农残双升）。</li></ul><ul><li><strong>常见坑</strong>：全程不下田数虫，把管理交给农资店和工人的经验。</li></ul><h3 id=\"sec-27\">94｜统防统治与无人机飞防</h3><ul><li><strong>大白话</strong>：由专业服务队统一时间、统一药剂、统一施药，通常用无人机作业。</li></ul><ul><li><strong>为什么重要</strong>：对外来投资者而言<strong>这是最现实的植保执行方式</strong>——解决了请不到人、打药不及时、不会配药三个问题。但要注意无人机低容量喷雾的<strong>雾滴穿透性</strong>，对躲在中下部的虫（点蜂缘蝽、豆荚螟）效果可能打折。</li></ul><ul><li><strong>常见坑</strong>：全部交给飞防不做验收，不检查中下部着药情况。</li></ul><h3 id=\"sec-28\">95｜抗药性与轮换用药</h3><ul><li><strong>大白话</strong>：同一类药反复用，虫和菌会产生抗性。轮换指按<strong>作用机理分组</strong>交替使用，而不是换个商品名。</li></ul><ul><li><strong>为什么重要</strong>：很多不同牌子的药其实是同一个有效成分或同一作用机理，<strong>换名不换药等于没轮换</strong>。</li></ul><ul><li><strong>常见坑</strong>：只看商品名，不看标签上的有效成分和作用机理分类。</li></ul><h3 id=\"sec-29\">96｜植保日历（关键防治节点表）</h3><ul><li><strong>大白话</strong>：把全季必须动手的时间点提前排成一张表，到点就做，不等症状出现。</li></ul><ul><li><strong>为什么重要</strong>：大豆的致命风险<strong>几乎全部是「窗口期型」</strong>——封闭在播后苗前、点蜂缘蝽在初荚期、豆荚螟在蛀荚前、锈病在发病初期。<strong>错过窗口，药再好也没用</strong>。一张节点表比任何单项技术都值钱。</li></ul><ul><li><strong>常见坑</strong>：按「有问题再处理」的思路管理农业，这是工业思维在农业上最大的失效点。</li></ul><h2 id=\"sec-30\">本讲结论（记这四句）</h2><ol><li><strong>广西大豆最可能让你血本无归的单点风险是症青</strong>，而它的防线在初荚期的点蜂缘蝽——不是鼓粒期，不是看到症状的时候。</li></ol><ol><li><strong>除草的胜负在封闭</strong>。封闭做好，全季轻松；封闭失败，后面全是补救和加成本。</li></ol><ol><li><strong>用药合法性决定售价带</strong>：登记作物、安全间隔期、残留限量，三条守不住，豆子就进不了食用豆的好渠道。</li></ol><ol><li><strong>把植保从「看症状」改成「看日历 + 看阈值」</strong>。这一讲所有内容压缩成一句话就是：按窗口期办事。</li></ol><h2 id=\"sec-31\">待核实（本讲相关）</h2><div class=\"todo\"><span class=\"tick\">☐</span> 广西当年在大豆上登记的主流除草剂、杀虫剂、杀菌剂清单与推荐剂量（需查中国农药信息网登记数据库）</div><div class=\"todo\"><span class=\"tick\">☐</span> GB 2763 中大豆相关农药的具体最大残留限量数值（需核原文）</div><div class=\"todo\"><span class=\"tick\">☐</span> 广西大豆锈病常年发生程度与预警发布渠道（需查广西植保部门年度预报）</div><div class=\"todo\"><span class=\"tick\">☐</span> 当地统防统治服务队的作业单价与服务范围（需实地询价）</div><div class=\"todo\"><span class=\"tick\">☐</span> 点蜂缘蝽在广西各季大豆的具体发生高峰期（需查当地测报数据）</div><div class=\"todo\"><span class=\"tick\">☐</span> 广西主栽品种的抗病性表现（锈病、SMV、根腐），承接第二讲待核实项</div><h2 id=\"sec-32\">参考来源</h2><ul><li>北京市农业农村局：<a href=\"https://nyncj.beijing.gov.cn/nyj/zwgk/ztgk/zwbhxx/436217233/index.html\" target=\"_blank\" rel=\"noopener\">大豆点蜂缘蝽防控技术要点（初荚期百株3–5头或诱捕器单日5头的用药指标）</a></li></ul><ul><li>宁波大学植物病毒学研究所：<a href=\"https://ipv.nbu.edu.cn/info/1020/5078.htm\" target=\"_blank\" rel=\"noopener\">点蜂缘蝽与大豆症青（始荚期为防治关键期）</a></li></ul><h2 id=\"sec-33\">修订记录</h2><div class=\"tbl-wrap\"><table><tr><td>版本</td><td>日期</td><td>修订内容</td></tr><tr><td>v1.0</td><td>2026-10-04</td><td>建立第五讲：草害（12张卡）+ 病虫鼠鸟（15张卡）</td></tr></table></div>"}, {"no": "08", "id": "2afd5aa7-04b6-4422-903a-214f879e61bf", "head": "第六讲", "sub": "收获产后与销售定价", "tag": "第六讲", "num": "6", "secs": 34, "cards": 28, "mins": 5, "cardinfo": "· 28 张名词卡", "html": "<div class=\"callout\"><span class=\"co-icon\">🚜</span><div>教材第六讲｜对应大纲第十部分（收获与产后处理）与第十一部分（销售与定价）<ul><li>卡片格式：<strong>名词 → 大白话 → 为什么重要 → 新手最常踩的坑</strong>（卡编号接第五讲，从97开始）</li></ul><ul><li>版本：v1.0｜写作日期：2026-10-04｜对话轮次：0008</li></ul><ul><li>上游大纲：<a href=\"https://app.notion.com/p/2154c1eab76a4e9aa8111f0bd9db7e6d\" target=\"_blank\" rel=\"noopener\">广西大豆种植投资基础常识 · 全流程大纲（0001）</a>｜上一讲：<a href=\"https://app.notion.com/p/8b51c47daccc40cbb1a2d86de3c7d94a\" target=\"_blank\" rel=\"noopener\">大豆教材·第五讲｜草害与病虫鼠鸟（名词卡）</a></li></ul><ul><li>本讲定位：前五讲都在花钱，<strong>这一讲是整个项目唯一收钱的环节</strong>。对你而言这是最熟悉的商业地带，但农产品的定价逻辑有它自己的规则。</li></ul></div></div><h2 id=\"sec-1\">第十部分：收获与产后处理</h2><h3 id=\"sec-2\">97｜成熟分期（鼓粒期、黄熟期、完熟期）</h3><ul><li><strong>大白话</strong>：鼓粒期 = 豆粒正在长胖；黄熟期 = 叶子脱落、荚变黄褐、粒子定型；完熟期 = 豆粒硬实、摇动有响。</li></ul><ul><li><strong>为什么重要</strong>：<strong>收早了粒不饱、水分高、破碎多；收晚了炸荚落粒</strong>。整个收获决策就是在这两个损失之间找那个几天的窗口。</li></ul><ul><li><strong>常见坑</strong>：按日历排收割机，不按田间成熟状态排。</li></ul><h3 id=\"sec-3\">98｜机收适期与籽粒含水率</h3><ul><li><strong>大白话</strong>：用豆粒里水分占多少比例来判断能不能上机。</li></ul><ul><li><strong>为什么重要</strong>：农业农村部给出的机收最佳期是<strong>黄熟期后至完熟期，籽粒含水率 15%–25%、茎秆含水率 45%–55%</strong>。这是本讲最硬的一个可执行数字指标——水分高于此区间破碎挤伤多，低于此区间炸荚落粒多。</li></ul><ul><li><strong>常见坑</strong>：凭手摸、凭牙咬判断水分。<strong>一台几百元的粮食水分测定仪是这个项目性价比最高的设备</strong>。</li></ul><h3 id=\"sec-4\">99｜炸荚（裂荚）</h3><ul><li><strong>大白话</strong>：豆荚过干时自己开裂，豆粒弹到地上。</li></ul><ul><li><strong>为什么重要</strong>：<strong>这是大豆特有的、玉米水稻都没有的损失形式</strong>。燥热天气、正午作业、成熟后拖延收割都会加重。品种的抗炸荚性在选种时就要问（承第二讲）。</li></ul><ul><li><strong>常见坑</strong>：中午最热的时候收割。正确做法是<strong>清晨或傍晚豆荚回潮时作业</strong>。</li></ul><h3 id=\"sec-5\">100｜机收损失率</h3><ul><li><strong>大白话</strong>：收割机没收走的那部分占总产量的比例，包括落粒、漏荚、割台挡落、脱粒不净。</li></ul><ul><li><strong>为什么重要</strong>：<strong>这是完全被外行忽略的一大块钱</strong>。大豆的机收损失普遍高于玉米小麦，而且损失掉的是毛利润——已经花完所有成本的那部分产量。</li></ul><ul><li><strong>常见坑</strong>：收完不做损失测定。应该在机后随机取几个平方米数落粒，当场调机速和割台。</li></ul><h3 id=\"sec-6\">101｜破碎粒与泥花脸</h3><ul><li><strong>大白话</strong>：破碎粒 = 被机器磕碎的豆；泥花脸 = 豆皮被污染成斑驳脸色。</li></ul><ul><li><strong>为什么重要</strong>：两者都<strong>不减产但直接降价</strong>。食用豆渠道（豆腐、豆浆）对外观极敏感，这是全季辛苦最容易在最后两天被扣掉的部分。</li></ul><ul><li><strong>常见坑</strong>：脱粒滚筒转速调得过高（追求脱净），换来一批破碎粒。</li></ul><h3 id=\"sec-7\">102｜底荚高度与割台高度</h3><ul><li><strong>大白话</strong>：底荚高度 = 最下面那个豆荚离地多高；割台高度 = 机器刀片贴地多低。</li></ul><ul><li><strong>为什么重要</strong>：<strong>底荚太低，机器就收不起来</strong>。这是一个在选种和种植密度阶段就被决定的指标（密度适当提高能抬高底荚），到收获时已经改不了。广西地块小、不平整会进一步放大这个问题。</li></ul><ul><li><strong>常见坑</strong>：选品种只看产量，不问底荚高度和是否适合机收。</li></ul><h3 id=\"sec-8\">103｜催枯（干燥剂处理）</h3><ul><li><strong>大白话</strong>：成熟前喷一遍药，让全田植株同步干燥落叶，方便机收。</li></ul><ul><li><strong>为什么重要</strong>：广西收获期常遇连阴雨、植株贪青不脱叶，催枯是收获窗口紧张时的<strong>应急手段</strong>。但它受<strong>登记作物和安全间隔期双重约束</strong>（承第五讲卡77、卡78）。</li></ul><ul><li><strong>常见坑</strong>：为赶机期随便用剂、提前喷，结果粒重下降或踩农残线。</li></ul><h3 id=\"sec-9\">104｜烘干与晒场</h3><ul><li><strong>大白话</strong>：把刚收的湿豆降到能存放的水分，要么机械烘干，要么摊在场上晒。</li></ul><ul><li><strong>为什么重要</strong>：<strong>这是广西项目的隐形命门</strong>。北方秋收天气干燥可以晒，广西收获期湿度大、雨水多，<strong>没有烘干能力就是赌收获那三天不下雨</strong>。尽调时必须找出周边烘干点的位置、产能、收费。</li></ul><ul><li><strong>常见坑</strong>：预算里根本没有烘干这一项成本；或默认「晒一晒就行」。豆子晒过头还会裂皮降等。</li></ul><h3 id=\"sec-10\">105｜安全储粮水分</h3><ul><li><strong>大白话</strong>：豆子存起来不生霉、不发热的水分上限。</li></ul><ul><li><strong>为什么重要</strong>：大豆含油含蛋白，<strong>比谷物更易发热霉变</strong>；一旦起热，整仓可能在几天内报废。这是你从「种出来」到「卖出去」之间最大的一次性风险。</li></ul><ul><li><strong>常见坑</strong>：抱着赌一把的心态存货等涨价，却没有测温、通风、水分监测的条件。</li></ul><h3 id=\"sec-11\">106｜仓储虫霉与通风</h3><ul><li><strong>大白话</strong>：存放期间长豆象等仓储害虫、长霉；靠通风降温降湿来控制。</li></ul><ul><li><strong>为什么重要</strong>：广西年均温湿高，<strong>存储条件比北方苛刻得多</strong>。虫蚀粒、霉变粒是国标里的扣分项（见卡112）。</li></ul><ul><li><strong>常见坑</strong>：用普通仓库或芒果棚存豆，没有防潮、防鼠、通风设计。</li></ul><h3 id=\"sec-12\">107｜清选与杂质率</h3><ul><li><strong>大白话</strong>：把土块、秆段、瘪粒、杂草种子筛掉。</li></ul><ul><li><strong>为什么重要</strong>：收购方是<strong>按杂质率扣重量扣价钱</strong>的。自己做一道清选的成本，通常远低于被扣的金额。</li></ul><ul><li><strong>常见坑</strong>：直接拉毛货去卖，扣杂比例全由对方说了算。</li></ul><h3 id=\"sec-13\">108｜扣水扣杂（计量规则）</h3><ul><li><strong>大白话</strong>：收购时按标准水分和标准杂质折算重量，超出部分从重量里扣。</li></ul><ul><li><strong>为什么重要</strong>：<strong>这是农产品交易里最容易吃亏的一环</strong>——同样一车货，扣水扣杂的折算公式不同，结算金额可以差出很多。合同里必须写清扣算公式和检验方式。</li></ul><ul><li><strong>常见坑</strong>：只谈单价不谈扣算规则，最后到手价远低于谈好的价。</li></ul><h3 id=\"sec-14\">109｜产后损耗率（地头到仓的账）</h3><ul><li><strong>大白话</strong>：从田里的生物产量，到最终进库可卖的商品量，中间丢掉的所有重量。</li></ul><ul><li><strong>为什么重要</strong>：机收损失 + 破碎 + 烘干失重 + 清选扣杂 + 存储损耗，<strong>逐项都不大，叠加起来可以吃掉一个项目的全部利润</strong>。算收益模型时必须用「入仓商品量」而不是「理论亩产」。</li></ul><ul><li><strong>常见坑</strong>：用品种宣传的实收亩产直接乘价格做营收预测。</li></ul><h2 id=\"sec-15\">第十一部分：销售与定价</h2><h3 id=\"sec-16\">110｜食用豆与油用豆</h3><ul><li><strong>大白话</strong>：食用豆拿去做豆腐豆浆豆浆粉，看<strong>蛋白质含量和外观</strong>；油用豆拿去榚油，看<strong>含油率</strong>。</li></ul><ul><li><strong>为什么重要</strong>：国产大豆约 <strong>72% 用于豆制品等食用</strong>领域，榚油赛道是进口转基因大豆的天下。<strong>你的项目只能打食用豆赛道</strong>，这一条倒推回品种选择、植保用药、收获外观所有环节。</li></ul><ul><li><strong>常见坑</strong>：用国际大豆期货价格（本质是榚油豆价）来估算自己的售价。</li></ul><h3 id=\"sec-17\">111｜大豆国家标准（GB 1352）与等级</h3><ul><li><strong>大白话</strong>：国家规定的大豆分级标准，按几个指标把豆子分成若干等级。</li></ul><ul><li><strong>为什么重要</strong>：<strong>等级就是价格</strong>。你卖的不是「大豆」，而是「某等级的大豆」。合同、检验、价格全部挂在这个标准上。标准号为 GB 1352（大豆）。</li></ul><ul><li><strong>常见坑</strong>：全程不看国标，到卖货时才第一次听到这些指标名词，完全不具备议价能力。</li></ul><h3 id=\"sec-18\">112｜定等指标（完整粒率、杂质、水分、损伤粒）</h3><ul><li><strong>大白话</strong>：决定等级的几个具体数字：完整粒有多少、杂质多少、水分多少、损伤粒（热损、虫蚀、霉变、破碎）多少。</li></ul><ul><li><strong>为什么重要</strong>：把前面所有环节串起来了——<strong>病害影响褐斑粒、虫害影响虫蚀粒、机收影响破碎粒、储藏影响霉变粒</strong>。这张表是整个教材的汇流点。</li></ul><ul><li><strong>常见坑</strong>：认为「产量到位就行」，忽略外观指标对单价的放大效应。</li></ul><h3 id=\"sec-19\">113｜地头价与到厂价</h3><ul><li><strong>大白话</strong>：地头价 = 购货车开到田边给的价；到厂价 = 你自己拉到加工厂门口的价。</li></ul><ul><li><strong>为什么重要</strong>：两者中间差的是运费、装卸、损耗和风险。<strong>新手听到的「市场价」几乎都是到厂价或批发价，而你实际能拿到的是地头价</strong>。算账必须用地头价。</li></ul><ul><li><strong>常见坑</strong>：用网上查的行情价做收入测算，乐观偏差很大。</li></ul><h3 id=\"sec-20\">114｜订单农业与保底收购</h3><ul><li><strong>大白话</strong>：种之前就和收购方签合同，约定数量、标准和价格（或最低保底价）。</li></ul><ul><li><strong>为什么重要</strong>：<strong>对第一年试种的你来说，这是最关键的一项风控工具</strong>。它把不可控的价格风险转成了可管理的履约风险。<strong>卖给谁，应该在播种前就定下来，而不是收完再找买家</strong>。</li></ul><ul><li><strong>常见坑</strong>：口头意向当合同；或合同只写价格不写标准与扣算规则（见卡108）。</li></ul><h3 id=\"sec-21\">115｜销售渠道类型</h3><ul><li><strong>大白话</strong>：粮贩中间商、豆制品加工厂、当地合作社、国有粮库、电商零售——每条渠道的价格、账期、要求完全不同。</li></ul><ul><li><strong>为什么重要</strong>：<strong>渠道决定单价，也决定你需要什么质量</strong>。加工厂价高但对蛋白、外观、批次一致性要求高；粮贩好卖但压价。</li></ul><ul><li><strong>常见坑</strong>：只对接了一条渠道，没有备选，讨价还价时没有任何筹码。</li></ul><h3 id=\"sec-22\">116｜非转基因标识与国产溢价</h3><ul><li><strong>大白话</strong>：国产大豆是非转基因的，这是豆制品市场的一个明确卖点。</li></ul><ul><li><strong>为什么重要</strong>：这是<strong>国产豆对抗进口豆成本劣势的核心依托</strong>。它意味着你的产品要往品质和可追溯方向做，而不是往低成本方向卷。</li></ul><ul><li><strong>常见坑</strong>：不做任何质量区隔，把豆子当大宗商品卖，放弃了唯一的溢价空间。</li></ul><h3 id=\"sec-23\">117｜豆一期货与基差</h3><ul><li><strong>大白话</strong>：豆一是大连商品交易所的国产食用大豆期货品种；基差 = 你当地的现货价 − 期货价。</li></ul><ul><li><strong>为什么重要</strong>：对你这个规模而言，<strong>期货不是用来做套保的，是用来做价格参照的</strong>。它让你在跟粮贩谈价时知道对方给的价到底偏离市场多少。</li></ul><ul><li><strong>常见坑</strong>：小规模种植者去做期货套保——合约单位、保证金、交割标准都不匹配，易变成投机。</li></ul><h3 id=\"sec-24\">118｜价格季节性（上市期压价）</h3><ul><li><strong>大白话</strong>：集中收获上市那段时间货多，价格通常是全年较低的。</li></ul><ul><li><strong>为什么重要</strong>：这是农业资金链的典型困境——<strong>最需要现金的时候，正好是价格最低的时候</strong>。能存住两三个月的人赚的就是这个存储价差。</li></ul><ul><li><strong>常见坑</strong>：资金链绷得太紧，收完必须立即变现，完全没有选时能力。<strong>这一条对你的现金流状况尤其关键</strong>。</li></ul><h3 id=\"sec-25\">119｜账期与回款风险</h3><ul><li><strong>大白话</strong>：货拉走了，钱什么时候到，到不到。</li></ul><ul><li><strong>为什么重要</strong>：农产品交易中<strong>赊账、分期、跟单是常态</strong>，中小粮贩的信用差异极大。对一个一年只回笼一次现金的项目，<strong>一笔坏账就是全年归零</strong>。</li></ul><ul><li><strong>常见坑</strong>：为了多几分钱单价接受长账期。宁可价低一点，要求款到放货或短账期。</li></ul><h3 id=\"sec-26\">120｜分级销售与溢价粒</h3><ul><li><strong>大白话</strong>：把一批豆按大小、外观分成几等，好的单独卖更高价。</li></ul><ul><li><strong>为什么重要</strong>：豆芽豆、豆腐专用豆、选种豆都比普通商品豆价高。<strong>这是你作为经营者比一般农户多出的一层利润空间</strong>，前提是品种纯、批次清、外观好。</li></ul><ul><li><strong>常见坑</strong>：几个品种混种混收混存，彻底失去分级销售的可能。</li></ul><h3 id=\"sec-27\">121｜合同要素与验收争议</h3><ul><li><strong>大白话</strong>：收购合同必须写清：数量、质量标准与检验方法、扣水扣杂公式、交货地点与时间、付款方式与期限、争议处理。</li></ul><ul><li><strong>为什么重要</strong>：农产品交易争议<strong>几乎全部发生在「质量认定」环节</strong>——谁取样、用什么仪器、争议时找哪个第三方。这些不写进合同，你在地头就没有谈判地位。</li></ul><ul><li><strong>常见坑</strong>：用对方提供的格式合同直接签，条款全向买方倾斜。</li></ul><h3 id=\"sec-28\">122｜仓单质押与代储</h3><ul><li><strong>大白话</strong>：把豆存进有资质的仓库，拿仓单去融资，或单纯付费代储。</li></ul><ul><li><strong>为什么重要</strong>：它是<strong>破解「收获期必须低价抛货」的工具</strong>（见卡118）。但要算清仓储费 + 融资成本 + 损耗，是否低于预期涨价。</li></ul><ul><li><strong>常见坑</strong>：第一年就赌存货涨价，结果价没涨、费用先吃掉利润。</li></ul><h3 id=\"sec-29\">123｜可追溯与质量凭证</h3><ul><li><strong>大白话</strong>：能拿出品种来源、用药记录、检测报告的一套材料。</li></ul><ul><li><strong>为什么重要</strong>：进入品牌豆制品厂、商超、出口渠道的<strong>门票</strong>。对你这样没有农业背景但有管理能力的投资者，<strong>这是最容易建立的差异化优势</strong>——它考的是记录和流程，不是种地经验。</li></ul><ul><li><strong>常见坑</strong>：全季不做用药和农事记录，到销售时什么都拿不出来。</li></ul><h3 id=\"sec-30\">124｜销售预案与保底线</h3><ul><li><strong>大白话</strong>：播种前就写好：主渠道、备用渠道、最低可接受价、低于此价时怎么办（存储还是减损出货）。</li></ul><ul><li><strong>为什么重要</strong>：<strong>最低可接受价就是下一讲要算的保本价</strong>。没有这条线，卖货时的所有决策都是情绪决策。</li></ul><ul><li><strong>常见坑</strong>：把销售当成收获之后才开始考虑的事。</li></ul><h2 id=\"sec-31\">本讲结论（记这四句）</h2><ol><li><strong>这个项目的利润不在田里，在收后两周。</strong>机收损失、破碎粒、烘干、扣水扣杂这几项叠加起来，足以吃掉全部毛利。</li></ol><ol><li><strong>收获决策有一个硬指标</strong>：黄熟期后至完熟期、籽粒含水率 15%–25%、茎秆 45%–55%。买一台水分测定仪。</li></ol><ol><li><strong>你卖的不是大豆，是某个等级的大豆。</strong>国标定等指标把前面六讲所有环节的结果汇成一个单价。</li></ol><ol><li><strong>卖给谁，必须在播种前定下来。</strong>订单或保底收购是第一年试种最重要的风控工具，比任何种植技术都重要。</li></ol><h2 id=\"sec-32\">待核实（本讲相关）</h2><div class=\"todo\"><span class=\"tick\">☐</span> GB 1352（大豆）现行版各等级的完整粒率、损伤粒率、杂质、水分具体限值（需核标准原文，本页不给数值）</div><div class=\"todo\"><span class=\"tick\">☐</span> 广西当地大豆地头收购价区间与主要收购主体名单（需实地询价）</div><div class=\"todo\"><span class=\"tick\">☐</span> 项目地周边烘干点的位置、产能、收费标准与是否接外单</div><div class=\"todo\"><span class=\"tick\">☐</span> 当地大豆联合收割机的作业单价与可调度数量（广西以水稻甘蔗机为主，豆机保有量需核）</div><div class=\"todo\"><span class=\"tick\">☐</span> 大豆安全储粮水分在南方高温高湿条件下的推荐值（需查储粮行业标准）</div><div class=\"todo\"><span class=\"tick\">☐</span> 当地豆制品加工企业的收购标准与蛋白质要求（承接第二讲卡片20）</div><h2 id=\"sec-33\">参考来源</h2><ul><li>农业农村部农业机械化管理司：<a href=\"https://njhs.moa.gov.cn/tzggjzcjd/202109/t20210923_6377124.htm\" target=\"_blank\" rel=\"noopener\">大豆机械化收获最佳时期与含水率指标（籽粒15%–25%、茎秆45%–55%）</a></li></ul><ul><li>新华网：<a href=\"http://www.xinhuanet.com/food/20241220/c1de7c103c114f1f984d46b53ea78a3c/c.html\" target=\"_blank\" rel=\"noopener\">国产大豆约72%用于豆制品等食用领域</a></li></ul><h2 id=\"sec-34\">修订记录</h2><div class=\"tbl-wrap\"><table><tr><td>版本</td><td>日期</td><td>修订内容</td></tr><tr><td>v1.0</td><td>2026-10-04</td><td>建立第六讲：收获与产后处理（13张卡）+ 销售与定价（15张卡）</td></tr><tr><td>v1.1</td><td>2026-10-04</td><td>校正用字：挤伤、机械烘干、榚油、瘪粒、存储价差</td></tr></table></div>"}, {"no": "09", "id": "e24165fa-cd03-48b3-aa70-12c1c866001b", "head": "第七讲", "sub": "政策补贴与农业保险", "tag": "第七讲", "num": "7", "secs": 24, "cards": 18, "mins": 4, "cardinfo": "· 18 张名词卡", "html": "<div class=\"callout\"><span class=\"co-icon\">🏛️</span><div>教材第七讲｜对应大纲第十二部分（政策补贴与保险）<ul><li>卡片格式：<strong>名词 → 大白话 → 为什么重要 → 新手最常踩的坑</strong>（卡编号接第六讲，从125开始）</li></ul><ul><li>版本：v1.0｜写作日期：2026-10-04｜对话轮次：0009</li></ul><ul><li>上游大纲：<a href=\"https://app.notion.com/p/2154c1eab76a4e9aa8111f0bd9db7e6d\" target=\"_blank\" rel=\"noopener\">广西大豆种植投资基础常识 · 全流程大纲（0001）</a>｜上一讲：<a href=\"https://app.notion.com/p/2afd5aa704b64422903a214f879e61bf\" target=\"_blank\" rel=\"noopener\">大豆教材·第六讲｜收获产后与销售定价（名词卡）</a></li></ul><ul><li>本讲定位：这是你<strong>唯一能从外部获得风险对冲的渠道</strong>。但政策有强烈的<strong>地域性和年度性</strong>，本讲只给能核到中央文件的框架和比例，所有广西本地的具体数值一律进「待核实」。</li></ul></div></div><h2 id=\"sec-1\">一、补贴体系</h2><h3 id=\"sec-2\">125｜耕地地力保护补贴</h3><ul><li><strong>大白话</strong>：国家按耕地面积发的一笔钱，目的是让耕地别抛荒、别种坏。</li></ul><ul><li><strong>为什么重要</strong>：这是覆盖面最广的一项农业补贴。但关键在于：<strong>它原则上发给承担耕地保护责任的所有权人（承包农户），而不是租地种的人</strong>。</li></ul><ul><li><strong>常见坑</strong>：投资人把它算进自己的收入，实际上这笔钱落在出租农户账上。</li></ul><h3 id=\"sec-3\">126｜生产者补贴（适用边界）</h3><ul><li><strong>大白话</strong>：按实际种了多少亩某作物来发的补贴，谁种发给谁。</li></ul><ul><li><strong>为什么重要</strong>：<strong>玉米大豆生产者补贴是东北四省区的政策，广西不在范围内</strong>。这是全国性补贴与区域性补贴的关键分界，很多网上流传的「种大豆每亩补多少钱」都是东北口径。</li></ul><ul><li><strong>常见坑</strong>：用东北的补贴标准做广西项目的收益测算，直接虚增一大块收入。</li></ul><h3 id=\"sec-4\">127｜带状复合种植专项补贴</h3><ul><li><strong>大白话</strong>：国家为推广玉米大豆带状复合种植，对采用这种模式的地块给的追加补贴。</li></ul><ul><li><strong>为什么重要</strong>：它是带状复合种植<strong>算得过账的关键变量</strong>（承第三讲卡46、第五讲卡79）——没有补贴，多出的用工和技术难度很难覆盖。但它是<strong>逐年安排的项目制补贴</strong>，不是永久政策。</li></ul><ul><li><strong>常见坑</strong>：按上一年的补贴文件做今年的预算，或没确认自己的地块是否在项目任务区内。</li></ul><h3 id=\"sec-5\">128｜补贴归属（地权人 vs 经营者）</h3><ul><li><strong>大白话</strong>：地是租来的，补贴到底归出租方还是归你。</li></ul><ul><li><strong>为什么重要</strong>：<strong>规则是按补贴类型分的</strong>：地力保护类补贴跟地（归承包户），生产行为类补贴跟种（归实际生产者）。但实操中<strong>大量争议出在流转合同没写清这一条</strong>。</li></ul><ul><li><strong>常见坑</strong>：租地合同只写租金和年限，不写补贴归属、不写配合申报义务（很多补贴需要承包户配合提供资料）。</li></ul><h3 id=\"sec-6\">129｜政策性项目申报（高标准农田、主体扶持、农机购置）</h3><ul><li><strong>大白话</strong>：除了按亩发的补贴，还有一类是要主动申报、竞争性立项的资金。</li></ul><ul><li><strong>为什么重要</strong>：<strong>这一类的金额远大于按亩补贴</strong>，而且正好考验你擅长的东西——材料、方案、合规主体、进度管理。前提是你先有合格的经营主体身份（承第一讲）。</li></ul><ul><li><strong>常见坑</strong>：全部注意力放在种地上，完全不跟县农业农村局、乡镇农服中心建立联系。</li></ul><h3 id=\"sec-7\">130｜补贴与保险的申报时间窗口</h3><ul><li><strong>大白话</strong>：每项补贴和保险都有固定的申报期、核面积期、公示期。</li></ul><ul><li><strong>为什么重要</strong>：<strong>过了窗口就是一年，没有补办</strong>。而且投保窗口通常在<strong>播种前后的一段短期内</strong>，等灾害来了再找保险公司已经来不及。</li></ul><ul><li><strong>常见坑</strong>：把这些当成「到时候再说」的行政手续，而不是写进农事日历的硬节点。</li></ul><h2 id=\"sec-8\">二、农业保险</h2><h3 id=\"sec-9\">131｜农业保险的本质（保成本，不保利润）</h3><ul><li><strong>大白话</strong>：灾害造成减产时，保险赔的是你投入的那部分钱，不是你预期赚的钱。</li></ul><ul><li><strong>为什么重要</strong>：<strong>这是理解农保的第一条，也是最多人误解的一条</strong>。农保是<strong>止损工具，不是收益保障</strong>。对你的意义是：它能保证你不被一场台风打到死，但不能保证你赚钱。</li></ul><ul><li><strong>常见坑</strong>：以为投了保就「高枕无忧」，把风险管理全部寄托在保单上。</li></ul><h3 id=\"sec-10\">132｜物化成本保险（基础形态）</h3><ul><li><strong>大白话</strong>：只赔种子、化肥、农药这些「看得见的材料钱」。</li></ul><ul><li><strong>为什么重要</strong>：这是覆盖面最广、保额最低的基础险种。<strong>它不包含地租和人工</strong>——而这两项恰恰是规模经营主体成本里最大的两块。</li></ul><ul><li><strong>常见坑</strong>：按总投入估算赔付，实际赔额远低于预期。</li></ul><h3 id=\"sec-11\">133｜完全成本保险</h3><ul><li><strong>大白话</strong>：在物化成本基础上，把<strong>土地成本和人工成本也算进来</strong>。</li></ul><ul><li><strong>为什么重要</strong>：<strong>这才是规模经营主体真正需要的险种</strong>。对于租地经营的你，地租是刚性支出，没覆盖地租的保险意义有限。<strong>但要特别注意：完全成本保险的全国性全覆盖政策明确针对的是稻谷、小麦、玉米三大粮食作物，大豆是否纳入、以什么形式纳入，必须核广西当年的实施方案</strong>。</li></ul><ul><li><strong>常见坑</strong>：默认大豆也能投完全成本保险，把它写进风控方案，结果当地根本没开办这个险种。</li></ul><h3 id=\"sec-12\">134｜种植收入保险</h3><ul><li><strong>大白话</strong>：不只管减产，还管跌价——产量×价格算出的收入低于约定水平就赔。</li></ul><ul><li><strong>为什么重要</strong>：<strong>这是唯一能覆盖价格风险的险种</strong>，对你这种一年只回笼一次现金的项目价值最大。与订单保底收购（第六讲卡114）组成双保险。同样存在品种与区域是否开办的问题。</li></ul><ul><li><strong>常见坑</strong>：认为收入险赔的是「应得收入」，实际约定水平通常仍在成本线附近。</li></ul><h3 id=\"sec-13\">135｜保障水平上限与综合费用率</h3><ul><li><strong>大白话</strong>：保额最高能设到多少，以及保险公司能从保费里抽多少做费用。</li></ul><ul><li><strong>为什么重要</strong>：财政部等四部门《关于做好农业保险高质量发展有关工作的通知》（财金〔2024〕83号）明确：<strong>保障水平原则上不高于相应作物产值的 80%，综合费用率原则上不高于 20%</strong>。这两个数字告诉你：<strong>保险结构性地赔不满</strong>，永远有一块缺口需要你自己承担。</li></ul><ul><li><strong>常见坑</strong>：按全额成本做最坏打算，没意识到至少 20% 的产值缺口是制度性的。</li></ul><h3 id=\"sec-14\">136｜保费补贴分担机制</h3><ul><li><strong>大白话</strong>：保费不是你全出，中央财政、省市县财政各出一部分。</li></ul><ul><li><strong>为什么重要</strong>：同一文件明确：中央财政对<strong>中西部及东北地区补贴 45%（东部 35%），省级财政补贴比例原则上不低于 25%</strong>。广西属西部。<strong>这意味着农保是性价比极高的风控工具</strong>——自费部分通常只是总保费的一小部分。</li></ul><ul><li><strong>常见坑</strong>：觉得保费贵而不投——实际自己掏的比例很低，这是整个项目中<strong>性价比最高的一笔支出</strong>。</li></ul><h3 id=\"sec-15\">137｜承保条件与验标</h3><ul><li><strong>大白话</strong>：投保前保险公司要核实你真的有这块地、真的种了这个作物、面积是多少。</li></ul><ul><li><strong>为什么重要</strong>：需要<strong>流转合同、地块图或测亩记录、经营主体资质</strong>。这是第一讲「先把主体和合同做规范」的现实回报点之一。</li></ul><ul><li><strong>常见坑</strong>：口头租地、面积不清、地块分散不连片，投保时过不了验标。</li></ul><h3 id=\"sec-16\">138｜定损与理赔流程</h3><ul><li><strong>大白话</strong>：出灾后报案 → 保险公司查勘 → 抽样测产定减产比例 → 按比例赔付。</li></ul><ul><li><strong>为什么重要</strong>：<strong>报案时效是硬条件</strong>，而且理赔金额取决于现场定损。<strong>所以第一讲强调的田间档案、第四讲的保苗率记录、第五讲的用药记录，到这里全部变成理赔证据</strong>。</li></ul><ul><li><strong>常见坑</strong>：灾后先清理、先补种再报案，现场已破坏，定损吃亏。</li></ul><h3 id=\"sec-17\">139｜免赔额与起赔点</h3><ul><li><strong>大白话</strong>：损失小于某个比例不赔；超过了也只赔超出部分或按比例赔。</li></ul><ul><li><strong>为什么重要</strong>：<strong>小灾不赔，这是农保的常规设计</strong>。意味着轻度湿涝、局部减产这类广西最常见的损失，很可能根本触发不了理赔。</li></ul><ul><li><strong>常见坑</strong>：投保时不问起赔点，把保险当成所有损失的缓冲垫。</li></ul><h3 id=\"sec-18\">140｜除外责任（不赔的情形）</h3><ul><li><strong>大白话</strong>：保单里写明哪些损失不在赔付范围内。</li></ul><ul><li><strong>为什么重要</strong>：<strong>「管理不善」通常是除外责任</strong>——没按时防治导致的病虫损失、排水不当导致的湿涝，都可能被拒赔或扣减。<strong>这意味着保险不能替代前六讲的管理动作</strong>。</li></ul><ul><li><strong>常见坑</strong>：签单时不读条款，出事后才发现灾因被归为管理问题。</li></ul><h3 id=\"sec-19\">141｜政策风险（年度性与地域性）</h3><ul><li><strong>大白话</strong>：今年有的补贴和险种，明年可能调整、缩减或换作物。</li></ul><ul><li><strong>为什么重要</strong>：大豆支持政策的强度跟随<strong>当年中央一号文件和大豆扩种任务</strong>波动。把多年收益模型建立在当前补贴水平上是危险的。</li></ul><ul><li><strong>常见坑</strong>：把补贴当作稳定收入写进多年投资模型。<strong>正确做法是：主模型不算补贴，补贴只算作安全垫</strong>。</li></ul><h3 id=\"sec-20\">142｜政策信息的正确渠道</h3><ul><li><strong>大白话</strong>：补贴和保险的准确信息，只能来自县级农业农村局、财政局、银保监管部门和承保公司的当年实施方案。</li></ul><ul><li><strong>为什么重要</strong>：<strong>全国性文件只定框架和上限，落到亩上多少钱、哪些品种可保，全在地方实施方案里</strong>。这一讲所有具体数字的终极来源就是这两三个窗口。</li></ul><ul><li><strong>常见坑</strong>：靠自媒体文章、短视频和农资店转述了解政策，信息滞后且常串区域。</li></ul><h2 id=\"sec-21\">本讲结论（记这四句）</h2><ol><li><strong>保险只能抢回成本，抢不回利润。</strong>而且保障水平上限是产值的 80%，结构性缺口必须由你自己承担。</li></ol><ol><li><strong>但农保仍是整个项目性价比最高的一笔支出</strong>——中央对中西部补 45%、省级不低于 25%，你自掏的只是小部分。必投。</li></ol><ol><li><strong>补贴归谁，要在流转合同里写清</strong>。地力保护类跟地、生产行为类跟种，这是租地谈判的必谈条款。</li></ol><ol><li><strong>主模型不算补贴。</strong>把补贴当安全垫而不是收入来源，这是跨年度做农业投资的基本纪律。</li></ol><h2 id=\"sec-22\">待核实（本讲相关，优先级最高）</h2><div class=\"todo\"><span class=\"tick\">☐</span> <strong>广西当年是否将大豆纳入完全成本保险或种植收入保险</strong>（关键问题，决定风控方案是否成立）</div><div class=\"todo\"><span class=\"tick\">☐</span> 广西大豆政策性保险的每亩保额、费率、各级财政分担比例与农户自缴比例</div><div class=\"todo\"><span cla
